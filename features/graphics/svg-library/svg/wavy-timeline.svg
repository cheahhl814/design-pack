<!--
design-pack · svg-library · wavy-timeline
  Hand-drawn wavy path with five pins on its crests and troughs, labels
  above crests / below troughs, ending in a paper plane.
  Tokens: teal deep-blue amber coral green text text-muted surface font-head font-sans.
  Edit: phase labels + captions. Pins sit on x = 100 + i*140 (crests at
  even i). The wave is sampled; regenerate or edit d to reshape.
  No ids/markers, safe to paste multiples.
-->
