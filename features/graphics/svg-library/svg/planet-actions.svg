<!--
design-pack · svg-library · planet-actions
  Six numbered actions staggered either side of a dashed spine that drops
  into a half-globe at the bottom (after the Venngage 'ways to save the
  planet' layout). The globe runs off the canvas; the viewBox crops it.
  Tokens: teal deep-blue amber coral green text text-muted surface border font-head font-sans.
  Edit: 6 labels + captions. Left items at y = 70 + i*84, right items at
  y = 112 + i*84; badges sit 70 px from the spine at x = 400.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Six numbered climate actions around a dashed line leading down to the planet" style="width:100%;height:auto">
  <title>Six actions for the planet</title>
  <!-- planet -->
  <g>
  <circle cx="400" cy="520" r="190" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="400" cy="520" r="190" style="fill:color-mix(in srgb, var(--teal,#0d9488) 34%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <path d="M 280 400 C 300 360 360 352 380 372 C 400 392 360 420 330 430 C 300 440 270 425 280 400 Z" style="fill:color-mix(in srgb, var(--green,#10b981) 55%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <path d="M 430 360 C 470 340 530 356 540 390 C 548 420 500 432 470 420 C 440 408 410 380 430 360 Z" style="fill:color-mix(in srgb, var(--green,#10b981) 55%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <ellipse cx="400" cy="520" rx="190" ry="70" style="fill:none;stroke:color-mix(in srgb, var(--surface,#ffffff) 60%, transparent);stroke-width:1.5"/>
  </g>
  <!-- spine -->
  <g>
  <line x1="400" y1="40" x2="400" y2="324" stroke-dasharray="6 6" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
  </g>
  <!-- actions -->
  <g>
  <line x1="400" y1="70" x2="352" y2="70" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="400" cy="70" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="330" cy="70" r="20" transform="translate(3 4)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <circle cx="330" cy="70" r="20" style="fill:var(--green,#10b981);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="330" y="75" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">1</text>
  <text x="298" y="68" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Eat more plants</text>
  <text x="298" y="86" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">lower-footprint food</text>
  <line x1="400" y1="112" x2="448" y2="112" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="400" cy="112" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="470" cy="112" r="20" transform="translate(3 4)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <circle cx="470" cy="112" r="20" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="470" y="117" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">2</text>
  <text x="502" y="110" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Travel low-carbon</text>
  <text x="502" y="128" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">walk, bike, rail, EVs</text>
  <line x1="400" y1="154" x2="352" y2="154" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="400" cy="154" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="330" cy="154" r="20" transform="translate(3 4)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <circle cx="330" cy="154" r="20" style="fill:var(--amber,#f59e0b);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="330" y="159" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">3</text>
  <text x="298" y="152" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Switch to renewables</text>
  <text x="298" y="170" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">green tariff or solar</text>
  <line x1="400" y1="196" x2="448" y2="196" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="400" cy="196" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="470" cy="196" r="20" transform="translate(3 4)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="470" cy="196" r="20" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="470" y="201" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">4</text>
  <text x="502" y="194" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Compost scraps</text>
  <text x="502" y="212" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">keep methane out of landfill</text>
  <line x1="400" y1="238" x2="352" y2="238" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="400" cy="238" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="330" cy="238" r="20" transform="translate(3 4)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <circle cx="330" cy="238" r="20" style="fill:var(--coral,#ef4444);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="330" y="243" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">5</text>
  <text x="298" y="236" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Speak up</text>
  <text x="298" y="254" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">talk climate at work, home</text>
  <line x1="400" y1="280" x2="448" y2="280" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="400" cy="280" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="470" cy="280" r="20" transform="translate(3 4)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <circle cx="470" cy="280" r="20" style="fill:var(--green,#10b981);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="470" y="285" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">6</text>
  <text x="502" y="278" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Waste less</text>
  <text x="502" y="296" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">repair, reuse, recycle</text>
  </g>
</svg>
