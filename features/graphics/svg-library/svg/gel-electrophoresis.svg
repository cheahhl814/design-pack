<!--
design-pack · svg-library · gel-electrophoresis
  Agarose gel: wells at the negative electrode, a size ladder and five
  sample lanes; DNA (negatively charged) migrates toward +, shorter
  fragments further. Ladder positions follow log10(size).
  Tokens: teal deep-blue coral text text-muted surface border font-head font-sans.
  Band y = 104 + 175 * (4 - log10(bp)). Edit LANES (sizes in bp) and the
  lane captions; sizes here are an illustrative PCR check.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Gel electrophoresis with a DNA ladder and five sample lanes, bands migrating from the negative to the positive electrode" style="width:100%;height:auto">
  <title>Gel electrophoresis</title>
  <rect x="160" y="64" width="380" height="340" rx="10" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="160" y="64" width="380" height="340" rx="10" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 14%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <!-- wells + lane names -->
  <g>
  <rect x="176" y="80" width="36" height="8" rx="2" style="fill:color-mix(in srgb, var(--text,#0f172a) 70%, var(--surface,#ffffff))"/>
  <text x="194" y="56" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">L</text>
  <rect x="228" y="80" width="36" height="8" rx="2" style="fill:color-mix(in srgb, var(--text,#0f172a) 70%, var(--surface,#ffffff))"/>
  <text x="246" y="56" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">1</text>
  <rect x="280" y="80" width="36" height="8" rx="2" style="fill:color-mix(in srgb, var(--text,#0f172a) 70%, var(--surface,#ffffff))"/>
  <text x="298" y="56" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">2</text>
  <rect x="332" y="80" width="36" height="8" rx="2" style="fill:color-mix(in srgb, var(--text,#0f172a) 70%, var(--surface,#ffffff))"/>
  <text x="350" y="56" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">3</text>
  <rect x="384" y="80" width="36" height="8" rx="2" style="fill:color-mix(in srgb, var(--text,#0f172a) 70%, var(--surface,#ffffff))"/>
  <text x="402" y="56" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">4</text>
  <rect x="436" y="80" width="36" height="8" rx="2" style="fill:color-mix(in srgb, var(--text,#0f172a) 70%, var(--surface,#ffffff))"/>
  <text x="454" y="56" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">5</text>
  <rect x="488" y="80" width="36" height="8" rx="2" style="fill:color-mix(in srgb, var(--text,#0f172a) 70%, var(--surface,#ffffff))"/>
  <text x="506" y="56" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">6</text>
  </g>
  <!-- ladder -->
  <g>
  <rect x="176" y="101" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="139.8" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="170.6" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="192.5" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="223.3" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="245.2" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="276" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="297.9" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="328.7" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <rect x="176" y="381.4" width="36" height="6" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 70%, var(--surface,#ffffff))"/>
  <text x="148" y="108" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">10 kb</text>
  <text x="148" y="199.5" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">3 kb</text>
  <text x="148" y="283" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">1 kb</text>
  <text x="148" y="335.7" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">500 bp</text>
  <text x="148" y="388.4" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">250 bp</text>
  </g>
  <!-- sample bands -->
  <g>
  <rect x="228" y="192" width="36" height="7" rx="3" style="fill:var(--teal,#0d9488)"/>
  <rect x="280" y="244.7" width="36" height="7" rx="3" style="fill:var(--teal,#0d9488)"/>
  <rect x="280" y="297.4" width="36" height="7" rx="3" style="fill:var(--teal,#0d9488)"/>
  <rect x="384" y="192" width="36" height="7" rx="3" style="fill:var(--teal,#0d9488)"/>
  <rect x="384" y="275.5" width="36" height="7" rx="3" style="fill:var(--teal,#0d9488)"/>
  <rect x="436" y="328.2" width="36" height="7" rx="3" style="fill:var(--teal,#0d9488)"/>
  <rect x="488" y="192" width="36" height="7" rx="3" style="fill:var(--teal,#0d9488)"/>
  </g>
  <!-- electrodes + migration -->
  <g>
  <circle cx="572" cy="84" r="14" style="fill:var(--text,#0f172a)"/>
  <text x="572" y="90" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--surface,#ffffff)">−</text>
  <circle cx="572" cy="388" r="14" style="fill:var(--coral,#ef4444)"/>
  <text x="572" y="394" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--surface,#ffffff)">+</text>
  <line x1="572" y1="110" x2="572" y2="346" stroke-linecap="round" style="stroke:var(--text-muted,#64748b);stroke-width:2.5"/>
  <polygon points="572,360 565.5,347 578.5,347" style="fill:var(--text-muted,#64748b)"/>
  </g>
  <!-- notes -->
  <g>
  <text x="600" y="150" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">HOW TO READ IT</text>
  <text x="600" y="176" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">DNA runs toward +</text>
  <text x="600" y="194" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">shorter ones travel further</text>
  <text x="600" y="230" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Lane L: size ladder</text>
  <text x="600" y="250" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Lanes 1, 4, 6: 3 kb product</text>
  <text x="600" y="270" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Lane 3: no band (negative)</text>
  <text x="600" y="304" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">illustrative bands</text>
  </g>
</svg>
