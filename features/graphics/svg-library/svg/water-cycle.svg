<!--
html-template-pack · svg-library · water-cycle
  Landscape water cycle: sun-driven evaporation from the ocean,
  transpiration from a tree, condensation into a cloud, wind moving
  clouds inland, precipitation over a mountain, surface runoff back to
  the sea, infiltration into the ground and groundwater flow through an
  aquifer to the sea. Science per USGS Water Science School and RSC
  teaching infographic; the ocean holds about 96% of Earth water, so it
  is labelled the largest store. Schematic, not to scale; the USGS 2022
  diagram also adds human water use, which you can append.
  Tokens: deep-blue green amber text text-muted surface font-head font-sans.
  Edit: process labels; move arrows with the shapes they connect.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Water cycle: evaporation from the ocean and transpiration from plants rise to clouds, precipitation falls on land, then runs off or infiltrates to groundwater that flows back to the sea" style="width:100%;height:auto">
