  <text x="335" y="85" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">rapid uptake</text>
  <line x1="420" y1="52" x2="420" y2="380" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="4 5"/>
