<!--
design-pack · svg-library · s-curve-adoption
  S-curve adoption / maturity: a logistic curve over four phase bands with a
  dashed bell for the rate of adoption and a "we are here" marker —
  technology adoption, product life-cycle, learning curves.
  Tokens: accent coral border-bright text text-muted surface font-head font-sans.
  Edit: phase eyebrows + captions, legend, marker label. The curve and bell
  are sampled polylines (x step 8.5); to move the marker pick a point ON the
  curve path and move the dot, leader start and label together.
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="S-shaped adoption curve over time across four phases, Emerge, Grow, Mature and Saturate, with a dashed adoption-rate bell and a We are here marker" style="width:100%;height:auto">
