<!--
design-pack · svg-library · dual-hub
  Dual hub: two central options, each with three satellite attributes,
  bridged by a shared-goal pill. Comparing two options or two teams.
  Tokens: teal amber green border-bright text text-muted surface font-head
  font-sans.
  Edit: hub titles + captions, six satellite pills (≤ 18 chars), shared pill
  and its caption. Satellites sit 175 px from each hub centre at 140/180/220°
  (mirrored on the right).
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Two hubs, Option A build in-house and Option B buy a platform, each with three attribute satellites, joined by a shared goal" style="width:100%;height:auto">
  <title>Dual hub comparison</title>
  <!-- bridge -->
  <line x1="312" y1="225" x2="488" y2="225" style="stroke:var(--border-bright,#cbd5e1);stroke-width:3" stroke-linecap="round" stroke-dasharray="2 7"/>
  <!-- hub: Option A -->
  <line x1="201" y1="266.1" x2="103.5" y2="337.5" style="stroke:var(--teal,#0d9488);stroke-width:2" stroke-linecap="round"/>
  <line x1="186" y1="225" x2="13" y2="225" style="stroke:var(--teal,#0d9488);stroke-width:2" stroke-linecap="round"/>
  <line x1="201" y1="183.9" x2="103.5" y2="112.5" style="stroke:var(--teal,#0d9488);stroke-width:2" stroke-linecap="round"/>
  <circle cx="250" cy="225" r="62" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="250" cy="225" r="62" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="250" y="223" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Option A</text>
  <text x="250" y="243" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">build in-house</text>
  <rect x="49.9" y="317.5" width="132" height="40" rx="20" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="49.9" y="317.5" width="132" height="40" rx="20" style="fill:color-mix(in srgb, var(--teal,#0d9488) 10%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:1.5"/>
  <text x="115.9" y="342.5" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Full control</text>
  <rect x="9" y="205" width="132" height="40" rx="20" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="9" y="205" width="132" height="40" rx="20" style="fill:color-mix(in srgb, var(--teal,#0d9488) 10%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:1.5"/>
  <text x="75" y="230" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Own the roadmap</text>
  <rect x="49.9" y="92.5" width="132" height="40" rx="20" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="49.9" y="92.5" width="132" height="40" rx="20" style="fill:color-mix(in srgb, var(--teal,#0d9488) 10%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:1.5"/>
  <text x="115.9" y="117.5" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Higher upfront cost</text>
  <!-- hub: Option B -->
  <line x1="599" y1="266.1" x2="696.5" y2="337.5" style="stroke:var(--amber,#f59e0b);stroke-width:2" stroke-linecap="round"/>
  <line x1="614" y1="225" x2="787" y2="225" style="stroke:var(--amber,#f59e0b);stroke-width:2" stroke-linecap="round"/>
  <line x1="599" y1="183.9" x2="696.5" y2="112.5" style="stroke:var(--amber,#f59e0b);stroke-width:2" stroke-linecap="round"/>
  <circle cx="550" cy="225" r="62" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <circle cx="550" cy="225" r="62" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="550" y="223" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Option B</text>
  <text x="550" y="243" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">buy a platform</text>
  <rect x="618.1" y="317.5" width="132" height="40" rx="20" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="618.1" y="317.5" width="132" height="40" rx="20" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 10%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
  <text x="684.1" y="342.5" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Fast to start</text>
  <rect x="659" y="205" width="132" height="40" rx="20" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="659" y="205" width="132" height="40" rx="20" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 10%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
  <text x="725" y="230" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Vendor support</text>
  <rect x="618.1" y="92.5" width="132" height="40" rx="20" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="618.1" y="92.5" width="132" height="40" rx="20" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 10%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
  <text x="684.1" y="117.5" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Licence lock-in</text>
  <!-- shared middle -->
  <rect x="345" y="207" width="110" height="36" rx="18" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <rect x="345" y="207" width="110" height="36" rx="18" style="fill:var(--surface,#ffffff);stroke:var(--green,#10b981);stroke-width:2"/>
  <text x="400" y="230" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a))">SHARED GOAL</text>
  <text x="400" y="275" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">both must hit the Q3 launch</text>
</svg>
