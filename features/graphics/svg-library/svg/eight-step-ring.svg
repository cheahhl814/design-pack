<!--
design-pack · svg-library · eight-step-ring
  Eight arrow-shaped ring segments running clockwise from the top (each
  segment's head pokes into the next), numbered, with outside labels and a
  hub title.
  Tokens: teal deep-blue amber coral green navy text text-muted surface font-head font-sans.
  Edit: 8 labels + captions, hub text. Segment i is centred on -90 + 45*i deg;
  labels sit on radius 175 from (400,225).
  No ids/markers, safe to paste multiples.
-->
