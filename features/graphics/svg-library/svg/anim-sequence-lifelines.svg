<!--
design-pack · svg-library · anim-sequence-lifelines
  Sequence diagram: three lifelines, five numbered messages, activation bars.
  After a 0.6s hold on the complete diagram each message redraws once in order
  (fill="freeze", no loop), so frame 0 and the final frame are identical.
  Tokens: teal amber deep-blue text text-muted surface font-head font-sans.
  Edit: participant names (x = 160 / 400 / 640), message rows (y step 48) and labels.
  Requests draw via stroke-dashoffset (pathLength=100); dashed responses grow via x2
  because a dash pattern cannot be dash-offset-drawn. Arrow tip stops on the bar edge.
  ANIMATED (SMIL only, README rule 8): delete the <animate*> children for a static twin.
  No ids, defs, path references or style blocks, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Sequence diagram with Client, API and Database lifelines: a POST request, a stock check and reply, an insert, and a 201 Created response" style="width:100%;height:auto">
  <title>Animated sequence diagram</title>
  <text x="40" y="40" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">SEQUENCE</text>
  <rect x="90" y="56" width="140" height="44" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <rect x="90" y="56" width="140" height="44" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="160" y="84" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Client</text>
  <line x1="160" y1="108" x2="160" y2="410" stroke-dasharray="5 5" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <rect x="330" y="56" width="140" height="44" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
    <rect x="330" y="56" width="140" height="44" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 16%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="400" y="84" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">API</text>
  <line x1="400" y1="108" x2="400" y2="410" stroke-dasharray="5 5" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <rect x="570" y="56" width="140" height="44" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
    <rect x="570" y="56" width="140" height="44" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 16%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="640" y="84" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Database</text>
  <line x1="640" y1="108" x2="640" y2="410" stroke-dasharray="5 5" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <rect x="154" y="180" width="12" height="214" rx="3" style="fill:color-mix(in srgb, var(--teal,#0d9488) 30%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:1.5">
    <animate attributeName="height" from="0" to="214" dur="0.3s" begin="0.6s" fill="freeze"/>
  </rect>
  <rect x="394" y="180" width="12" height="214" rx="3" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 30%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:1.5">
    <animate attributeName="height" from="0" to="214" dur="0.3s" begin="1.3s" fill="freeze"/>
  </rect>
  <rect x="634" y="228" width="12" height="68" rx="3" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 30%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.5">
    <animate attributeName="height" from="0" to="68" dur="0.3s" begin="2.2s" fill="freeze"/>
  </rect>
  <rect x="634" y="324" width="12" height="20" rx="3" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 30%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.5">
    <animate attributeName="height" from="0" to="20" dur="0.3s" begin="4.0s" fill="freeze"/>
  </rect>
  <g>
    <line x1="166" y1="190" x2="381" y2="190" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0" style="stroke:var(--text,#0f172a);stroke-width:2"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.7s" begin="0.6s" fill="freeze"/></line>
    <polygon points="394,190 381,196.5 381,183.5" style="fill:var(--text,#0f172a)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="0.7s" begin="0.6s" fill="freeze"/></polygon>
    <g>
      <circle cx="188" cy="176" r="11" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:2"/>
      <text x="188" y="181" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">1</text>
      <text x="206" y="181" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">POST /orders</text>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.7s" begin="0.6s" fill="freeze"/>
    </g>
  </g>
  <g>
    <line x1="406" y1="238" x2="621" y2="238" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0" style="stroke:var(--text,#0f172a);stroke-width:2"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.7s" begin="1.5s" fill="freeze"/></line>
    <polygon points="634,238 621,244.5 621,231.5" style="fill:var(--text,#0f172a)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="0.7s" begin="1.5s" fill="freeze"/></polygon>
    <g>
      <circle cx="428" cy="224" r="11" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:2"/>
      <text x="428" y="229" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">2</text>
      <text x="446" y="229" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">check stock</text>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.7s" begin="1.5s" fill="freeze"/>
    </g>
  </g>
  <g>
    <line x1="634" y1="286" x2="419" y2="286" stroke-dasharray="6 5" style="stroke:var(--text,#0f172a);stroke-width:2"><animate attributeName="x2" from="634" to="419" dur="0.7s" begin="2.4s" fill="freeze"/></line>
    <polygon points="406,286 419,292.5 419,279.5" style="fill:var(--text,#0f172a)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="0.7s" begin="2.4s" fill="freeze"/></polygon>
    <g>
      <circle cx="428" cy="272" r="11" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:2"/>
      <text x="428" y="277" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">3</text>
      <text x="446" y="277" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">stock ok</text>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.7s" begin="2.4s" fill="freeze"/>
    </g>
  </g>
  <g>
    <line x1="406" y1="334" x2="621" y2="334" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="0" style="stroke:var(--text,#0f172a);stroke-width:2"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.7s" begin="3.3s" fill="freeze"/></line>
    <polygon points="634,334 621,340.5 621,327.5" style="fill:var(--text,#0f172a)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="0.7s" begin="3.3s" fill="freeze"/></polygon>
    <g>
      <circle cx="428" cy="320" r="11" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:2"/>
      <text x="428" y="325" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">4</text>
      <text x="446" y="325" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">insert order</text>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.7s" begin="3.3s" fill="freeze"/>
    </g>
  </g>
  <g>
    <line x1="394" y1="382" x2="179" y2="382" stroke-dasharray="6 5" style="stroke:var(--text,#0f172a);stroke-width:2"><animate attributeName="x2" from="394" to="179" dur="0.7s" begin="4.2s" fill="freeze"/></line>
    <polygon points="166,382 179,388.5 179,375.5" style="fill:var(--text,#0f172a)"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="0.7s" begin="4.2s" fill="freeze"/></polygon>
    <g>
      <circle cx="188" cy="368" r="11" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:2"/>
      <text x="188" y="373" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">5</text>
      <text x="206" y="373" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">201 Created</text>
      <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.7s" begin="4.2s" fill="freeze"/>
    </g>
  </g>
  <text x="400" y="436" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">solid = request, dashed = response, bars = active</text>
</svg>
