<!--
design-pack · svg-library · circular-cladogram
Circular (fan) cladogram of 16 vertebrates: arcs and radial branches
  from a central root, tips on the outer rim with radial labels, branches
  coloured by clade.
  Tokens: deep-blue teal coral amber text text-muted surface font-head font-sans.
  Edit: taxon labels in place; to change the topology, recompute the arcs
  (tips evenly spaced over 170 to 10 degrees, node radius by depth).
  Science: lamprey outgroup to jawed vertebrates; lungfish closest to
  tetrapods; turtles sister to crocodiles + birds; birds nested in
  reptiles. "Fishes" stays uncoloured: it is a grade (paraphyletic).
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Circular cladogram of sixteen vertebrates from lamprey to human, with amphibians, mammals and reptiles including birds coloured as clades and fishes shown as a grade" style="width:100%;height:auto">
