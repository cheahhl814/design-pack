<!--
design-pack · svg-library · transformer-block
  Transformer schematic after Vaswani et al. 2017 (Attention Is All You
  Need): input embedding plus positional encoding feeds an encoder block
  (multi-head self-attention, feed-forward, each wrapped by a dashed
  residual connection and Add and Norm) repeated N times; the decoder
  block adds masked self-attention and cross-attention that takes keys
  and values from the encoder output and queries from below, then a
  linear plus softmax head gives next-token probabilities. N = 6 in the
  original paper. Post-norm placement as in the paper; many modern
  models use pre-norm. Labels kept generic; token-level detail belongs
  in text or ML tools (Transformer Explainer, Illustrated Transformer,
  Wikimedia full-architecture figure).
  Tokens: deep-blue amber teal coral text text-muted surface font-head font-sans.
  Edit: sublayer names; for a decoder-only model delete the encoder and
  the cross-attention pair.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Transformer architecture: embeddings with positional encoding feed an encoder stack of self-attention and feed-forward layers and a decoder stack of masked self-attention, cross-attention and feed-forward layers, each with residual Add and Norm, ending in linear and softmax" style="width:100%;height:auto">
