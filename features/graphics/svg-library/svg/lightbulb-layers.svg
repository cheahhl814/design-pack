<!--
design-pack · svg-library · lightbulb-layers
  Layered lightbulb: the glass is sliced into four numbered bands, each with a
  leader to a description card — idea maturation, innovation stages, layers
  of an insight.
  Tokens: amber green teal deep-blue text-muted text surface font-head font-sans.
  Edit: layer cards (title + caption), slice numbers, bottom caption. The
  slices are explicit polygons sampled from the bulb outline (no clipPath),
  so re-slicing means regenerating the polygon points; recolouring is free.
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Lightbulb sliced into four numbered layers, Spark, Insight, Prototype and Proof, each linked to a card describing it" style="width:100%;height:auto">
