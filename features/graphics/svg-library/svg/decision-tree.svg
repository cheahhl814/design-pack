  <path d="M 220 225 H 250 Q 262 225 262 213 V 132 Q 262 120 274 120 H 280" fill="none" style="stroke:var(--text-muted,#64748b);stroke-width:2" stroke-linecap="round" stroke-linejoin="round"/>
