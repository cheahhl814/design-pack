<!--
design-pack · svg-library · decision-tree
  Decision tree: a root question splits yes/no into two follow-up questions,
  each ending in two outcome cards. Rounded elbow connectors + YES/NO pills.
  Tokens: accent deep-blue green amber teal coral text text-muted surface
  font-head font-sans.
  Edit: three question labels (≤ 14 chars fit a diamond), four outcome titles
  + captions, pill words. Outcome cards sit at x 592 centred on y 62/172/282/390;
  each connector is one <path> + one arrowhead <polygon> at x 590.
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Decision tree: Build or buy leads through two follow-up questions to four outcomes, Build it, Partner, Buy it and Defer" style="width:100%;height:auto">
