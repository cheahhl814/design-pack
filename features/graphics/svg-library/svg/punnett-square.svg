<!--
design-pack · svg-library · punnett-square
  Monohybrid cross Aa × Aa: parent badges, a 2 × 2 Punnett square with
  genotype cells shaded by phenotype, and the 1:2:1 genotype / 3:1
  phenotype ratios with a small pictogram.
  Tokens: teal coral deep-blue text text-muted surface border font-head font-sans.
  Edit: allele letters and trait names. For a different cross update the
  four cells, their shading, and both ratio lines together.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Punnett square for a cross between two Aa parents giving 1 AA, 2 Aa and 1 aa, a 3 to 1 dominant to recessive ratio" style="width:100%;height:auto">
  <title>Punnett square: Aa × Aa</title>
  <!-- parents -->
  <g>
  <rect x="40" y="116" width="150" height="68" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="40" y="116" width="150" height="68" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="115" y="142" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">PARENT 1</text>
  <text x="115" y="168" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Aa</text>
  <rect x="40" y="236" width="150" height="68" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="40" y="236" width="150" height="68" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="115" y="262" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">PARENT 2</text>
  <text x="115" y="288" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Aa</text>
  <text x="115" y="216" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text-muted,#64748b)">×</text>
  <text x="115" y="342" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">both heterozygous</text>
  </g>
  <!-- gamete headers -->
  <g>
  <text x="345" y="104" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">A</text>
  <text x="268" y="182" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">A</text>
  <text x="455" y="104" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">a</text>
  <text x="268" y="292" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">a</text>
  <text x="400" y="74" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Parent 1 gametes</text>
  <text x="240" y="230" text-anchor="middle" transform="rotate(-90 240 230)" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Parent 2 gametes</text>
  </g>
  <!-- square -->
  <g>
  <rect x="290" y="120" width="220" height="220" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="290" y="120" width="110" height="110" rx="10" style="fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--surface,#ffffff));stroke:var(--surface,#ffffff);stroke-width:3"/>
  <text x="345" y="183" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">AA</text>
  <rect x="400" y="120" width="110" height="110" rx="10" style="fill:color-mix(in srgb, var(--teal,#0d9488) 30%, var(--surface,#ffffff));stroke:var(--surface,#ffffff);stroke-width:3"/>
  <text x="455" y="183" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Aa</text>
  <rect x="290" y="230" width="110" height="110" rx="10" style="fill:color-mix(in srgb, var(--teal,#0d9488) 30%, var(--surface,#ffffff));stroke:var(--surface,#ffffff);stroke-width:3"/>
  <text x="345" y="293" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Aa</text>
  <rect x="400" y="230" width="110" height="110" rx="10" style="fill:color-mix(in srgb, var(--coral,#ef4444) 45%, var(--surface,#ffffff));stroke:var(--surface,#ffffff);stroke-width:3"/>
  <text x="455" y="293" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">aa</text>
  </g>
  <!-- ratios -->
  <g>
  <text x="560" y="140" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">GENOTYPES</text>
  <text x="560" y="166" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">1 AA : 2 Aa : 1 aa</text>
  <text x="560" y="222" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">PHENOTYPES</text>
  <text x="560" y="248" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">3 dominant : 1 recessive</text>
  <circle cx="572" cy="284" r="11" style="fill:var(--teal,#0d9488)"/>
  <circle cx="602" cy="284" r="11" style="fill:var(--teal,#0d9488)"/>
  <circle cx="632" cy="284" r="11" style="fill:var(--teal,#0d9488)"/>
  <circle cx="662" cy="284" r="11" style="fill:var(--coral,#ef4444)"/>
  <text x="560" y="324" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Each cell is one equally likely</text>
  <text x="560" y="340" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">offspring outcome (25%).</text>
  </g>
</svg>
