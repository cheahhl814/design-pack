<!--
design-pack · svg-library · converging-forces
  Four corner cards (drivers / pressures / stakeholders) with fat arrows that
  converge on one central subject. Reverse the arrows (swap start/end) for
  "outputs" or "impacts" radiating outward.
  Tokens: teal amber deep-blue coral accent text text-muted surface
  font-head font-sans.
  Edit: card titles + captions (~30 chars), centre label. Cards are 210x96 at
  (30|560, 40|314); arrows run from each card's inner corner to the circle edge.
  No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Four external forces in the corners pushing inward on one central subject" style="width:100%;height:auto">
  <title>Converging forces on a subject</title>
  <!-- fat arrows: from each card corner toward the centre (drawn first, under shapes) -->
  <polygon points="240.9,146.8 310,185.2 304.6,194.8 335.3,189 324.1,159.9 318.7,169.5 249.6,131.1" style="fill:color-mix(in srgb, var(--teal,#0d9488) 40%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2" stroke-linejoin="round"/>
  <polygon points="550.4,131.1 481.3,169.5 475.9,159.9 464.7,189 495.4,194.8 490,185.2 559.1,146.8" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 40%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2" stroke-linejoin="round"/>
  <polygon points="249.6,318.9 318.7,280.5 324.1,290.1 335.3,261 304.6,255.2 310,264.8 240.9,303.2" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 40%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2" stroke-linejoin="round"/>
  <polygon points="559.1,303.2 490,264.8 495.4,255.2 464.7,261 475.9,290.1 481.3,280.5 550.4,318.9" style="fill:color-mix(in srgb, var(--coral,#ef4444) 40%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2" stroke-linejoin="round"/>
  <!-- force cards -->
  <rect x="30" y="40" width="210" height="96" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <rect x="30" y="40" width="210" height="96" rx="14" style="fill:color-mix(in srgb, var(--teal,#0d9488) 14%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <rect x="48" y="60" width="26" height="26" rx="13" style="fill:var(--teal,#0d9488)"/>
  <text x="61" y="78" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">1</text>
  <text x="86" y="79" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Customers</text>
  <text x="48" y="112" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">demand for self-service</text>
  <rect x="560" y="40" width="210" height="96" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
    <rect x="560" y="40" width="210" height="96" rx="14" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 14%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <rect x="578" y="60" width="26" height="26" rx="13" style="fill:var(--amber,#f59e0b)"/>
  <text x="591" y="78" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">2</text>
  <text x="616" y="79" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Regulation</text>
  <text x="578" y="112" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">new reporting rules</text>
  <rect x="30" y="314" width="210" height="96" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
    <rect x="30" y="314" width="210" height="96" rx="14" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 14%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <rect x="48" y="334" width="26" height="26" rx="13" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  <text x="61" y="352" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">3</text>
  <text x="86" y="353" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Technology</text>
  <text x="48" y="386" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">cheaper cloud compute</text>
  <rect x="560" y="314" width="210" height="96" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
    <rect x="560" y="314" width="210" height="96" rx="14" style="fill:color-mix(in srgb, var(--coral,#ef4444) 14%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2"/>
  <rect x="578" y="334" width="26" height="26" rx="13" style="fill:var(--coral,#ef4444)"/>
  <text x="591" y="352" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">4</text>
  <text x="616" y="353" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Competition</text>
  <text x="578" y="386" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">two new entrants</text>
  <!-- subject -->
  <circle cx="400" cy="225" r="66" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--accent,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--accent,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <circle cx="400" cy="225" r="66" style="fill:color-mix(in srgb, var(--accent,#0d9488) 18%, var(--surface,#ffffff));stroke:var(--accent,#0d9488);stroke-width:2.5"/>
  <text x="400" y="227" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:700;fill:var(--text,#0f172a)">Our product</text>
  <text x="400" y="247" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">under pressure</text>
</svg>
