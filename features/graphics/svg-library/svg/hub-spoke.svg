<!--
design-pack · svg-library · hub-spoke
  Concept map / ecosystem: central topic + 6 spokes on a 158px radius.
  Tokens: accent teal amber deep-blue green coral navy text text-muted surface
  font-head font-sans.
  Edit: centre title/caption + 6 spoke labels (1 short word, ≤8 chars at 14px).
  Satellite k sits at angle 0/-60/-120/180/120/60 degrees. No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Central hub connected to six surrounding topics" style="width:100%;height:auto">
  <title>Hub and spoke concept map</title>
  <!-- spokes (hub edge -> satellite edge) -->
  <g style="stroke:var(--text-muted,#64748b);stroke-width:2" stroke-linecap="round">
    <line x1="468" y1="225" x2="508" y2="225"/>
    <line x1="434" y1="166.1" x2="454" y2="131.5"/>
    <line x1="366" y1="166.1" x2="346" y2="131.5"/>
    <line x1="332" y1="225" x2="292" y2="225"/>
    <line x1="366" y1="283.9" x2="346" y2="318.5"/>
    <line x1="434" y1="283.9" x2="454" y2="318.5"/>
  </g>
  <!-- satellites -->
  <circle cx="558" cy="225" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <circle cx="558" cy="225" r="46" style="fill:color-mix(in srgb, var(--teal,#0d9488) 18%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="558" y="230" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Data</text>
  <circle cx="479" cy="88.2" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
    <circle cx="479" cy="88.2" r="46" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 18%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="479" y="93.2" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">People</text>
  <circle cx="321" cy="88.2" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
    <circle cx="321" cy="88.2" r="46" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 18%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="321" y="93.2" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Compute</text>
  <circle cx="242" cy="225" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
    <circle cx="242" cy="225" r="46" style="fill:color-mix(in srgb, var(--green,#10b981) 18%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  <text x="242" y="230" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Methods</text>
  <circle cx="321" cy="361.8" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
    <circle cx="321" cy="361.8" r="46" style="fill:color-mix(in srgb, var(--coral,#ef4444) 18%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2"/>
  <text x="321" y="366.8" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Ethics</text>
  <circle cx="479" cy="361.8" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--navy,#1a2744) 22%, transparent);stroke:color-mix(in srgb, var(--navy,#1a2744) 45%, transparent);stroke-width:1.5"/>
    <circle cx="479" cy="361.8" r="46" style="fill:color-mix(in srgb, var(--navy,#1a2744) 24%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--navy,#1a2744) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="479" y="366.8" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Infra</text>
  <!-- hub -->
  <circle cx="400" cy="225" r="64" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--accent,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--accent,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <circle cx="400" cy="225" r="64" style="fill:color-mix(in srgb, var(--accent,#0d9488) 20%, var(--surface,#ffffff));stroke:var(--accent,#0d9488);stroke-width:3"/>
  <text x="400" y="225" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Platform</text>
  <text x="400" y="245" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">core topic</text>
</svg>
