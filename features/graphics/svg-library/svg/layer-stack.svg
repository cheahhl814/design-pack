<!--
design-pack · svg-library · layer-stack
  4-layer architecture/stack diagram with a "closer to the user" direction cue
  and right-side owner captions. A CSS .layer-stack also exists in graphics.css —
  use this SVG for a diagram-style rendering with connectors and captions.
  Tokens: teal deep-blue amber navy border-bright text text-muted surface
  font-head font-sans.
  Edit: layer labels/captions, owner captions. Layer i at y = 48 + i*94.
  No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Four-layer stack from Interface down to Infrastructure with an owner caption per layer" style="width:100%;height:auto">
  <title>Layer stack</title>
  <!-- direction cue -->
  <line x1="92" y1="388" x2="92" y2="70" style="stroke:var(--border-bright,#cbd5e1);stroke-width:2.5" stroke-linecap="round"/>
  <polygon points="92,50 98.5,63 85.5,63" style="fill:var(--text-muted,#64748b)"/>
  <text x="0" y="0" transform="translate(76,225) rotate(-90)" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">closer to the user</text>
  <!-- layers (top = user-facing) -->
  <g>
    <rect x="130" y="48" width="380" height="74" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <rect x="130" y="48" width="380" height="74" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
    <rect x="130" y="48" width="10" height="74" rx="5" style="fill:var(--teal,#0d9488)"/>
    <text x="325" y="82" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Interface</text>
    <text x="325" y="104" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">what users touch</text>
    <rect x="130" y="142" width="380" height="74" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
    <rect x="130" y="142" width="380" height="74" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 16%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
    <rect x="130" y="142" width="10" height="74" rx="5" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
    <text x="325" y="176" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Services</text>
    <text x="325" y="198" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">business logic</text>
    <rect x="130" y="236" width="380" height="74" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
    <rect x="130" y="236" width="380" height="74" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 16%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
    <rect x="130" y="236" width="10" height="74" rx="5" style="fill:var(--amber,#f59e0b)"/>
    <text x="325" y="270" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Data</text>
    <text x="325" y="292" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">state + pipeline</text>
    <rect x="130" y="330" width="380" height="74" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--navy,#1a2744) 22%, transparent);stroke:color-mix(in srgb, var(--navy,#1a2744) 45%, transparent);stroke-width:1.5"/>
    <rect x="130" y="330" width="380" height="74" rx="12" style="fill:color-mix(in srgb, var(--navy,#1a2744) 24%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--navy,#1a2744) 55%, var(--text,#0f172a));stroke-width:2"/>
    <rect x="130" y="330" width="10" height="74" rx="5" style="fill:color-mix(in srgb, var(--navy,#1a2744) 55%, var(--text,#0f172a))"/>
    <text x="325" y="364" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Infrastructure</text>
    <text x="325" y="386" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">compute + network</text>
  </g>
  <!-- right captions -->
  <circle cx="526" cy="85" r="3.5" style="fill:var(--teal,#0d9488)"/>
  <line x1="534" y1="85" x2="630" y2="85" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <text x="640" y="90" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">owner: team A</text>
  <circle cx="526" cy="179" r="3.5" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  <line x1="534" y1="179" x2="630" y2="179" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <text x="640" y="184" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">owner: team B</text>
  <circle cx="526" cy="273" r="3.5" style="fill:var(--amber,#f59e0b)"/>
  <line x1="534" y1="273" x2="630" y2="273" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <text x="640" y="278" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">owner: team C</text>
  <circle cx="526" cy="367" r="3.5" style="fill:color-mix(in srgb, var(--navy,#1a2744) 55%, var(--text,#0f172a))"/>
  <line x1="534" y1="367" x2="630" y2="367" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <text x="640" y="372" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">owner: platform</text>
</svg>
