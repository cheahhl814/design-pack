<!--
design-pack · svg-library · helix-ribbon-timeline
  Vertical twisted ribbon (pre-computed polygons: back faces tinted, front
  faces solid) with five dated events at its turning edges, alternating
  left/right with leader lines to cards.
  Tokens: coral deep-blue text text-muted surface font-head font-sans.
  Edit: years, event labels + captions. Turning points are at y = 70 + k*70;
  keep a card's leader on its turning point.
  No ids/markers, safe to paste multiples.
-->
