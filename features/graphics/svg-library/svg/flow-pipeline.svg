<!--
design-pack · svg-library · flow-pipeline
  Horizontal 4-step process with numbered badges, forward arrows and a dashed
  feedback loop from the last step back to the first.
  Tokens: teal deep-blue amber green text text-muted surface font-head font-sans.
  Edit: step labels + captions, loop caption. Boxes sit at x = 30 + i*198
  (150 wide). Delete the loop <path> + its arrowhead for a one-way process.
  No ids/markers — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Four-step process pipeline with arrows between stages and a feedback loop from the last stage back to the first" style="width:100%;height:auto">
  <title>Four-step process pipeline</title>
  <!-- steps -->
  <g>
    <rect x="30" y="150" width="150" height="112" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <rect x="30" y="150" width="150" height="112" rx="14" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
    <circle cx="105" cy="150" r="15" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:3"/>
    <text x="105" y="155" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">1</text>
    <text x="105" y="206" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Discover</text>
    <text x="105" y="230" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">scoping and inputs</text>
    <rect x="228" y="150" width="150" height="112" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
    <rect x="228" y="150" width="150" height="112" rx="14" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 16%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
    <circle cx="303" cy="150" r="15" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke:var(--surface,#ffffff);stroke-width:3"/>
    <text x="303" y="155" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">2</text>
    <text x="303" y="206" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Design</text>
    <text x="303" y="230" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">prototype + review</text>
    <rect x="426" y="150" width="150" height="112" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
    <rect x="426" y="150" width="150" height="112" rx="14" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 16%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
    <circle cx="501" cy="150" r="15" style="fill:var(--amber,#f59e0b);stroke:var(--surface,#ffffff);stroke-width:3"/>
    <text x="501" y="155" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">3</text>
    <text x="501" y="206" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Build</text>
    <text x="501" y="230" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">implementation QA</text>
    <rect x="624" y="150" width="150" height="112" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
    <rect x="624" y="150" width="150" height="112" rx="14" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
    <circle cx="699" cy="150" r="15" style="fill:var(--green,#10b981);stroke:var(--surface,#ffffff);stroke-width:3"/>
    <text x="699" y="155" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">4</text>
    <text x="699" y="206" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Launch</text>
    <text x="699" y="230" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">monitor + iterate</text>
  </g>
  <!-- forward connectors -->
  <g style="stroke:var(--text-muted,#64748b);stroke-width:2.5" stroke-linecap="round">
    <line x1="188" y1="206" x2="212" y2="206"/>
    <line x1="386" y1="206" x2="410" y2="206"/>
    <line x1="584" y1="206" x2="608" y2="206"/>
  </g>
  <polygon points="222,206 209,212.5 209,199.5" style="fill:var(--text-muted,#64748b)"/>
  <polygon points="420,206 407,212.5 407,199.5" style="fill:var(--text-muted,#64748b)"/>
  <polygon points="618,206 605,212.5 605,199.5" style="fill:var(--text-muted,#64748b)"/>
  <!-- feedback loop: Launch back to Discover -->
  <path d="M 699 276 V 336 Q 699 352 683 352 H 121 Q 105 352 105 336 V 290" fill="none" style="stroke:var(--text-muted,#64748b);stroke-width:2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  <polygon points="105,274 111.5,287 98.5,287" style="fill:var(--text-muted,#64748b)"/>
  <text x="400" y="338" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">learnings feed the next cycle</text>
</svg>
