  <!-- section panels -->
  <g>
  <rect x="16" y="70" width="284" height="316" rx="14" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 7%, var(--surface,#ffffff));stroke:var(--border,#e2e8f0);stroke-width:1.5"/>
  <circle cx="27" cy="53" r="11" style="fill:var(--text,#0f172a)"/>
  <text x="27" y="57.5" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">1</text>
