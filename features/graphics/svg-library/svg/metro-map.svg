  <rect x="312" y="70" width="268" height="316" rx="14" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 7%, var(--surface,#ffffff));stroke:var(--border,#e2e8f0);stroke-width:1.5"/>
  <circle cx="323" cy="53" r="11" style="fill:var(--text,#0f172a)"/>
  <text x="323" y="57.5" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">2</text>
  <text x="342" y="58.5" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Align &amp; quantify</text>
  <rect x="592" y="70" width="192" height="210" rx="14" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 7%, var(--surface,#ffffff));stroke:var(--border,#e2e8f0);stroke-width:1.5"/>
