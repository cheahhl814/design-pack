<!--
design-pack · svg-library · metro-map
  Transit-map pipeline (after the nf-core metro maps): three numbered section
  panels, a bundled trunk of parallel coloured routes, a two-tool detour that
  carries the whole bundle, a three-way route split that re-merges, a dotted
  optional spur ending in a side output, file-icon inputs/outputs and a legend.
  Tokens: teal amber coral green text text-muted surface border font-head font-sans.
  Edit: station labels, file tags (FASTQ/TSV/HTML), section titles, legend text.
  Routes are one path per colour; bundle offsets are teal -6, amber 0, coral +6
  around trunk y=180. Capsules mark stations every route passes; circles mark a
  single route. Delete a route = delete its path, its circles and its legend row.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Pipeline metro map: reads pass pre-processing, split into three alignment and quantification routes that re-merge for QC and an HTML report, with an optional contamination-screening spur ending in a TSV output" style="width:100%;height:auto">
