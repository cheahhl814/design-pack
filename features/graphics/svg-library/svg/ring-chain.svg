<!--
design-pack · svg-library · ring-chain
  Five thick rings in a zig-zag chain joined by short links, numbered inside;
  labels sit above the high rings and below the low rings.
  Tokens: teal deep-blue amber coral green text text-muted surface font-head font-sans.
  Edit: labels + captions. Rings at x = 130 + i*135, y alternating 195/255.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Five linked rings in a zig-zag chain, each a numbered skill or step with a label" style="width:100%;height:auto">
  <title>Linked ring chain</title>
  <!-- links -->
  <g>
  <line x1="172" y1="213.7" x2="223" y2="236.3" stroke-linecap="round" style="stroke:var(--text-muted,#64748b);stroke-width:8"/>
  <line x1="307" y1="236.3" x2="358" y2="213.7" stroke-linecap="round" style="stroke:var(--text-muted,#64748b);stroke-width:8"/>
  <line x1="442" y1="213.7" x2="493" y2="236.3" stroke-linecap="round" style="stroke:var(--text-muted,#64748b);stroke-width:8"/>
  <line x1="577" y1="236.3" x2="628" y2="213.7" stroke-linecap="round" style="stroke:var(--text-muted,#64748b);stroke-width:8"/>
  </g>
  <!-- rings -->
  <g>
  <circle cx="130" cy="195" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="130" cy="195" r="46" style="fill:color-mix(in srgb, var(--teal,#0d9488) 14%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:12"/>
  <circle cx="130" cy="195" r="46" style="fill:none;stroke:var(--surface,#ffffff);stroke-width:1.5"/>
  <text x="130" y="202" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--teal,#0d9488)">01</text>
  <circle cx="265" cy="255" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <circle cx="265" cy="255" r="46" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 14%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:12"/>
  <circle cx="265" cy="255" r="46" style="fill:none;stroke:var(--surface,#ffffff);stroke-width:1.5"/>
  <text x="265" y="262" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">02</text>
  <circle cx="400" cy="195" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <circle cx="400" cy="195" r="46" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 14%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:12"/>
  <circle cx="400" cy="195" r="46" style="fill:none;stroke:var(--surface,#ffffff);stroke-width:1.5"/>
  <text x="400" y="202" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--amber,#f59e0b)">03</text>
  <circle cx="535" cy="255" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <circle cx="535" cy="255" r="46" style="fill:color-mix(in srgb, var(--coral,#ef4444) 14%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:12"/>
  <circle cx="535" cy="255" r="46" style="fill:none;stroke:var(--surface,#ffffff);stroke-width:1.5"/>
  <text x="535" y="262" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--coral,#ef4444)">04</text>
  <circle cx="670" cy="195" r="46" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <circle cx="670" cy="195" r="46" style="fill:color-mix(in srgb, var(--green,#10b981) 14%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:12"/>
  <circle cx="670" cy="195" r="46" style="fill:none;stroke:var(--surface,#ffffff);stroke-width:1.5"/>
  <text x="670" y="202" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--green,#10b981)">05</text>
  </g>
  <!-- labels -->
  <g>
  <text x="130" y="91" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Strategy</text>
  <text x="130" y="109" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">set direction</text>
  <text x="130" y="124" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">and priorities</text>
  <text x="265" y="337" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Data</text>
  <text x="265" y="355" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">collect, clean</text>
  <text x="265" y="370" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">and govern</text>
  <text x="400" y="91" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Analytics</text>
  <text x="400" y="109" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">turn data into</text>
  <text x="400" y="124" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">decisions</text>
  <text x="535" y="337" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Delivery</text>
  <text x="535" y="355" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">build and ship</text>
  <text x="535" y="370" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">the solution</text>
  <text x="670" y="91" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Adoption</text>
  <text x="670" y="109" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">train teams,</text>
  <text x="670" y="124" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">measure use</text>
  </g>
</svg>
