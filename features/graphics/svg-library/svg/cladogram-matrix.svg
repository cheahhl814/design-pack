<!--
design-pack · svg-library · cladogram-matrix
Character matrix to cladogram: a taxon x trait table (filled dot =
  trait present) beside the rectangular cladogram it implies, with the
  same numbered trait badges marking where each trait first appears.
  Tokens: deep-blue teal amber coral text text-muted surface font-head font-sans.
  Edit: taxa and traits. Keep the matrix and the badge positions in step.
  Science: green alga (outgroup), moss, fern, pine, flowering plant with
  embryo (land plants), vascular tissue, seeds, flowers is the standard
  land-plant sequence.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Character matrix of green alga, moss, fern, pine and flowering plant scored for protected embryo, vascular tissue, seeds and flowers, beside the cladogram it implies" style="width:100%;height:auto">
