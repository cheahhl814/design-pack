<!--
design-pack · svg-library · mind-map
  Central idea with four curved main branches to tinted topic pills, each
  fanning into three sub-topics on thin twigs.
  Tokens: accent teal deep-blue amber coral text text-muted surface font-head font-sans.
  Edit: centre text, 4 topic labels, 12 sub-topic texts. Sub-topics are
  right-aligned at x=140 (left) / left-aligned at x=660 (right).
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Mind map with a central idea branching into four topics, each with three sub-topics" style="width:100%;height:auto">
  <title>Mind map</title>
  <!-- main branches -->
  <g>
  <path d="M 330 225 C 277.5 225 277.5 110 225 110" fill="none" stroke-linecap="round" style="stroke:var(--teal,#0d9488);stroke-width:6"/>
  <path d="M 330 225 C 277.5 225 277.5 340 225 340" fill="none" stroke-linecap="round" style="stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:6"/>
  <path d="M 470 225 C 522.5 225 522.5 110 575 110" fill="none" stroke-linecap="round" style="stroke:var(--amber,#f59e0b);stroke-width:6"/>
  <path d="M 470 225 C 522.5 225 522.5 340 575 340" fill="none" stroke-linecap="round" style="stroke:var(--coral,#ef4444);stroke-width:6"/>
  </g>
  <!-- twigs + sub-topics -->
  <g>
  <path d="M 160 110 C 155 110 155 68 150 68" fill="none" stroke-linecap="round" style="stroke:var(--teal,#0d9488);stroke-width:2"/>
  <circle cx="150" cy="68" r="3.5" style="fill:var(--teal,#0d9488)"/>
  <text x="140" y="73" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Interviews</text>
  <path d="M 160 110 C 155 110 155 110 150 110" fill="none" stroke-linecap="round" style="stroke:var(--teal,#0d9488);stroke-width:2"/>
  <circle cx="150" cy="110" r="3.5" style="fill:var(--teal,#0d9488)"/>
  <text x="140" y="115" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Personas</text>
  <path d="M 160 110 C 155 110 155 152 150 152" fill="none" stroke-linecap="round" style="stroke:var(--teal,#0d9488);stroke-width:2"/>
  <circle cx="150" cy="152" r="3.5" style="fill:var(--teal,#0d9488)"/>
