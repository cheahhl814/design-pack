  <path d="M 640 110 C 645 110 645 110 650 110" fill="none" stroke-linecap="round" style="stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <circle cx="650" cy="110" r="3.5" style="fill:var(--amber,#f59e0b)"/>
  <text x="660" y="115" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Roadmap</text>
  <path d="M 640 110 C 645 110 645 152 650 152" fill="none" stroke-linecap="round" style="stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <circle cx="650" cy="152" r="3.5" style="fill:var(--amber,#f59e0b)"/>
  <text x="660" y="157" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Tech stack</text>
  <path d="M 640 340 C 645 340 645 298 650 298" fill="none" stroke-linecap="round" style="stroke:var(--coral,#ef4444);stroke-width:2"/>
  <circle cx="650" cy="298" r="3.5" style="fill:var(--coral,#ef4444)"/>
  <text x="660" y="303" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Channels</text>
  <path d="M 640 340 C 645 340 645 340 650 340" fill="none" stroke-linecap="round" style="stroke:var(--coral,#ef4444);stroke-width:2"/>
  <circle cx="650" cy="340" r="3.5" style="fill:var(--coral,#ef4444)"/>
  <text x="660" y="345" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Partnerships</text>
  <path d="M 640 340 C 645 340 645 382 650 382" fill="none" stroke-linecap="round" style="stroke:var(--coral,#ef4444);stroke-width:2"/>
