<!--
design-pack · svg-library · cladogram-anatomy
Labelled anatomy of a rectangular cladogram: root, nodes, branches,
  a clade bracket (A + B, sister taxa) and the outgroup D, with branch
  colours keyed to unique vs shared history.
  Tokens: teal coral amber text text-muted surface font-head font-sans.
  Edit: tip letters (swap for taxon names up to about 6 characters, or
  widen the tip column) and the key wording.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Annotated cladogram showing the root, a node, a branch, the clade of sister taxa A and B, taxon C and the outgroup D" style="width:100%;height:auto">
  <title>Parts of a cladogram</title>
  <!-- branches and nodes -->
  <g>
  <path d="M140 281 L190 281" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M190 281 L190 202.5 L270 202.5" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M270 202.5 L270 260 L470 260" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M190 281 L190 360 L470 360" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M270 202.5 L270 145 L370 145" style="fill:none;stroke:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M370 145 L370 110 L470 110" style="fill:none;stroke:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M370 145 L370 180 L470 180" style="fill:none;stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <circle cx="190.0" cy="281.0" r="5" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
  <circle cx="270.0" cy="202.5" r="5" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
  <circle cx="370.0" cy="145.0" r="5" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
  </g>
  <!-- tips -->
  <g>
  <circle cx="494" cy="110" r="19" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="494" cy="110" r="19" style="fill:color-mix(in srgb, var(--teal,#0d9488) 14%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a));stroke-width:2"/>
  <text x="494.0" y="117.0" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">A</text>
  <circle cx="494" cy="180" r="19" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <circle cx="494" cy="180" r="19" style="fill:color-mix(in srgb, var(--coral,#ef4444) 14%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:2"/>
  <text x="494.0" y="187.0" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">B</text>
  <circle cx="494" cy="260" r="19" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, transparent);stroke:color-mix(in srgb, var(--text-muted,#64748b) 45%, transparent);stroke-width:1.5"/>
  <circle cx="494" cy="260" r="19" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 14%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <text x="494.0" y="267.0" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">C</text>
  <circle cx="494" cy="360" r="19" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, transparent);stroke:color-mix(in srgb, var(--text-muted,#64748b) 45%, transparent);stroke-width:1.5"/>
  <circle cx="494" cy="360" r="19" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 14%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <text x="494.0" y="367.0" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">D</text>
  </g>
  <!-- labels -->
  <g>
  <text x="128.0" y="277.0" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Root</text>
  <text x="128.0" y="296.0" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">ancestor of all</text>
  <circle cx="366.0" cy="141.0" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <path d="M366.0 141.0 L334.0 100.0" stroke-dasharray="4 3" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="326.0" y="84.0" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Node</text>
  <text x="326.0" y="101.0" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">split = shared ancestor</text>
  <text x="370.0" y="292.0" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Branch</text>
  <text x="370.0" y="309.0" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">a lineage over time</text>
  <path d="M524 92 Q534 92 534 104 L534 136 Q534 145 542 145 Q534 145 534 154 L534 186 Q534 198 524 198" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="552.0" y="140.0" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Clade</text>
  <text x="552.0" y="158.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">ancestor + all descendants;</text>
  <text x="552.0" y="174.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">A and B are sister taxa</text>
  <path d="M522.0 360.0 L548.0 360.0" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"/>
  <polygon points="548,354 559,360 548,366" style="fill:var(--text-muted,#64748b)"/>
  <text x="566.0" y="356.0" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Outgroup</text>
  <text x="566.0" y="374.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">most distant; the reference</text>
  </g>
  <!-- key -->
  <g>
  <text x="600.0" y="222.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">KEY</text>
  <path d="M600.0 240.0 L624.0 240.0" style="fill:none;stroke:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="634.0" y="244.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">Unique history of A</text>
  <path d="M600.0 262.0 L624.0 262.0" style="fill:none;stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="634.0" y="266.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">Unique history of B</text>
  <path d="M600.0 284.0 L624.0 284.0" style="fill:none;stroke:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="634.0" y="288.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">Shared history of A + B</text>
  <path d="M600.0 306.0 L624.0 306.0" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="634.0" y="310.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">Other lineages</text>
  <text x="30.0" y="40.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">PARTS OF A CLADOGRAM</text>
  </g>
</svg>
