<!--
design-pack · svg-library · git-stage-flow
  Saving in git as four jobs (VizLearn framing): working tree, then
  git add to the index (staging area), git commit to the local repository,
  git push to the remote. One file changes state box by box: modified,
  staged, committed, pushed. In the remote it appears as a commit that the
  branch ref now points to: push moves commits and refs, not working files.
  A dashed arc back from the index restores the working tree
  (git checkout with a dash-dash path separator, newer form git restore).
  Tokens: amber teal green deep-blue coral text text-muted surface border font-head font-sans font-mono.
  Edit: box titles/captions, command pills, the file name and hash.
  Boxes are 136 wide, 68 apart (x 26 / 230 / 434 / 638); each arch runs
  from x+84 of one box to x+52 of the next.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Git save flow in four jobs: a modified file in the working tree is staged with git add into the index, recorded with git commit into the local repository, and shared with git push to the remote; git checkout restores the working tree from the index" style="width:100%;height:auto">
  <title>Git working tree, index, local repo and remote</title>
  <text x="40" y="40" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">SAVING IN GIT</text>
  <!-- boxes -->
  <g>
  <rect x="26" y="140" width="136" height="170" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="26" y="140" width="136" height="170" rx="14" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 10%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <rect x="230" y="140" width="136" height="170" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="230" y="140" width="136" height="170" rx="14" style="fill:color-mix(in srgb, var(--teal,#0d9488) 10%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <rect x="434" y="140" width="136" height="170" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <rect x="434" y="140" width="136" height="170" rx="14" style="fill:color-mix(in srgb, var(--green,#10b981) 10%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  <rect x="638" y="140" width="136" height="170" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="638" y="140" width="136" height="170" rx="14" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 10%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  </g>
  <!-- number badges -->
