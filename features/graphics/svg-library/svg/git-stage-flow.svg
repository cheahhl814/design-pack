  <line x1="491" y1="240" x2="513" y2="240" style="stroke:var(--green,#10b981);stroke-width:2.5"/>
  <line x1="695" y1="224" x2="715" y2="224" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <line x1="695" y1="232" x2="711" y2="232" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <line x1="695" y1="240" x2="717" y2="240" style="stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2.5"/>
