  <text x="502" y="291.5" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">committed</text>
  <rect x="662" y="276" width="88" height="22" rx="11" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 28%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.5"/>
  <text x="706" y="291.5" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">pushed</text>
  </g>
