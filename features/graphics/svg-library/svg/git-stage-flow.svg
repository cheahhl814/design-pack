  <text x="46" y="144.5" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">1</text>
  <circle cx="250" cy="140" r="11" style="fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a));stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="250" y="144.5" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">2</text>
  <circle cx="454" cy="140" r="11" style="fill:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a));stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="454" y="144.5" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">3</text>
  <circle cx="658" cy="140" r="11" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="658" y="144.5" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">4</text>
  </g>
  <!-- titles + where it lives -->
  <g text-anchor="middle">
  <text x="94" y="176" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Working tree</text>
  <text x="94" y="194" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">files on disk</text>
  <text x="298" y="176" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Index</text>
  <text x="298" y="194" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">staging area</text>
  <text x="502" y="176" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Local repo</text>
  <text x="502" y="194" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">.git history</text>
  <text x="706" y="176" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Remote</text>
  <text x="706" y="194" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">origin (e.g. GitHub)</text>
  </g>
  <!-- the file, one state per box -->
  <g stroke-linejoin="round">
  <path d="M 77 206 H 101 L 111 216 V 248 H 77 Z" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
