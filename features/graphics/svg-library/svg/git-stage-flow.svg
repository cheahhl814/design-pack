  <line x1="83" y1="232" x2="99" y2="232" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <line x1="83" y1="240" x2="105" y2="240" style="stroke:var(--amber,#f59e0b);stroke-width:2.5"/>
  <line x1="287" y1="224" x2="307" y2="224" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <line x1="287" y1="232" x2="303" y2="232" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <line x1="287" y1="240" x2="309" y2="240" style="stroke:var(--teal,#0d9488);stroke-width:2.5"/>
  <line x1="491" y1="224" x2="511" y2="224" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
