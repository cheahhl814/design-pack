  <text x="196" y="391" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">drop unstaged edits (git restore .)</text>
  </g>
  <!-- remote note -->
  <g text-anchor="middle">
  <text x="706" y="334" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">gets commits; its main</text>
  <text x="706" y="349" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">moves to c3f9</text>
  </g>
  <!-- footer -->
  <g>
  <text x="40" y="428" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Save in git is four jobs: edit the file, stage it (add), record a snapshot (commit), share it (push).</text>
  <text x="40" y="443" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Push uploads commits and moves the remote branch; it never writes files into anyone's working tree.</text>
