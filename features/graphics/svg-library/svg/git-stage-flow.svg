  <polygon points="690,140 683.5,127 696.5,127" style="fill:var(--text,#0f172a)"/>
  </g>
  <g text-anchor="middle">
  <rect x="146" y="66" width="100" height="24" rx="12" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
  <text x="196" y="83" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">git add</text>
  <rect x="350" y="66" width="100" height="24" rx="12" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
