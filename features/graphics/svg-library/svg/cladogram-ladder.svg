  <circle cx="109.0" cy="411.0" r="10" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="109.0" y="415.5" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">1</text>
  <text x="125.0" y="416.0" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Vertebrae</text>
  <path d="M214.0 318.5 L226.0 346.5" style="fill:none;stroke:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a));stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>
  <circle cx="224.0" cy="362.5" r="10" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="224.0" y="367.0" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">2</text>
  <text x="240.0" y="367.5" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Four limbs</text>
  <path d="M354.0 259.4 L366.0 287.4" style="fill:none;stroke:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a));stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>
  <circle cx="364.0" cy="303.4" r="10" style="fill:var(--green,#10b981);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="364.0" y="307.9" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">3</text>
  <text x="380.0" y="308.4" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Amniotic egg</text>
  <path d="M494.0 200.4 L506.0 228.4" style="fill:none;stroke:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a));stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>
