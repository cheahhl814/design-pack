  <text x="520.0" y="249.4" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Hair &amp; milk glands</text>
  <path d="M629.0 143.4 L641.0 171.4" style="fill:none;stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>
  <circle cx="639.0" cy="187.4" r="10" style="fill:var(--coral,#ef4444);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <text x="639.0" y="191.9" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">5</text>
  <text x="655.0" y="192.4" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Placenta</text>
  <text x="655.0" y="209.4" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">(long gestation)</text>
