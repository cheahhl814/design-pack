  <!-- captions -->
  <g>
  <text x="40.0" y="36.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">CLADOGRAM · SHARED DERIVED TRAITS</text>
  <text x="760.0" y="396.0" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Each tick marks a derived trait shared by</text>
  <text x="760.0" y="413.0" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">every taxon branching off after it.</text>
  </g>
</svg>
