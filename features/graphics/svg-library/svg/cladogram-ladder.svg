<!--
design-pack · svg-library · cladogram-ladder
Diagonal "ladder" cladogram: five taxa branch off a spine from the
  common ancestor; numbered ticks mark the shared derived traits
  (vertebrae, four limbs, amniotic egg, hair and milk glands, placenta).
  Tokens: deep-blue teal green amber coral text text-muted surface font-head font-sans.
  Edit: taxon names in the cards and trait labels. Keep each trait tick
  between the node before and the node after the taxa that share it.
  Science: shark (outgroup), frog, lizard, kangaroo, human is the standard
  vertebrate teaching set; kangaroos have only a short-lived placenta,
  hence the long-gestation qualifier.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Cladogram of shark, frog, lizard, kangaroo and human, with ticks marking vertebrae, four limbs, the amniotic egg, hair and milk glands, and a long-gestation placenta" style="width:100%;height:auto">
  <title>Cladogram ladder: shared derived traits</title>
  <!-- spine and nodes -->
  <g>
  <path d="M60.0 400.0 L700.0 130.0" style="fill:none;stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
  <text x="22.0" y="386.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">ROOT</text>
  <circle cx="150.0" cy="362.0" r="5" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
  <circle cx="290.0" cy="303.0" r="5" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
  <circle cx="430.0" cy="243.9" r="5" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
  <circle cx="570.0" cy="184.8" r="5" style="fill:var(--surface,#ffffff);stroke:var(--text,#0f172a);stroke-width:2"/>
  </g>
  <!-- taxa -->
  <g>
  <path d="M150.0 362.0 L150.0 118.0" style="fill:none;stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <rect x="95" y="74" width="110" height="44" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="95" y="74" width="110" height="44" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="150.0" y="102.0" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Shark</text>
  <path d="M290.0 303.0 L290.0 118.0" style="fill:none;stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <rect x="235" y="74" width="110" height="44" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="235" y="74" width="110" height="44" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
