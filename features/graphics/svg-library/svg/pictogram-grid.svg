<!--
design-pack · svg-library · pictogram-grid
  10 x 10 grid of person icons with N highlighted (1 icon = 1%), plus a
  headline, explanation and legend on the right.
  Tokens: teal text text-muted surface font-head font-sans.
  Edit: N (filled count), headline, captions. Icons are filled row by row;
  move a person between the two groups to change N.
  No ids/markers, safe to paste multiples.
-->
