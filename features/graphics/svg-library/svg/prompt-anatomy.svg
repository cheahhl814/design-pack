<!--
design-pack · svg-library · prompt-anatomy
  Anatomy of one shell command line: the prompt the shell prints
  (user@host:cwd then $) and the words you type after it, split by the
  shell on spaces: command, options (flags) and arguments. Coloured
  brackets mark each part; dashed leaders from a dot carry the labels
  (same pattern as iceberg-depth / target-bullseye).
  Tokens: green teal amber coral text text-muted surface border font-head font-sans font-mono.
  Edit: the command line is one monospace text run per part; at 20px each
  character is about 12 px wide, so part x = 160 + 12 * (character index).
  Move the brackets (y 184 above, y 224 below) and their leaders with the parts.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Anatomy of the command line cheahh@lab:~/chip$ grep -r &quot;TODO&quot; src/ -n: the prompt shows user, host and working directory, then the command grep, the options -r and -n, and the arguments TODO and src/" style="width:100%;height:auto">
  <title>Anatomy of a shell command line</title>
  <text x="40" y="40" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">ANATOMY OF A COMMAND LINE</text>
  <!-- terminal panel -->
  <g>
  <rect x="136" y="164" width="544" height="76" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, transparent);stroke:color-mix(in srgb, var(--text-muted,#64748b) 45%, transparent);stroke-width:1.5"/>
  <rect x="136" y="164" width="544" height="76" rx="14" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 8%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:2"/>
  </g>
  <!-- the command line, one run per part -->
  <g style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:20px;font-weight:700">
  <text x="160" y="212" style="fill:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a))">cheahh</text>
  <text x="232" y="212" style="fill:var(--text-muted,#64748b)">@</text>
  <text x="244" y="212" style="fill:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a))">lab</text>
  <text x="280" y="212" style="fill:var(--text-muted,#64748b)">:</text>
  <text x="292" y="212" style="fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">~/chip</text>
  <text x="364" y="212" style="fill:var(--text-muted,#64748b)">$</text>
  <text x="388" y="212" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a))">grep</text>
  <text x="448" y="212" style="fill:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a))">-r</text>
  <text x="484" y="212" style="fill:var(--text,#0f172a)">"TODO"</text>
  <text x="568" y="212" style="fill:var(--text,#0f172a)">src/</text>
  <text x="628" y="212" style="fill:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a))">-n</text>
  <rect x="664" y="196" width="12" height="20" rx="1" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 55%, transparent)"/>
  </g>
  <!-- brackets: prompt parts above, typed parts below -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M 160 190 V 184 H 280 V 190" style="stroke:var(--green,#10b981);stroke-width:2"/>
  <path d="M 292 190 V 184 H 364 V 190" style="stroke:var(--teal,#0d9488);stroke-width:2"/>
  <path d="M 365 190 V 184 H 375 V 190" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <path d="M 388 218 V 224 H 436 V 218" style="stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <path d="M 448 218 V 224 H 472 V 218" style="stroke:var(--coral,#ef4444);stroke-width:2"/>
  <path d="M 484 218 V 224 H 616 V 218" style="stroke:var(--text,#0f172a);stroke-width:2"/>
  <path d="M 628 218 V 224 H 652 V 218" style="stroke:var(--coral,#ef4444);stroke-width:2"/>
  </g>
  <!-- leaders (dashed, from a dot on each bracket) -->
  <g fill="none" stroke-dasharray="3 4" stroke-linejoin="round">
  <path d="M 220 184 V 146 H 150 V 122" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <path d="M 328 184 V 146 H 390 V 122" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <path d="M 370 184 V 152 H 610 V 122" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <path d="M 412 224 V 256 H 130 V 300" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <path d="M 460 224 V 270 H 320 V 300" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <path d="M 550 224 V 300" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <path d="M 640 224 V 262 H 712 V 300" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  </g>
  <g>
  <circle cx="220" cy="184" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="328" cy="184" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="370" cy="184" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="412" cy="224" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="460" cy="224" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="550" cy="224" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="640" cy="224" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  </g>
  <!-- top labels: what the shell prints -->
  <g text-anchor="middle">
  <text x="150" y="96" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">user@host</text>
  <text x="150" y="114" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">who, on which machine</text>
  <text x="390" y="96" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">working directory</text>
  <text x="390" y="114" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">~ means your home folder</text>
  <text x="610" y="96" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">prompt symbol</text>
  <text x="610" y="114" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">$ normal user, # root</text>
  </g>
  <!-- bottom labels: what you type -->
  <g text-anchor="middle">
  <text x="130" y="318" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">command</text>
  <text x="130" y="336" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">the program to run</text>
  <text x="130" y="353" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">found on $PATH</text>
  <text x="320" y="318" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">option (flag)</text>
  <text x="320" y="336" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">-r: search folders too</text>
  <text x="320" y="353" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">starts with a dash</text>
  <text x="550" y="318" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">arguments</text>
  <text x="550" y="336" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">what to find, where</text>
  <text x="550" y="353" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">quotes keep one word</text>
  <text x="712" y="318" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">option</text>
  <text x="712" y="336" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">-n: line numbers</text>
  <text x="712" y="353" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">GNU allows it last</text>
  </g>
  <!-- footer -->
  <g>
  <text x="40" y="428" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">The shell prints the prompt; you type the rest, and the shell splits it on spaces into words.</text>
  <text x="40" y="443" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">First word = command, words starting with - = options, the rest = arguments. Here: find TODO under src/, with line numbers.</text>
  </g>
</svg>
