<!--
design-pack · svg-library · plate-boundaries
  Three plate-boundary panels. Divergent: plates move apart at an
  oceanic ridge, magma rises and forms new crust (Mid-Atlantic Ridge).
  Convergent: oceanic plate subducts under a continental plate, forming a
  trench, quakes along the slab and a volcanic arc (Andes, Cascades).
  Transform: drawn in MAP view (a cross-section shows nothing), plates
  slide past along a fault that offsets a stream, shallow quakes and
  little or no volcanism (San Andreas, about 5 cm per year). Checked
  against NPS Types of Plate Boundaries, IRIS boundary animations and
  Earth at Home plate tectonics.
  Tokens: amber coral deep-blue text text-muted surface font-head font-sans.
  Edit: example names; arrows show relative plate motion.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Three plate boundaries: divergent plates pull apart at a ridge where magma forms new crust, convergent plates collide and one subducts under the other forming a trench and volcanoes, transform plates slide past each other causing earthquakes" style="width:100%;height:auto">
