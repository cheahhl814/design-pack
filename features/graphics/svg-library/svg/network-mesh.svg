  <circle cx="338" cy="372" r="20" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <circle cx="338" cy="372" r="20" style="fill:var(--surface,#ffffff);stroke:var(--coral,#ef4444);stroke-width:2"/>
  <circle cx="338" cy="372" r="8.4" style="fill:var(--coral,#ef4444)"/>
  <circle cx="566" cy="342" r="24" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <circle cx="566" cy="342" r="24" style="fill:var(--surface,#ffffff);stroke:var(--green,#10b981);stroke-width:2"/>
  <circle cx="566" cy="342" r="10.1" style="fill:var(--green,#10b981)"/>
  <circle cx="696" cy="226" r="18" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <circle cx="696" cy="226" r="18" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <circle cx="696" cy="226" r="7.6" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  <circle cx="118" cy="196" r="16" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="118" cy="196" r="16" style="fill:var(--surface,#ffffff);stroke:var(--teal,#0d9488);stroke-width:2"/>
