<!--
design-pack · svg-library · network-mesh
  Network mesh: a central node with strong ties, outer nodes sized by influence
  and joined by weaker dashed ties — stakeholder maps, ecosystems, research
  collaborations, dependency webs.
  Tokens: accent teal amber deep-blue coral green border-bright text text-muted
  surface font-head font-sans.
  Edit: node labels + captions, legend. To move a node, change its circles AND
  the x1/y1 or x2/y2 of every edge touching it (edges are listed weak-first,
  then strong, under the nodes).
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Network of eight stakeholders with a central Core node strongly tied to six others and weaker dashed ties between neighbours" style="width:100%;height:auto">
  <title>Stakeholder network</title>
  <!-- edges: weak first, then strong -->
  <line x1="228" y1="112" x2="118" y2="196" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="118" y1="196" x2="178" y2="300" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="228" y1="112" x2="590" y2="104" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="590" y1="104" x2="696" y2="226" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="696" y1="226" x2="566" y2="342" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="566" y1="342" x2="338" y2="372" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="178" y1="300" x2="338" y2="372" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <line x1="400" y1="220" x2="228" y2="112" style="stroke:color-mix(in srgb, var(--accent,#0d9488) 55%, transparent);stroke-width:2.5" stroke-linecap="round"/>
  <line x1="400" y1="220" x2="590" y2="104" style="stroke:color-mix(in srgb, var(--accent,#0d9488) 55%, transparent);stroke-width:2.5" stroke-linecap="round"/>
  <line x1="400" y1="220" x2="178" y2="300" style="stroke:color-mix(in srgb, var(--accent,#0d9488) 55%, transparent);stroke-width:2.5" stroke-linecap="round"/>
  <line x1="400" y1="220" x2="338" y2="372" style="stroke:color-mix(in srgb, var(--accent,#0d9488) 55%, transparent);stroke-width:2.5" stroke-linecap="round"/>
  <line x1="400" y1="220" x2="566" y2="342" style="stroke:color-mix(in srgb, var(--accent,#0d9488) 55%, transparent);stroke-width:2.5" stroke-linecap="round"/>
  <line x1="400" y1="220" x2="696" y2="226" style="stroke:color-mix(in srgb, var(--accent,#0d9488) 55%, transparent);stroke-width:2.5" stroke-linecap="round"/>
  <!-- nodes -->
  <circle cx="400" cy="220" r="40" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--accent,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--accent,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="400" cy="220" r="40" style="fill:color-mix(in srgb, var(--accent,#0d9488) 22%, var(--surface,#ffffff));stroke:var(--accent,#0d9488);stroke-width:2.5"/>
  <circle cx="228" cy="112" r="24" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="228" cy="112" r="24" style="fill:var(--surface,#ffffff);stroke:var(--teal,#0d9488);stroke-width:2"/>
