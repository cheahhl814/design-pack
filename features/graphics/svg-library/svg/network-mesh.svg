  <line x1="560" y1="420" x2="584" y2="420" style="stroke:color-mix(in srgb, var(--accent,#0d9488) 55%, transparent);stroke-width:2.5" stroke-linecap="round"/>
  <text x="592" y="424" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">strong tie</text>
  <line x1="560" y1="438" x2="584" y2="438" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="5 5"/>
  <text x="592" y="442" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">weak tie · size = influence</text>
