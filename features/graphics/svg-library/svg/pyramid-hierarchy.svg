<!--
design-pack · svg-library · pyramid-hierarchy
  4-level pyramid (centre x=330) with right-hand annotations; leaders start at
  each band's right edge and stop before the caption column (x=660).
  Tokens: teal deep-blue amber navy text text-muted surface font-head font-sans.
  Edit: level labels + captions (≤18 chars). Band half-widths 56→108, 117→169,
  178→230, 239→291 keep a constant slant; retune in pairs. No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Four-level pyramid from a narrow apex to a broad base, with annotations on the right" style="width:100%;height:auto">
  <title>Hierarchy pyramid</title>
  <!-- bands top -> bottom (constant slant; next band continues the edge) -->
  <g>
    <polygon points="274,44 386,44 438,116 222,116" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
    <polygon points="274,44 386,44 438,116 222,116" style="fill:color-mix(in srgb, var(--teal,#0d9488) 20%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2" stroke-linejoin="round"/>
    <text x="330" y="86" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Strategy</text>
    <polygon points="213,128 447,128 499,200 161,200" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
    <polygon points="213,128 447,128 499,200 161,200" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 20%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2" stroke-linejoin="round"/>
    <text x="330" y="170" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Programmes</text>
    <polygon points="152,212 508,212 560,284 100,284" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
    <polygon points="152,212 508,212 560,284 100,284" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 20%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2" stroke-linejoin="round"/>
    <text x="330" y="254" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Projects</text>
    <polygon points="91,296 569,296 621,368 39,368" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--navy,#1a2744) 22%, transparent);stroke:color-mix(in srgb, var(--navy,#1a2744) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
    <polygon points="91,296 569,296 621,368 39,368" style="fill:color-mix(in srgb, var(--navy,#1a2744) 26%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--navy,#1a2744) 55%, var(--text,#0f172a));stroke-width:2" stroke-linejoin="round"/>
    <text x="330" y="338" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Tasks</text>
  </g>
  <!-- right-side annotations: leader starts at the band edge, text clear of it -->
  <circle cx="420" cy="80" r="3.5" style="fill:var(--teal,#0d9488)"/>
  <line x1="426" y1="80" x2="650" y2="80" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <text x="660" y="85" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">who decides</text>
  <circle cx="481" cy="164" r="3.5" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  <line x1="487" y1="164" x2="650" y2="164" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <text x="660" y="169" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">who coordinates</text>
  <circle cx="542" cy="248" r="3.5" style="fill:var(--amber,#f59e0b)"/>
  <line x1="548" y1="248" x2="650" y2="248" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <text x="660" y="253" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">who executes</text>
  <circle cx="603" cy="332" r="3.5" style="fill:color-mix(in srgb, var(--navy,#1a2744) 55%, var(--text,#0f172a))"/>
  <line x1="609" y1="332" x2="650" y2="332" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <text x="660" y="337" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">who delivers</text>
</svg>
