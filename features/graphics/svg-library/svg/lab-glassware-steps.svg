  <text x="250" y="372" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Extract</text>
  <text x="250" y="391" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">lyse and purify</text>
  <line x1="276" y1="150" x2="362" y2="150" stroke-dasharray="5 5" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
