  <circle cx="550" cy="150" r="17" style="fill:var(--amber,#f59e0b);stroke:var(--surface,#ffffff);stroke-width:3"/>
  <text x="550" y="155" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">4</text>
  <text x="550" y="372" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Culture</text>
  <text x="550" y="391" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">incubate plates</text>
  <line x1="576" y1="150" x2="662" y2="150" stroke-dasharray="5 5" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <polygon points="674,150 663,155.5 663,144.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="700" cy="150" r="17" style="fill:var(--teal,#0d9488);stroke:var(--surface,#ffffff);stroke-width:3"/>
  <text x="700" y="155" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">5</text>
  <text x="700" y="372" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Observe</text>
  <text x="700" y="391" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">image + record</text>
