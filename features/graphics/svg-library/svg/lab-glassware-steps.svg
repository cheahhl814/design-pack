  <text x="400" y="155" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--surface,#ffffff)">3</text>
  <text x="400" y="372" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Measure</text>
  <text x="400" y="391" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">quantify volumes</text>
  <line x1="426" y1="150" x2="512" y2="150" stroke-dasharray="5 5" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
