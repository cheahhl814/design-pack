  <rect x="58" y="278" width="84" height="10" rx="2" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 30%, var(--surface,#ffffff));stroke:var(--text,#0f172a);stroke-width:2"/>
  <rect x="62" y="288" width="4" height="42" style="fill:var(--text,#0f172a)"/>
  <rect x="134" y="288" width="4" height="42" style="fill:var(--text,#0f172a)"/>
  </g>
  <!-- 2 Erlenmeyer flask -->
  <g>
