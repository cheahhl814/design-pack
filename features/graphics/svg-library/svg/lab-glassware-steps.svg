<!--
design-pack · svg-library · lab-glassware-steps
  Five numbered protocol steps, each drawn as lab equipment on one bench line:
  test-tube rack, Erlenmeyer flask, graduated cylinder, Petri dish, microscope.
  Tokens: teal deep-blue amber coral green text text-muted surface border font-head font-sans.
  Edit: step labels + captions. Items centre on x = 100 + i*150 and stand on
  y = 330; liquids are separate shapes, recolour them per step.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Five lab protocol steps drawn as glassware and a microscope on a bench" style="width:100%;height:auto">
  <title>Lab protocol steps</title>
  <!-- bench -->
  <g>
  <rect x="30" y="330" width="740" height="10" rx="3" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 18%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  </g>
  <!-- 1 test-tube rack -->
  <g>
  <path d="M 68 268 V 300 A 8 8 0 0 0 84 300 V 268 Z" style="fill:color-mix(in srgb, var(--coral,#ef4444) 55%, var(--surface,#ffffff))"/>
