  </g>
  <g style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text,#0f172a);paint-order:stroke;stroke:var(--surface,#ffffff);stroke-width:5px;stroke-linejoin:round">
  <text x="350" y="90" text-anchor="middle">setTimeout hands cb to a timer</text>
  <text x="350" y="116" text-anchor="middle">fetch starts the request</text>
  <text x="676" y="252" text-anchor="end">timer fires: cb joins the back</text>
  <text x="432" y="276">loop takes the oldest task</text>
  <text x="246" y="226" text-anchor="middle">runs it once empty</text>
  </g>
  <g>
