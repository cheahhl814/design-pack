<!--
design-pack · svg-library · async-event-loop
  The JavaScript event loop in four panels: the call stack (one thread),
  the browser's Web APIs holding a fetch and a timer, the task queue with
  three task cards (the oldest highlighted as next), and the event loop
  itself as a round arrow. Numbered messages 1 to 5 in order, like
  anim-sequence-lifelines: setTimeout hands cb to a timer, fetch starts,
  the timer fires and cb joins the back of the queue, the loop takes the
  oldest task, and runs it once the stack is empty.
  Simplified on purpose: promise callbacks (fetch then) go to a separate
  microtask queue that drains before the next task; the footer says so.
  Tokens: teal amber deep-blue text text-muted surface border font-head font-sans font-mono.
  Edit: frame names, card labels, message labels. Loop circle centre 340,196 r 50.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="JavaScript event loop: code on the single call stack hands a callback to a timer and starts a fetch in the browser's Web APIs; when the timer fires the callback joins the task queue, and the event loop moves the oldest task onto the stack once the stack is empty" style="width:100%;height:auto">
  <title>JavaScript event loop</title>
  <text x="40" y="36" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">JAVASCRIPT EVENT LOOP</text>
  <!-- panels -->
  <g>
  <rect x="30" y="56" width="180" height="244" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="30" y="56" width="180" height="244" rx="14" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <rect x="470" y="56" width="300" height="140" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="470" y="56" width="300" height="140" rx="14" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 8%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <rect x="230" y="290" width="540" height="80" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="230" y="290" width="540" height="80" rx="14" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 8%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  </g>
  <g>
  <text x="120" y="82" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Call stack</text>
  <text x="120" y="100" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">the one JS thread</text>
  <text x="486" y="82" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Web APIs</text>
  <text x="486" y="100" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">run by the browser, not your thread</text>
  <text x="250" y="324" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Task queue</text>
  <text x="250" y="342" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">first in, first out</text>
  </g>
