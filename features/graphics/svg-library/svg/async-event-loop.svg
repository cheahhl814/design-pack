  <!-- footer -->
  <g>
  <text x="40" y="404" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">One thread, one queue, never two at once.</text>
  <text x="40" y="428" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Run to completion: a task never interrupts another, and the loop moves the next task only when the call stack is empty.</text>
  <text x="40" y="443" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Simplified: promise callbacks such as fetch().then() wait in a microtask queue that empties before the next task.</text>
  </g>
</svg>
