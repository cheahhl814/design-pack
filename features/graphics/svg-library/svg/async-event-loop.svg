  <polygon points="470,96 457,89.5 457,102.5" style="fill:var(--text,#0f172a)"/>
  <polygon points="470,122 457,115.5 457,128.5" style="fill:var(--text,#0f172a)"/>
  <polygon points="690,304 683.5,291 696.5,291" style="fill:var(--text,#0f172a)"/>
