  <text x="692" y="169" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">fires after 0 ms</text>
  </g>
  <!-- task cards: oldest (front) on the left -->
  <g>
  <rect x="400" y="304" width="100" height="52" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="400" y="304" width="100" height="52" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 30%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2.5"/>
  <rect x="520" y="304" width="100" height="52" rx="12" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <rect x="640" y="304" width="100" height="52" rx="12" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:2"/>
  </g>
  <g text-anchor="middle">
  <text x="450" y="328" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">click</text>
  <text x="450" y="346" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">oldest, runs next</text>
  <text x="570" y="328" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">message</text>
  <text x="570" y="346" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">waiting</text>
  <text x="690" y="328" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">cb</text>
  <text x="690" y="346" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">newest</text>
