  <g>
  <rect x="486" y="110" width="124" height="72" rx="12" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="548" y="134" text-anchor="middle" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">fetch(url)</text>
  <text x="548" y="152" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">network request</text>
  <text x="548" y="169" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">then() → microtask</text>
  <rect x="630" y="110" width="124" height="72" rx="12" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <circle cx="654" cy="138" r="11" style="fill:none;stroke:var(--text,#0f172a);stroke-width:2"/>
  <path d="M 654 131 V 138 H 660" fill="none" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--text,#0f172a);stroke-width:2"/>
