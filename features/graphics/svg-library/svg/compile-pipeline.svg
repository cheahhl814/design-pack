<!--
design-pack · svg-library · compile-pipeline
  Source to binary: source, lexer, parser, AST (drawn as a triangle),
  optimiser and code generator, ending in an ELF binary block. Above each
  stage a tiny example of what it produces for x = a + 2*3; : the text,
  token chips, a grammar check, the AST mini-tree, the folded expression
  (2*3 becomes 6), x86-64 assembly and its machine-code bytes
  (83 C0 06 = add eax, 6). The arrow labels name what flows between stages.
  A dashed error branch drops from the parser to a diagnostics box.
  Tokens: teal amber green coral deep-blue text text-muted surface border font-head font-sans font-mono.
  Edit: stage centres are x = 70 + 110 * i (boxes 86 wide, cards 100 wide);
  replace card contents to suit your language. Phase brackets on top group
  front end / middle / back end.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Compiler pipeline: source text goes through the lexer into tokens, the parser checks the grammar and builds an abstract syntax tree, the optimiser folds 2 times 3 into 6, and the code generator emits machine code into an ELF binary; syntax errors branch from the parser to diagnostics" style="width:100%;height:auto">
  <title>Compiler pipeline from source to binary</title>
  <text x="40" y="30" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">COMPILER PIPELINE</text>
  <!-- phase brackets -->
  <g fill="none" stroke-linejoin="round" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5">
  <path d="M 22 78 V 70 H 448 V 78"/>
  <path d="M 462 78 V 70 H 558 V 78"/>
  <path d="M 572 78 V 70 H 778 V 78"/>
  </g>
  <g text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">
  <text x="235" y="62">FRONT END</text>
  <text x="510" y="62">MIDDLE</text>
  <text x="675" y="62">BACK END</text>
  </g>
  <!-- example artifact cards -->
  <g>
  <rect x="20" y="86" width="100" height="110" rx="12" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 6%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <rect x="130" y="86" width="100" height="110" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 6%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:1.5"/>
  <rect x="240" y="86" width="100" height="110" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 6%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:1.5"/>
  <rect x="350" y="86" width="100" height="110" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 6%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
  <rect x="460" y="86" width="100" height="110" rx="12" style="fill:color-mix(in srgb, var(--green,#10b981) 6%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <rect x="570" y="86" width="100" height="110" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 6%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.5"/>
  <rect x="680" y="86" width="100" height="110" rx="12" style="fill:color-mix(in srgb, var(--text,#0f172a) 6%, var(--surface,#ffffff));stroke:var(--text,#0f172a);stroke-width:1.5"/>
  </g>
  <!-- card 1: source text -->
  <text x="70" y="140" text-anchor="middle" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:11px;font-weight:700;fill:var(--text,#0f172a)">x = a + 2*3;</text>
  <!-- card 2: token chips -->
  <g style="fill:color-mix(in srgb, var(--teal,#0d9488) 20%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:1.5">
  <rect x="138" y="112" width="18" height="18" rx="4"/>
  <rect x="160" y="112" width="18" height="18" rx="4"/>
