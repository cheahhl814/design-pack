  <!-- card 6: assembly -->
  <g style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:11px;font-weight:400;fill:var(--text,#0f172a)">
  <text x="580" y="124">mov eax,[a]</text>
  <text x="580" y="144">add eax,6</text>
  <text x="580" y="164">mov [x],eax</text>
  </g>
  <!-- card 7: machine bytes -->
  <g text-anchor="middle" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:12px;font-weight:700;fill:var(--text,#0f172a)">
  <text x="730" y="124">8B 05 …</text>
  <text x="730" y="144">83 C0 06</text>
  <text x="730" y="164">89 05 …</text>
  </g>
  <!-- card captions -->
  <g text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">
  <text x="70" y="186">plain text</text>
  <text x="180" y="186">8 tokens</text>
  <text x="290" y="186">grammar OK</text>
