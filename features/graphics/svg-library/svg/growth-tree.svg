<!--
design-pack · svg-library · growth-tree
  Growth tree: canopy lobes carry visible outcomes, roots below the soil line
  carry the foundations that feed them — roots-and-fruits, inputs vs outcomes,
  theory of change at a glance.
  Tokens: green amber border-bright text text-muted surface font-head font-sans.
  Edit: five canopy labels + captions, three root labels + captions, side
  headings. The canopy is drawn three times from the same circle list
  (shadow, 4px outline, fill) so it reads as one outline — keep the lists in sync.
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Tree whose canopy holds five outcomes such as Growth, Impact and Reach, fed through the trunk by three roots, Skills, Data and Funding" style="width:100%;height:auto">
  <title>Roots and canopy tree</title>
  <!-- soil -->
  <rect x="30" y="292" width="740" height="146" rx="14" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 8%, transparent)"/>
  <!-- roots -->
  <path d="M 396 296 C 380 330 300 340 228 372" fill="none" style="stroke:var(--amber,#f59e0b);stroke-width:3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="228" cy="372" r="5" style="fill:var(--amber,#f59e0b)"/>
  <text x="228" y="398" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Skills</text>
  <text x="228" y="415" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">training budget</text>
  <path d="M 400 296 C 402 330 398 350 400 384" fill="none" style="stroke:var(--amber,#f59e0b);stroke-width:3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="384" r="5" style="fill:var(--amber,#f59e0b)"/>
  <text x="400" y="410" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Data</text>
  <text x="400" y="427" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">reliable sources</text>
  <path d="M 404 296 C 420 330 500 340 572 372" fill="none" style="stroke:var(--amber,#f59e0b);stroke-width:3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="572" cy="372" r="5" style="fill:var(--amber,#f59e0b)"/>
  <text x="572" y="398" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Funding</text>
  <text x="572" y="415" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">multi-year grant</text>
  <line x1="30" y1="292" x2="770" y2="292" style="stroke:var(--border-bright,#cbd5e1);stroke-width:2" stroke-linecap="round"/>
  <!-- trunk -->
  <polygon points="382,294 418,294 410,206 390,206" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
  <polygon points="382,294 418,294 410,206 390,206" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 30%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2" stroke-linejoin="round"/>
  <!-- canopy: shadow union, outline union, fill union (no internal arcs) -->
  <circle cx="294" cy="151" r="68" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--green,#10b981) 45%, var(--surface,#ffffff));stroke-width:3"/>
  <circle cx="404" cy="107" r="80" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--green,#10b981) 45%, var(--surface,#ffffff));stroke-width:3"/>
  <circle cx="514" cy="151" r="68" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--green,#10b981) 45%, var(--surface,#ffffff));stroke-width:3"/>
  <circle cx="349" cy="195" r="58" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--green,#10b981) 45%, var(--surface,#ffffff));stroke-width:3"/>
  <circle cx="459" cy="195" r="58" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--green,#10b981) 45%, var(--surface,#ffffff));stroke-width:3"/>
  <circle cx="290" cy="146" r="68" style="fill:none;stroke:var(--green,#10b981);stroke-width:4"/>
  <circle cx="400" cy="102" r="80" style="fill:none;stroke:var(--green,#10b981);stroke-width:4"/>
  <circle cx="510" cy="146" r="68" style="fill:none;stroke:var(--green,#10b981);stroke-width:4"/>
  <circle cx="345" cy="190" r="58" style="fill:none;stroke:var(--green,#10b981);stroke-width:4"/>
  <circle cx="455" cy="190" r="58" style="fill:none;stroke:var(--green,#10b981);stroke-width:4"/>
  <circle cx="290" cy="146" r="68" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff))"/>
  <circle cx="400" cy="102" r="80" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff))"/>
  <circle cx="510" cy="146" r="68" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff))"/>
  <circle cx="345" cy="190" r="58" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff))"/>
  <circle cx="455" cy="190" r="58" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff))"/>
  <text x="290" y="140" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Growth</text>
  <text x="290" y="158" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">+30% users</text>
  <text x="400" y="90" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Impact</text>
  <text x="400" y="108" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">cited in policy</text>
  <text x="510" y="140" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Reach</text>
  <text x="510" y="158" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">six countries</text>
  <text x="348" y="204" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Quality</text>
  <text x="348" y="222" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">fewer errors</text>
  <text x="452" y="204" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Retention</text>
  <text x="452" y="222" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">teams stay</text>
  <!-- side headings -->
  <text x="48" y="60" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a))">WHAT GROWS</text>
  <text x="48" y="78" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">visible outcomes</text>
  <text x="48" y="322" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a))">WHAT FEEDS IT</text>
  <text x="48" y="340" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">hidden foundations</text>
</svg>
