<!--
design-pack · svg-library · api-request-lifecycle
  Sequence diagram of one web API call across six lifelines: client,
  DNS, API gateway, two services and a database. Numbered solid arrows
  are requests, dashed arrows responses; the gateway self-loop is token
  validation and rate limiting; the final return is 200 OK with JSON.
  Activation bars show who is busy. Follows the client-server model
  (AlgoMaster client-server architecture, Akamai client-server
  glossary).
  Tokens: deep-blue amber teal coral green border-bright text text-muted surface font-head font-sans.
  Edit: participant names and message labels; add or drop a service by
  moving lifelines 125 px apart.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="API request lifecycle: the client resolves the domain via DNS, sends an HTTPS request to the API gateway, which validates the token and routes to service A, which calls service B and the database; responses return the same way ending in 200 OK" style="width:100%;height:auto">
