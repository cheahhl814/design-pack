<!--
design-pack · svg-library · versus-columns
  Versus columns: two option cards with a VS badge between them; each lists
  two strengths (check) and two trade-offs (dash) and a "best for" footer.
  Tokens: teal amber green coral text text-muted surface font-head font-sans.
  Edit: letters, titles + captions, four rows per side (title + caption),
  footer eyebrows. Row k sits at y = 168 + k*50; the first two rows use the
  green check, the rest the coral dash — swap the marker group to re-mark.
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Side-by-side comparison of Option A in-house platform and Option B vendor SaaS, each with two strengths, two weaknesses and a best-for verdict" style="width:100%;height:auto">
  <title>Versus comparison</title>
  <!-- column: Option A -->
  <rect x="40" y="34" width="320" height="380" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="40" y="34" width="320" height="380" rx="14" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <circle cx="92" cy="86" r="26" style="fill:color-mix(in srgb, var(--teal,#0d9488) 26%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="92" y="93" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">A</text>
  <text x="132" y="83" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Option A</text>
  <text x="132" y="103" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">in-house platform</text>
  <line x1="64" y1="132" x2="336" y2="132" style="stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5" stroke-linecap="round"/>
  <circle cx="78" cy="163" r="10" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <path d="M 73 163 l 3.5 3.5 l 6.5 -7" fill="none" style="stroke:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a));stroke-width:2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="168" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Full control</text>
  <text x="100" y="185" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">roadmap is ours</text>
  <circle cx="78" cy="213" r="10" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <path d="M 73 213 l 3.5 3.5 l 6.5 -7" fill="none" style="stroke:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a));stroke-width:2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="218" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Deep integration</text>
  <text x="100" y="235" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">fits our stack</text>
  <circle cx="78" cy="263" r="10" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:1.5"/>
  <line x1="73.5" y1="263" x2="82.5" y2="263" style="stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:2.2" stroke-linecap="round"/>
  <text x="100" y="268" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Slower start</text>
  <text x="100" y="285" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">6-month build</text>
  <circle cx="78" cy="313" r="10" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:1.5"/>
  <line x1="73.5" y1="313" x2="82.5" y2="313" style="stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:2.2" stroke-linecap="round"/>
  <text x="100" y="318" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Higher upfront cost</text>
  <text x="100" y="335" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">team of five</text>
  <rect x="60" y="368" width="280" height="30" rx="8" style="fill:color-mix(in srgb, var(--teal,#0d9488) 20%, var(--surface,#ffffff))"/>
  <text x="200" y="387" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">BEST FOR: LONG-TERM FIT</text>
  <!-- column: Option B -->
  <rect x="440" y="34" width="320" height="380" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="440" y="34" width="320" height="380" rx="14" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 8%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <circle cx="492" cy="86" r="26" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 26%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="492" y="93" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a))">B</text>
  <text x="532" y="83" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Option B</text>
  <text x="532" y="103" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">vendor SaaS</text>
  <line x1="464" y1="132" x2="736" y2="132" style="stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5" stroke-linecap="round"/>
  <circle cx="478" cy="163" r="10" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <path d="M 473 163 l 3.5 3.5 l 6.5 -7" fill="none" style="stroke:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a));stroke-width:2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="168" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Live in weeks</text>
  <text x="500" y="185" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">turnkey setup</text>
  <circle cx="478" cy="213" r="10" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <path d="M 473 213 l 3.5 3.5 l 6.5 -7" fill="none" style="stroke:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a));stroke-width:2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="500" y="218" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Vendor support</text>
  <text x="500" y="235" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">SLA included</text>
  <circle cx="478" cy="263" r="10" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:1.5"/>
  <line x1="473.5" y1="263" x2="482.5" y2="263" style="stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:2.2" stroke-linecap="round"/>
  <text x="500" y="268" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Less flexible</text>
  <text x="500" y="285" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">their roadmap</text>
  <circle cx="478" cy="313" r="10" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:1.5"/>
  <line x1="473.5" y1="313" x2="482.5" y2="313" style="stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:2.2" stroke-linecap="round"/>
  <text x="500" y="318" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Recurring licence</text>
  <text x="500" y="335" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">per-seat pricing</text>
  <rect x="460" y="368" width="280" height="30" rx="8" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 20%, var(--surface,#ffffff))"/>
  <text x="600" y="387" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a))">BEST FOR: SPEED TO VALUE</text>
  <!-- VS badge -->
  <circle cx="400" cy="224" r="30" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, transparent);stroke:color-mix(in srgb, var(--text-muted,#64748b) 45%, transparent);stroke-width:1.5"/>
  <circle cx="400" cy="224" r="30" style="fill:var(--surface,#ffffff);stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <text x="400" y="231" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">VS</text>
</svg>
