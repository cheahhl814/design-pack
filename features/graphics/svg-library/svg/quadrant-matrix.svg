<!--
design-pack · svg-library · quadrant-matrix
  2x2 prioritisation matrix: four tinted cells with an accent bar, arrowed axes
  with low/high ends.
  Tokens: green teal coral amber text text-muted surface font-head font-sans.
  Edit: axis names, 4 quadrant titles + captions. To plot items, drop
  <circle r="6"> dots + a 12px label inside the cells. No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Two-by-two matrix with Impact on the vertical axis and Effort on the horizontal" style="width:100%;height:auto">
  <title>Quadrant matrix</title>
  <!-- quadrant cells -->
  <rect x="80" y="40" width="336" height="166" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <rect x="80" y="40" width="336" height="166" rx="12" style="fill:color-mix(in srgb, var(--green,#10b981) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--green,#10b981) 70%, transparent);stroke-width:2"/>
  <rect x="102" y="110" width="6" height="34" rx="3" style="fill:var(--green,#10b981)"/>
  <text x="122" y="124" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Do first</text>
  <text x="122" y="144" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">high impact · low effort</text>
  <rect x="430" y="40" width="336" height="166" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="430" y="40" width="336" height="166" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--teal,#0d9488) 70%, transparent);stroke-width:2"/>
  <rect x="452" y="110" width="6" height="34" rx="3" style="fill:var(--teal,#0d9488)"/>
  <text x="472" y="124" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Plan</text>
  <text x="472" y="144" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">high impact · high effort</text>
  <rect x="80" y="222" width="336" height="166" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <rect x="80" y="222" width="336" height="166" rx="12" style="fill:color-mix(in srgb, var(--coral,#ef4444) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, transparent);stroke-width:2"/>
  <rect x="102" y="292" width="6" height="34" rx="3" style="fill:var(--coral,#ef4444)"/>
  <text x="122" y="306" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Question</text>
  <text x="122" y="326" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">low impact · low effort</text>
  <rect x="430" y="222" width="336" height="166" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="430" y="222" width="336" height="166" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--amber,#f59e0b) 70%, transparent);stroke-width:2"/>
  <rect x="452" y="292" width="6" height="34" rx="3" style="fill:var(--amber,#f59e0b)"/>
  <text x="472" y="306" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Fill-in</text>
  <text x="472" y="326" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">low impact · high effort</text>
  <!-- axes with explicit arrowheads -->
  <g style="stroke:var(--text-muted,#64748b);stroke-width:2" stroke-linecap="round"><line x1="80" y1="412" x2="760" y2="412"/><line x1="60" y1="392" x2="60" y2="48"/></g>
  <polygon points="773,412 760,418.5 760,405.5" style="fill:var(--text-muted,#64748b)"/>
  <polygon points="60,29 66.5,42 53.5,42" style="fill:var(--text-muted,#64748b)"/>
  <text x="80" y="436" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">low</text>
  <text x="420" y="436" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text-muted,#64748b)">Effort</text>
  <text x="760" y="436" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">high</text>
  <text x="0" y="0" transform="translate(40,220) rotate(-90)" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text-muted,#64748b)">Impact</text>
  <text x="0" y="0" transform="translate(40,392) rotate(-90)" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">low</text>
  <text x="0" y="0" transform="translate(40,48) rotate(-90)" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">high</text>
</svg>
