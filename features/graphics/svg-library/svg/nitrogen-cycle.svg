<!--
html-template-pack · svg-library · nitrogen-cycle
  Nitrogen cycle: atmospheric N2 is fixed by bacteria (Rhizobium in
  legume nodules, free-living soil bacteria) to ammonium, or by
  lightning to nitrogen oxides that reach the soil as nitrate in rain.
  Nitrifying bacteria oxidise ammonium to nitrite (Nitrosomonas) then
  nitrate (Nitrobacter); plants take up ammonium and nitrate; dead matter
  and waste return to ammonium by ammonification (decomposers);
  denitrifying bacteria in low-oxygen soil reduce nitrate back to N2.
  Checked against the BioRender and Mind the Graph nitrogen-cycle
  templates and standard textbook accounts. N2 is about 78% of air.
  Tokens: deep-blue amber green coral text text-muted surface font-head font-sans.
  Edit: labels only; the chemistry is fixed.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Nitrogen cycle: nitrogen fixation and lightning turn atmospheric N2 into ammonium and nitrate, nitrification converts ammonium to nitrite to nitrate, plants take them up, decomposers return ammonium and denitrification releases N2" style="width:100%;height:auto">
