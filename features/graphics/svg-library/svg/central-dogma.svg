<!--
design-pack · svg-library · central-dogma
  Central dogma, left to right: a DNA helix, transcription to a single mRNA
  strand (codons lettered), translation at a ribosome into a bead-chain
  protein, plus a replication loop over the DNA.
  Tokens: deep-blue teal amber coral green navy text text-muted surface font-head font-sans.
  The sequence is real: coding strand ATG GCT TCA GAA, mRNA AUG GCU UCA GAA,
  protein Met-Ala-Ser-Glu. Change all three together if you edit it.
  No ids/markers, safe to paste multiples.
-->
