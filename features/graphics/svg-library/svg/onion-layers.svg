<!--
design-pack · svg-library · onion-layers
  Half-onion: four nested half-rings on a baseline (outer context → inner core)
  with leaders to a one-line description per layer — spheres of influence,
  nested scopes, system boundaries.
  Tokens: deep-blue teal amber coral border-bright text text-muted surface
  font-head font-sans.
  Edit: layer names (on the centre line), four descriptions (≤ 28 chars),
  eyebrow. Radii 250/190/130/70 around (280, 400); a leader starts at the
  band's mid-radius on the 48° line and runs to x 588.
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Half-onion of four nested layers from Ecosystem to Organisation, Team and You at the core, with a description for each layer" style="width:100%;height:auto">
  <title>Onion layer diagram</title>
  <!-- nested half-rings, outermost first -->
  <path d="M 30 400 A 250 250 0 0 1 530 400" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
  <path d="M 30 400 A 250 250 0 0 1 530 400" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 12%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2" stroke-linejoin="round"/>
  <path d="M 90 400 A 190 190 0 0 1 470 400" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
  <path d="M 90 400 A 190 190 0 0 1 470 400" style="fill:color-mix(in srgb, var(--teal,#0d9488) 12%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2" stroke-linejoin="round"/>
  <path d="M 150 400 A 130 130 0 0 1 410 400" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
  <path d="M 150 400 A 130 130 0 0 1 410 400" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 12%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2" stroke-linejoin="round"/>
  <path d="M 210 400 A 70 70 0 0 1 350 400" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5" stroke-linejoin="round"/>
  <path d="M 210 400 A 70 70 0 0 1 350 400" style="fill:color-mix(in srgb, var(--coral,#ef4444) 26%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2" stroke-linejoin="round"/>
  <line x1="24" y1="400" x2="776" y2="400" style="stroke:var(--border-bright,#cbd5e1);stroke-width:2" stroke-linecap="round"/>
  <!-- band labels on the centre line -->
  <text x="280" y="186" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Ecosystem</text>
  <text x="280" y="246" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Organisation</text>
  <text x="280" y="306" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Team</text>
  <text x="280" y="375" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">You</text>
  <!-- leaders to the description column -->
  <text x="600" y="206" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">FROM THE CORE OUT</text>
  <line x1="427.2" y1="236.5" x2="588" y2="236.5" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="427.2" cy="236.5" r="3.5" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  <text x="600" y="241" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">market, regulators, partners</text>
  <line x1="387.1" y1="281.1" x2="588" y2="281.1" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="387.1" cy="281.1" r="3.5" style="fill:var(--teal,#0d9488)"/>
  <text x="600" y="285.6" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">policies, budget, culture</text>
  <line x1="346.9" y1="325.7" x2="588" y2="325.7" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="346.9" cy="325.7" r="3.5" style="fill:var(--amber,#f59e0b)"/>
  <text x="600" y="330.2" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">shared rituals and tools</text>
  <line x1="314.8" y1="361.4" x2="588" y2="361.4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round" stroke-dasharray="4 4"/>
  <circle cx="314.8" cy="361.4" r="3.5" style="fill:var(--coral,#ef4444)"/>
  <text x="600" y="365.9" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">skills and habits</text>
</svg>
