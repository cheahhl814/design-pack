<!--
design-pack · svg-library · fishbone-causal
  Ishikawa skeleton: spine with an arrowhead into the outcome, 4 category bones,
  2 labelled sub-cause ticks per bone (at 36% and 68% along the bone).
  Tokens: coral amber teal deep-blue text text-muted surface font-head font-sans.
  Edit: category labels, sub-cause captions (≤16 chars), outcome label.
  No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Fishbone diagram with four cause categories, each with two sub-causes, feeding one outcome box" style="width:100%;height:auto">
  <title>Cause-and-effect fishbone</title>
  <!-- spine + head arrow into the outcome -->
  <line x1="50" y1="225" x2="640" y2="225" style="stroke:var(--text-muted,#64748b);stroke-width:4" stroke-linecap="round"/>
  <polygon points="662,225 646,233 646,217" style="fill:var(--text-muted,#64748b)"/>
  <!-- bones + labelled sub-causes -->
  <line x1="290" y1="225" x2="160" y2="105" style="stroke:var(--coral,#ef4444);stroke-width:3" stroke-linecap="round"/>
  <line x1="243.2" y1="181.8" x2="191.2" y2="181.8" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round"/>
  <text x="185.2" y="185.8" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">skills gap</text>
  <line x1="201.6" y1="143.4" x2="149.6" y2="143.4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round"/>
  <text x="143.6" y="147.4" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">unclear owner</text>
  <rect x="92" y="65" width="136" height="36" rx="10" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
    <rect x="92" y="65" width="136" height="36" rx="10" style="fill:color-mix(in srgb, var(--coral,#ef4444) 18%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2"/>
  <text x="160" y="89" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">People</text>
  <line x1="520" y1="225" x2="390" y2="105" style="stroke:var(--amber,#f59e0b);stroke-width:3" stroke-linecap="round"/>
  <line x1="473.2" y1="181.8" x2="421.2" y2="181.8" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round"/>
  <text x="415.2" y="185.8" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">handoffs</text>
  <line x1="431.6" y1="143.4" x2="379.6" y2="143.4" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round"/>
  <text x="373.6" y="147.4" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">no review step</text>
  <rect x="322" y="65" width="136" height="36" rx="10" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
    <rect x="322" y="65" width="136" height="36" rx="10" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 18%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="390" y="89" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Process</text>
  <line x1="290" y1="225" x2="160" y2="345" style="stroke:var(--teal,#0d9488);stroke-width:3" stroke-linecap="round"/>
  <line x1="243.2" y1="268.2" x2="191.2" y2="268.2" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round"/>
  <text x="185.2" y="272.2" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">legacy system</text>
  <line x1="201.6" y1="306.6" x2="149.6" y2="306.6" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round"/>
  <text x="143.6" y="310.6" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">no alerts</text>
  <rect x="92" y="349" width="136" height="36" rx="10" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <rect x="92" y="349" width="136" height="36" rx="10" style="fill:color-mix(in srgb, var(--teal,#0d9488) 18%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="160" y="373" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Tools</text>
  <line x1="520" y1="225" x2="390" y2="345" style="stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:3" stroke-linecap="round"/>
  <line x1="473.2" y1="268.2" x2="421.2" y2="268.2" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round"/>
  <text x="415.2" y="272.2" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">stale inputs</text>
  <line x1="431.6" y1="306.6" x2="379.6" y2="306.6" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round"/>
  <text x="373.6" y="310.6" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">bad joins</text>
  <rect x="322" y="349" width="136" height="36" rx="10" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
    <rect x="322" y="349" width="136" height="36" rx="10" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 18%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="390" y="373" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Data</text>
  <!-- outcome -->
  <rect x="672" y="180" width="112" height="90" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
    <rect x="672" y="180" width="112" height="90" rx="12" style="fill:color-mix(in srgb, var(--coral,#ef4444) 14%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2.5"/>
  <text x="728" y="222" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:700;fill:var(--text,#0f172a)">Outcome</text>
  <text x="728" y="244" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">observed effect</text>
</svg>
