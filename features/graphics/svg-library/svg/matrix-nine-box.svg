<!--
design-pack · svg-library · matrix-nine-box
  Nine-box (3×3) matrix: two graded axes, nine tinted cells that warm from
  coral (low/low) to green (high/high) — talent grids, GE-McKinsey portfolio,
  risk likelihood × impact.
  Tokens: coral amber deep-blue teal green text text-muted surface font-head
  font-sans.
  Edit: nine titles + captions (≤ 26 chars), axis names, low/moderate/high
  ticks. Cell (row r from top, col c) sits at x = 124 + c*218, y = 24 + r*118;
  its hue = c + (2 - r) on the coral→green scale.
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Three-by-three matrix of Potential against Performance with nine labelled cells from Risk at bottom left to Star at top right" style="width:100%;height:auto">
  <title>Nine-box matrix</title>
  <rect x="124" y="24" width="210" height="110" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="124" y="24" width="210" height="110" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 11%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <rect x="144" y="61" width="6" height="36" rx="3" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  <text x="162" y="76" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Rough diamond</text>
  <text x="162" y="95" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">high potential, low output</text>
  <rect x="342" y="24" width="210" height="110" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="342" y="24" width="210" height="110" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 11%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <rect x="362" y="61" width="6" height="36" rx="3" style="fill:var(--teal,#0d9488)"/>
