<!--
design-pack · svg-library · stack-heap-memory
  One process address space as two regions. Left: the call stack with three
  frames (main, makePoint, helper), the stack pointer at the top of the
  stack and free space below where the next frame goes (stack grows down).
  Right: the heap with three malloc'd blocks and one freed gap (hatched),
  heap grows up. Pointer variables in stack frames point at heap blocks.
  Tokens: teal amber green coral text text-muted surface border font-head font-sans font-mono.
  Edit: frame names and variables (frames x 80 to 300), heap block labels
  (x 470 to 720). Each pointer is a dot on its variable row plus a curve to
  the block's left edge; move the curve end and arrowhead with the block.
  Hatch = plain diagonal lines inside the freed rect (no pattern element).
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Stack and heap in one address space: the stack holds frames for main, makePoint and helper with the stack pointer at the top, and the heap holds a list node, a 64-byte buffer and a Point with one freed gap; pointers in the frames point to the heap blocks" style="width:100%;height:auto">
  <title>Stack and heap memory</title>
  <text x="40" y="40" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">ONE PROCESS ADDRESS SPACE</text>
  <!-- address space panel -->
  <rect x="20" y="56" width="760" height="316" rx="14" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 6%, var(--surface,#ffffff));stroke:var(--border,#e2e8f0);stroke-width:1.5"/>
  <g letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">
  <text x="80" y="84">STACK</text>
  <text x="378" y="84" text-anchor="middle">POINTERS</text>
  <text x="470" y="84">HEAP</text>
  </g>
  <!-- stack frames (top of stack = helper, the active call) -->
  <g>
  <rect x="80" y="96" width="220" height="188" rx="6" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="80" y="96" width="220" height="76" rx="6" style="fill:color-mix(in srgb, var(--teal,#0d9488) 14%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <rect x="80" y="176" width="220" height="56" rx="6" style="fill:color-mix(in srgb, var(--teal,#0d9488) 24%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <rect x="80" y="236" width="220" height="48" rx="6" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <rect x="80" y="290" width="220" height="50" rx="6" style="fill:none;stroke:var(--text-muted,#64748b);stroke-width:1.5;stroke-dasharray:5 4"/>
  </g>
  <g style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);fill:var(--text,#0f172a)">
  <text x="94" y="118" style="font-size:14px;font-weight:700">main()</text>
  <text x="94" y="144" style="font-size:13px;font-weight:400">node *head</text>
  <text x="94" y="166" style="font-size:13px;font-weight:400">char *buf</text>
  <text x="94" y="198" style="font-size:14px;font-weight:700">makePoint()</text>
  <text x="94" y="222" style="font-size:13px;font-weight:400">Point *p</text>
  <text x="94" y="256" style="font-size:14px;font-weight:700">helper()</text>
  <text x="94" y="276" style="font-size:13px;font-weight:400">int i = 0</text>
  </g>
  <text x="286" y="256" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">running now</text>
  <text x="190" y="320" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">free: the next call's frame</text>
  <!-- stack pointer + growth cue -->
  <g>
  <line x1="36" y1="284" x2="67" y2="284" style="stroke:var(--text,#0f172a);stroke-width:2.5;stroke-linecap:round"/>
  <polygon points="80,284 67,277.5 67,290.5" style="fill:var(--text,#0f172a)"/>
  <text x="36" y="276" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">SP</text>
  <line x1="56" y1="300" x2="56" y2="334" style="stroke:var(--text-muted,#64748b);stroke-width:2;stroke-linecap:round"/>
  <polygon points="56,345 50.5,334 61.5,334" style="fill:var(--text-muted,#64748b)"/>
  <text x="56" y="362" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">grows</text>
  </g>
  <!-- heap blocks -->
  <g>
  <rect x="470" y="100" width="250" height="44" rx="6" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <rect x="470" y="100" width="250" height="44" rx="6" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  <rect x="470" y="158" width="250" height="50" rx="6" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <rect x="470" y="158" width="250" height="50" rx="6" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  <rect x="470" y="222" width="250" height="40" rx="6" style="fill:color-mix(in srgb, var(--coral,#ef4444) 6%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:1.5;stroke-dasharray:5 4"/>
  <rect x="470" y="276" width="250" height="40" rx="6" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <rect x="470" y="276" width="250" height="40" rx="6" style="fill:color-mix(in srgb, var(--green,#10b981) 16%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  </g>
  <!-- freed gap hatch -->
  <g stroke-linecap="round" style="stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5">
  <line x1="476" y1="260" x2="512" y2="224"/>
  <line x1="490" y1="260" x2="526" y2="224"/>
  <line x1="504" y1="260" x2="540" y2="224"/>
  <line x1="518" y1="260" x2="554" y2="224"/>
  <line x1="532" y1="260" x2="568" y2="224"/>
  <line x1="546" y1="260" x2="582" y2="224"/>
  <line x1="560" y1="260" x2="596" y2="224"/>
  <line x1="574" y1="260" x2="610" y2="224"/>
  <line x1="588" y1="260" x2="624" y2="224"/>
  <line x1="602" y1="260" x2="638" y2="224"/>
  <line x1="616" y1="260" x2="652" y2="224"/>
  <line x1="630" y1="260" x2="666" y2="224"/>
  <line x1="644" y1="260" x2="680" y2="224"/>
  <line x1="658" y1="260" x2="694" y2="224"/>
  <line x1="672" y1="260" x2="708" y2="224"/>
  </g>
  <g text-anchor="middle">
  <text x="595" y="120" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">struct node</text>
  <text x="595" y="137" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">16 bytes</text>
  <text x="595" y="181" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">char[64]</text>
  <text x="595" y="198" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">64 bytes</text>
  <text x="595" y="247" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));paint-order:stroke;stroke:var(--surface,#ffffff);stroke-width:5px;stroke-linejoin:round">freed: reusable gap</text>
  <text x="595" y="294" style="font-family:var(--font-mono,ui-monospace,Menlo,Consolas,monospace);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Point {x, y}</text>
  <text x="595" y="309" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">8 bytes</text>
  </g>
  <!-- heap growth cue -->
  <g>
  <line x1="748" y1="316" x2="748" y2="115" style="stroke:var(--text-muted,#64748b);stroke-width:2;stroke-linecap:round"/>
  <polygon points="748,104 742.5,115 753.5,115" style="fill:var(--text-muted,#64748b)"/>
  <text x="748" y="336" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">grows</text>
  </g>
  <!-- pointers: stack variables to heap blocks -->
  <g fill="none" stroke-linecap="round">
  <path d="M 286 140 C 380 140 380 122 457 122" style="stroke:var(--text,#0f172a);stroke-width:2.5"/>
  <path d="M 286 162 C 380 162 380 183 457 183" style="stroke:var(--text,#0f172a);stroke-width:2.5"/>
  <path d="M 286 218 C 380 218 380 296 457 296" style="stroke:var(--text,#0f172a);stroke-width:2.5"/>
  </g>
  <g>
  <circle cx="286" cy="140" r="3.5" style="fill:var(--text,#0f172a)"/>
  <circle cx="286" cy="162" r="3.5" style="fill:var(--text,#0f172a)"/>
  <circle cx="286" cy="218" r="3.5" style="fill:var(--text,#0f172a)"/>
  <polygon points="470,122 457,115.5 457,128.5" style="fill:var(--text,#0f172a)"/>
  <polygon points="470,183 457,176.5 457,189.5" style="fill:var(--text,#0f172a)"/>
  <polygon points="470,296 457,289.5 457,302.5" style="fill:var(--text,#0f172a)"/>
  </g>
  <!-- region notes -->
  <g text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">
  <text x="190" y="362">pushed on call, popped on return</text>
  <text x="595" y="342">malloc() takes, free() gives back</text>
  </g>
  <!-- footer -->
  <g>
  <text x="40" y="428" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">The stack grows on every call and is freed on return; the heap lives until freed.</text>
  <text x="40" y="443" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">When makePoint() returns, p vanishes but its Point stays on the heap until free(); lose every pointer to it and it leaks.</text>
  </g>
</svg>
