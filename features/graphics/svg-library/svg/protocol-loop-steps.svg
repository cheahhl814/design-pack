    <line x1="426" y1="356" x2="396" y2="356"/>
    <line x1="228" y1="356" x2="198" y2="356"/>
  </g>
  <polygon points="580,356 593,362.5 593,349.5" style="fill:var(--text-muted,#64748b)"/>
  <polygon points="382,356 395,362.5 395,349.5" style="fill:var(--text-muted,#64748b)"/>
  <polygon points="184,356 197,362.5 197,349.5" style="fill:var(--text-muted,#64748b)"/>
  <!-- reuse loop: sequence back to prime and load -->
  <path d="M 105 412 V 438 H 303 V 428" fill="none" style="stroke:var(--text-muted,#64748b);stroke-width:2.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  <polygon points="303,412 296.5,426 309.5,426" style="fill:var(--text-muted,#64748b)"/>
  <text x="500" y="444" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">wash kit rinse, reload next pool (3 to 6 reuse cycles)</text>
</svg>