<!--
design-pack · svg-library · spiral-growth
  Spiral growth: an Archimedean spiral winding outward through five numbered
  stations keyed to a legend — compounding growth, iterative deepening,
  learning spirals.
  Tokens: accent teal deep-blue amber green coral text text-muted surface
  font-head font-sans.
  Edit: legend labels + captions, eyebrow. Spiral r = 14 + 13.6θ around
  (280, 236), two turns; station k sits at θ = 4π(k+1)/5 (the last nudged
  back 0.35 rad so it clears the arrowhead).
  No ids/markers/defs — safe to paste multiples.
-->
