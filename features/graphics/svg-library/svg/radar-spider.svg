<!--
design-pack · svg-library · radar-spider
  Six-axis radar (spider) summary: current profile (filled) vs target (dashed)
  plus a legend and takeaway. A concept summary — for real, interactive data
  use chartz.
  Tokens: teal amber coral green border-bright text text-muted surface
  font-head font-sans.
  Edit: axis labels; scores move vertex k to (290 + 150*s*cos(a), 232 + 150*s*sin(a))
  with a = -90° + 60°*k (k=0 top, clockwise), s in 0..1. Update both polygons
  and the dots group together. No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Six-axis radar comparing current scores against targets, with the largest gap on Scale" style="width:100%;height:auto">
  <title>Radar summary: current vs target</title>
  <!-- grid: 4 hexagon rings + 6 spokes -->
  <g fill="none" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.2">
    <polygon points="290,194.5 322.5,213.2 322.5,250.8 290,269.5 257.5,250.8 257.5,213.2"/>
    <polygon points="290,157 355,194.5 355,269.5 290,307 225,269.5 225,194.5"/>
    <polygon points="290,119.5 387.4,175.8 387.4,288.2 290,344.5 192.6,288.2 192.6,175.8"/>
    <polygon points="290,82 419.9,157 419.9,307 290,382 160.1,307 160.1,157"/>
    <line x1="290" y1="232" x2="290" y2="82"/>
    <line x1="290" y1="232" x2="419.9" y2="157"/>
    <line x1="290" y1="232" x2="419.9" y2="307"/>
    <line x1="290" y1="232" x2="290" y2="382"/>
    <line x1="290" y1="232" x2="160.1" y2="307"/>
    <line x1="290" y1="232" x2="160.1" y2="157"/>
  </g>
  <text x="296" y="161" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:11px;fill:var(--text-muted,#64748b)">50</text>
  <!-- target (dashed outline) then current (filled) -->
  <polygon points="290,97 396.5,170.5 393.9,292 290,349 179.6,295.8 196.5,178" fill="none" style="stroke:var(--amber,#f59e0b);stroke-width:2.5" stroke-dasharray="7 5" stroke-linejoin="round"/>
  <polygon points="290,112 367.9,187 383.5,286 290,289 204.3,281.5 222.5,193" style="fill:color-mix(in srgb, var(--teal,#0d9488) 26%, transparent);stroke:var(--teal,#0d9488);stroke-width:2.5" stroke-linejoin="round"/>
  <g style="fill:var(--teal,#0d9488)"><circle cx="290" cy="112" r="4.5"/><circle cx="367.9" cy="187" r="4.5"/><circle cx="383.5" cy="286" r="4.5"/><circle cx="290" cy="289" r="4.5"/><circle cx="204.3" cy="281.5" r="4.5"/><circle cx="222.5" cy="193" r="4.5"/></g>
  <!-- axis labels -->
  <text x="290" y="62" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Speed</text>
  <text x="435.5" y="153" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Quality</text>
  <text x="435.5" y="321" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Cost</text>
  <text x="290" y="414" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Scale</text>
  <text x="144.5" y="321" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Security</text>
  <text x="144.5" y="153" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Usability</text>
  <!-- legend + takeaway -->
  <rect x="560" y="128" width="26" height="14" rx="4" style="fill:color-mix(in srgb, var(--teal,#0d9488) 26%, transparent);stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="598" y="140" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Current</text>
  <line x1="560" y1="172" x2="586" y2="172" style="stroke:var(--amber,#f59e0b);stroke-width:2.5" stroke-dasharray="7 5"/>
  <text x="598" y="177" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Target</text>
  <line x1="560" y1="214" x2="760" y2="214" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1"/>
  <text x="560" y="246" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:700;fill:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a))">Largest gap: Scale</text>
  <text x="560" y="268" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">38 vs 78 target · invest here first</text>
  <text x="560" y="296" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:700;fill:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a))">Already strong: Speed</text>
  <text x="560" y="318" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">80 vs 90 target</text>
</svg>
