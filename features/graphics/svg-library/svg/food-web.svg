<!--
design-pack · svg-library · food-web
  Food web over four trophic tiers: producers (grasses, berry shrubs,
  clover), herbivores, carnivores and an apex eagle. Arrows point from food
  to feeder (direction of energy flow); stroke width shrinks up the levels
  because less energy is passed on each step. Decomposers collect dead
  matter (dashed) and return NUTRIENTS, not energy, to the soil; energy
  flows one way and leaves as heat (Texas Gateway, National Geographic
  energy-flow resources). Feeding links are real diets (eagles do take
  foxes and snakes; frogs eat grasshoppers; snakes eat frogs and mice).
  Tokens: green amber coral deep-blue text text-muted surface font-head font-sans.
  Edit: node names; keep arrows prey to predator.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Food web: grasses, shrubs and clover feed grasshoppers, mice and rabbits, which feed frogs, snakes and foxes, which feed an eagle; decomposers return nutrients to producers" style="width:100%;height:auto">
