<!--
design-pack · svg-library · iceberg-depth
  Visible tip vs the larger hidden mass below a wavy waterline (y=170). The
  submerged outline is dashed to read as "below the surface".
  Tokens: teal deep-blue text text-muted surface font-head font-sans.
  Edit: 2 above-water + 4 below-water labels/captions, the two % tags. Leaders
  end on the berg edge at the listed x; re-aim them if you reshape the polygons.
  No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Iceberg with visible results and behaviours above the waterline and hidden processes, assumptions, culture and incentives below" style="width:100%;height:auto">
  <title>Iceberg of visible and hidden factors</title>
  <!-- water -->
  <path d="M 10 170 H 790 V 424 Q 790 438 776 438 H 24 Q 10 438 10 424 Z" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 12%, var(--surface,#ffffff))"/>
  <!-- hidden mass (dashed = below the surface) -->
  <polygon points="306,170 252,236 232,318 290,398 400,424 520,396 570,312 548,232 494,170" style="fill:color-mix(in srgb, var(--teal,#0d9488) 20%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2" stroke-dasharray="7 5" stroke-linejoin="round"/>
  <!-- visible tip -->
  <polygon points="328,170 360,112 384,84 400,56 424,94 446,116 472,170" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <polygon points="328,170 360,112 384,84 400,56 424,94 446,116 472,170" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2.5" stroke-linejoin="round"/>
  <polyline points="384,84 392,130 380,160" fill="none" style="stroke:color-mix(in srgb, var(--teal,#0d9488) 55%, transparent);stroke-width:1.5" stroke-linecap="round"/>
  <!-- waterline -->
  <path d="M 10 170 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0 q 15 -7 30 0 t 30 0" fill="none" style="stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2" stroke-linecap="round"/>
  <text x="30" y="52" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">VISIBLE · ~10%</text>
  <text x="30" y="202" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">HIDDEN · ~90%</text>
  <!-- labels + leaders (edge x = where the leader meets the berg) -->
  <line x1="220" y1="115" x2="352" y2="115" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="3 4"/>
  <circle cx="352" cy="115" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <text x="212" y="120" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Results</text>
  <text x="212" y="139" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">what gets reported</text>
  <line x1="580" y1="131" x2="456" y2="131" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="3 4"/>
  <circle cx="456" cy="131" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <text x="588" y="136" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Behaviours</text>
  <text x="588" y="155" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">what people do</text>
  <line x1="220" y1="257" x2="246" y2="257" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="3 4"/>
  <circle cx="246" cy="257" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <text x="212" y="262" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Processes</text>
  <text x="212" y="281" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">how work flows</text>
  <line x1="580" y1="257" x2="556" y2="257" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="3 4"/>
  <circle cx="556" cy="257" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <text x="588" y="262" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Assumptions</text>
  <text x="588" y="281" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">what we take for granted</text>
  <line x1="220" y1="347" x2="252" y2="347" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="3 4"/>
  <circle cx="252" cy="347" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <text x="212" y="352" text-anchor="end" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Culture</text>
  <text x="212" y="371" text-anchor="end" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">unwritten rules</text>
  <line x1="580" y1="347" x2="546" y2="347" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="3 4"/>
  <circle cx="546" cy="347" r="3.5" style="fill:var(--text-muted,#64748b)"/>
  <text x="588" y="352" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Incentives</text>
  <text x="588" y="371" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">what is rewarded</text>
</svg>
