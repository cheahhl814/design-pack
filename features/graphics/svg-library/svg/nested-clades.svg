  <text x="66.0" y="178.0" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Crab</text>
  <rect x="70" y="194" width="290" height="178" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="70" y="194" width="290" height="178" rx="14" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 8%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a));stroke-width:2"/>
  <text x="86.0" y="216.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a))">SIX LEGS</text>
  <text x="86.0" y="240.0" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Grasshopper</text>
  <rect x="90" y="256" width="250" height="102" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <rect x="90" y="256" width="250" height="102" rx="14" style="fill:color-mix(in srgb, var(--coral,#ef4444) 8%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a));stroke-width:2"/>
  <text x="106.0" y="278.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a))">COMPLETE METAMORPHOSIS</text>
  <text x="106.0" y="302.0" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Butterfly</text>
  <text x="106.0" y="336.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">egg → larva → pupa → adult</text>
  <text x="30.0" y="432.0" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Earthworm</text>
  <text x="128.0" y="432.0" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">outgroup, outside every set</text>
  </g>
  <!-- tree -->
  <g>
  <text x="468.0" y="50.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">SAME HIERARCHY AS A TREE</text>
  <path d="M630.0 320.0 L670.0 290.0" style="fill:none;stroke:var(--text,#0f172a);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
  <path d="M630.0 320.0 L670.0 350.0" style="fill:none;stroke:var(--text,#0f172a);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>
