  <circle cx="670.0" cy="170.0" r="4" style="fill:var(--text,#0f172a);stroke:var(--surface,#ffffff);stroke-width:0"/>
  <text x="682.0" y="175.5" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Spider</text>
  <circle cx="670.0" cy="230.0" r="4" style="fill:var(--text,#0f172a);stroke:var(--surface,#ffffff);stroke-width:0"/>
