<!--
design-pack · svg-library · nested-clades
Nested sets beside the equivalent slanted cladogram: each coloured box
  is a clade defined by one shared derived trait, and a same-coloured
  tick on the tree marks where that trait arises.
  Tokens: deep-blue teal amber coral text text-muted surface font-head font-sans.
  Edit: trait names, taxa and the tick positions together.
  Science: spiders lack antennae and mandibles (chelicerates); crabs and
  insects share them (mandibulates); grasshoppers develop without a
  pupa, butterflies with one. Earthworm is the outgroup only; segmentation
  is not drawn as a shared trait because annelids and arthropods
  evolved it separately.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Nested sets of arthropods (jointed legs, mandibles and antennae, six legs, complete metamorphosis) beside the matching cladogram of earthworm, spider, crab, grasshopper and butterfly" style="width:100%;height:auto">
  <title>Nested clades and their cladogram: arthropods</title>
  <!-- nested sets -->
  <g>
  <text x="30.0" y="50.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">NESTED SETS</text>
  <rect x="30" y="70" width="370" height="330" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="30" y="70" width="370" height="330" rx="14" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 8%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="46.0" y="92.0" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">JOINTED LEGS</text>
  <text x="46.0" y="116.0" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Spider</text>
  <rect x="50" y="132" width="330" height="254" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="50" y="132" width="330" height="254" rx="14" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a));stroke-width:2"/>
