<!--
design-pack · svg-library · world-dot-map
  Dot-matrix world (equirectangular, Antarctica cropped) with dots tinted per
  continent, four teardrop pins on real locations and callout cards above
  joined by dashed leaders. Land mask rasterised from Natural Earth 1:110m
  (public domain); continent-level only, no country borders drawn.
  Tokens: teal deep-blue amber coral green navy text text-muted surface font-head font-sans.
  Edit: card titles + captions, pin positions. A location's canvas point is
  x = 20 + (lon + 180) * 2.111, y = 140 + (83 - lat) * 2.111. Move a pin by
  moving its pin group (tip = that point) and its leader end. Recolour a continent
  via its path stroke; make all paths one neutral tint for a quiet base map.
  Dots are round-capped 1px dashes on a 7px grid in one path per continent.
  No ids/markers, safe to paste multiples.
-->
