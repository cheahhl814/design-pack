<!--
html-template-pack · svg-library · symbiosis-types
  Three symbiosis types as paired-organism vignettes with
  benefit/harm/unaffected badges: mutualism (+/+, cleaner wrasse and
  grouper), commensalism (+/0, remora and shark), parasitism (+/-, tick
  and deer). Classic textbook pairs (Wikimedia symbiotic relationships
  diagram, ScienceFacts). Remora commensalism is the standard example
  though some argue a small drag cost or a mutual cleaning benefit,
  hence the footnote.
  Tokens: green amber coral teal deep-blue text text-muted surface font-head font-sans.
  Edit: example names and benefit lines; keep the sign badges consistent.
  No ids/markers, safe to paste multiples.
-->
