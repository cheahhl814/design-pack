<!--
design-pack · svg-library · climate-zones-globe
  Flattened globe split into latitude climate bands (polar, temperate, dry,
  tropical, mirrored), after the Met Office climate-zones graphic, with a
  keyed description list on the right. Bands are pre-computed polygons.
  Tokens: deep-blue green amber coral text text-muted surface border font-head font-sans.
  Edit: band names, the key text. Band edges are fractions of the radius
  (EDGES); bands are schematic, not real zone boundaries.
  No ids/markers, safe to paste multiples.
-->
