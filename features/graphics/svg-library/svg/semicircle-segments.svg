  a total in the hub and a legend under the baseline. Concept-level:
  real data belongs in chartz.
  Tokens: deep-blue teal coral text text-muted surface font-head font-sans.
  Edit: SHARES (degrees = share * 1.8), %, legend labels, hub text.
  No ids/markers, safe to paste multiples.
-->
