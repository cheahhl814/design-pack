  <rect x="315" y="199" width="8" height="24" rx="4" transform="rotate(22 319 211)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 40%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:1.5"/>
  </g>
  <!-- chromosome -->
  <g>
  <rect x="478" y="150" width="24" height="100" rx="12" transform="rotate(-22 490 200)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 40%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2"/>
