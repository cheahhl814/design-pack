<!--
design-pack · svg-library · cell-to-dna-zoom
  Zoom sequence through four lenses: cell, nucleus, chromosome, DNA double
  helix, each lens linked to the region it magnifies by dashed zoom lines.
  Tokens: teal deep-blue amber coral green navy text text-muted surface border font-head font-sans.
  Edit: labels + scale captions. Lens centres at x = 110, 300, 490, 680 (r 70).
  Scales are typical orders of magnitude, not exact sizes.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Zoom from a cell to its nucleus, to a chromosome, to the DNA double helix" style="width:100%;height:auto">
  <title>Cell to DNA zoom</title>
  <!-- zoom lines -->
  <g>
  <line x1="162" y1="180" x2="300" y2="130" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <line x1="162" y1="210" x2="300" y2="270" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <line x1="332" y1="196" x2="490" y2="130" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <line x1="332" y1="226" x2="490" y2="270" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <line x1="518" y1="160" x2="680" y2="130" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <line x1="518" y1="186" x2="680" y2="270" stroke-dasharray="4 4" style="stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  </g>
  <!-- lenses -->
  <g>
  <circle cx="110" cy="200" r="70" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="110" cy="200" r="70" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <circle cx="300" cy="200" r="70" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="300" cy="200" r="70" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <circle cx="490" cy="200" r="70" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="490" cy="200" r="70" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <circle cx="680" cy="200" r="70" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="680" cy="200" r="70" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  </g>
  <!-- cell -->
