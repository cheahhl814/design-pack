<!--
design-pack · svg-library · thermometer-gauge
  Thermometer of global warming above pre-industrial: risk bands beside the
  tube, mercury to today's level, and the Paris Agreement 1.5 and 2 degree
  thresholds as dashed lines running to labelled notes.
  Tokens: green amber coral text text-muted surface border font-head font-sans.
  Scale: y = 340 - degC * 86 (0 to 3 degC). Today's mark uses IPCC AR6
  (1.09 degC for 2011 to 2020); update it and its source line if you change it.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Thermometer showing about 1.1 degrees of warming against the Paris Agreement limits of 1.5 and 2 degrees" style="width:100%;height:auto">
  <title>Warming thermometer</title>
  <!-- risk bands -->
  <g>
  <rect x="142" y="254" width="30" height="86" style="fill:color-mix(in srgb, var(--green,#10b981) 30%, var(--surface,#ffffff))"/>
  <rect x="142" y="211" width="30" height="43" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 34%, var(--surface,#ffffff))"/>
  <rect x="142" y="168" width="30" height="43" style="fill:color-mix(in srgb, var(--coral,#ef4444) 30%, var(--surface,#ffffff))"/>
  <rect x="142" y="82" width="30" height="86" style="fill:color-mix(in srgb, var(--coral,#ef4444) 52%, var(--surface,#ffffff))"/>
  </g>
  <!-- tube + bulb -->
  <g>
  <rect x="184" y="66" width="32" height="288" rx="16" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <rect x="184" y="66" width="32" height="288" rx="16" style="fill:var(--surface,#ffffff);stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <circle cx="200" cy="376" r="30" style="fill:var(--coral,#ef4444);stroke:var(--text-muted,#64748b);stroke-width:2"/>
  <rect x="192" y="246.3" width="16" height="107.7" style="fill:var(--coral,#ef4444)"/>
  </g>
  <!-- scale -->
  <g>
  <line x1="218" y1="340" x2="228" y2="340" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <text x="234" y="344" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">0 °C</text>
  <line x1="218" y1="297" x2="224" y2="297" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <line x1="218" y1="254" x2="228" y2="254" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <text x="234" y="258" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">1 °C</text>
  <line x1="218" y1="211" x2="224" y2="211" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <line x1="218" y1="168" x2="228" y2="168" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <text x="234" y="172" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">2 °C</text>
  <line x1="218" y1="125" x2="224" y2="125" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <line x1="218" y1="82" x2="228" y2="82" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <text x="234" y="86" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">3 °C</text>
  </g>
  <!-- thresholds + today -->
  <g>
  <line x1="264" y1="168" x2="470" y2="168" stroke-dasharray="7 5" style="stroke:var(--coral,#ef4444);stroke-width:2"/>
  <text x="484" y="165" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--coral,#ef4444)">2 °C</text>
  <text x="484" y="183" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Paris: hold warming well below</text>
  <line x1="264" y1="211" x2="470" y2="211" stroke-dasharray="7 5" style="stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="484" y="208" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--amber,#f59e0b)">1.5 °C</text>
  <text x="484" y="226" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Paris: pursue efforts to limit</text>
  <circle cx="210" cy="246.3" r="4" style="fill:var(--text,#0f172a)"/>
  <line x1="214" y1="246.3" x2="470" y2="246.3" style="stroke:var(--text,#0f172a);stroke-width:1.5"/>
  <text x="484" y="266.3" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">≈ 1.1 °C today</text>
  <text x="484" y="284.3" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">2011 to 2020 average</text>
  </g>
  <!-- headline + source -->
  <g>
  <text x="484" y="70" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">WARMING ABOVE PRE-INDUSTRIAL</text>
  <text x="484" y="98" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Little room left to 1.5 °C</text>
  <text x="300" y="412" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Source: IPCC AR6 WG1 SPM (2021); Paris Agreement, Art. 2.</text>
  <text x="157" y="60" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">risk</text>
  </g>
</svg>
