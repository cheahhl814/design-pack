<!--
design-pack · svg-library · target-bullseye
  Concentric priority rings around one goal, a dart in the bullseye, and
  right-hand labels with leaders anchored mid-band.
  Tokens: teal deep-blue amber coral text text-muted surface font-head font-sans.
  Edit: centre label, 3 ring labels + captions, bullseye caption. Leader dots are
  placed on each band's mid-radius (147/103/61 from the centre) — keep them there
  if you move a row. No ids/markers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Target with three priority rings around a central goal, labelled from outer nice-to-haves to primary outcomes" style="width:100%;height:auto">
  <title>Target bullseye of priorities</title>
  <!-- rings: outer -> inner (draw largest first) -->
  <g>
    <circle cx="260" cy="225" r="170" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
    <circle cx="260" cy="225" r="170" style="fill:color-mix(in srgb, var(--teal,#0d9488) 10%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
    <circle cx="260" cy="225" r="125" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 16%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
    <circle cx="260" cy="225" r="82" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
    <circle cx="260" cy="225" r="42" style="fill:color-mix(in srgb, var(--coral,#ef4444) 30%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2.5"/>
  </g>
  <text x="260" y="231" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:700;fill:var(--text,#0f172a)">Goal</text>
  <!-- dart: shaft + explicit head + fletching -->
  <line x1="96" y1="58" x2="233.3" y2="196.2" style="stroke:var(--text,#0f172a);stroke-width:3.5" stroke-linecap="round"/>
  <polygon points="246,209 226.2,200.4 237.6,189.2" style="fill:var(--text,#0f172a)"/>
  <polygon points="98.8,60.8 114.3,76.4 100.9,78.5 85.4,62.9" style="fill:var(--coral,#ef4444);stroke:var(--coral,#ef4444);stroke-width:1" stroke-linejoin="round"/>
  <polygon points="98.8,60.8 114.3,76.4 116.5,63 101,47.4" style="fill:var(--coral,#ef4444);stroke:var(--coral,#ef4444);stroke-width:1" stroke-linejoin="round"/>
  <!-- leaders: dot sits mid-band, line runs to the label column -->
  <line x1="337.4" y1="100" x2="470" y2="100" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <circle cx="337.4" cy="100" r="4.5" style="fill:var(--teal,#0d9488)"/>
  <text x="482" y="101" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Nice-to-haves</text>
  <text x="482" y="121" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">outer ring · only if time allows</text>
  <line x1="354.9" y1="185" x2="470" y2="185" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <circle cx="354.9" cy="185" r="4.5" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  <text x="482" y="186" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Supporting outcomes</text>
  <text x="482" y="206" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">make the goal achievable</text>
  <line x1="301.2" y1="270" x2="470" y2="270" style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-dasharray="4 4"/>
  <circle cx="301.2" cy="270" r="4.5" style="fill:var(--amber,#f59e0b)"/>
  <text x="482" y="271" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Primary outcomes</text>
  <text x="482" y="291" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">directly measure success</text>
  <text x="482" y="356" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a))">Bullseye</text>
  <text x="482" y="376" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">the one result that defines done</text>
</svg>
