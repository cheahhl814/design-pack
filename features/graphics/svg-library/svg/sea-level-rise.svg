<!--
design-pack · svg-library · sea-level-rise
  Coastal cross-section: land profile with homes, today's sea surface and two
  dashed future levels whose tinted bands show where water would reach.
  Vertical scale exaggerated.
  Tokens: teal deep-blue coral text text-muted surface border font-head font-sans.
  Edit: scenario labels, headline, captions. LEVELS are canvas y values;
  the wet edge x for each level is interpolated on the LAND profile.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Coastal cross-section where two higher sea-level scenarios reach the first row of homes" style="width:100%;height:auto">
  <title>Sea-level rise cross-section</title>
  <!-- headline -->
  <g>
  <text x="40" y="60" text-anchor="start" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b)">COASTAL EXPOSURE</text>
  <text x="40" y="90" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Higher seas reach the first homes</text>
  <text x="40" y="114" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text-muted,#64748b)">Two scenarios over today's shoreline (vertical scale exaggerated).</text>
  </g>
  <!-- future water bands (translucent) + today's sea -->
  <g>
  <polygon points="30,278 542.4,278 468,304 30,304" style="fill:color-mix(in srgb, var(--coral,#ef4444) 14%, transparent)"/>
  <polygon points="30,304 468,304 330,330 30,330" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, transparent)"/>
  <rect x="30" y="330" width="310" height="110" style="fill:color-mix(in srgb, var(--teal,#0d9488) 40%, var(--surface,#ffffff))"/>
  </g>
  <!-- land -->
  <g>
  <polygon points="280,440 300,360 330,330 420,316 500,296 580,262 660,236 760,222 770,222 770,440" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <polygon points="280,440 300,360 330,330 420,316 500,296 580,262 660,236 760,222 770,222 770,440" stroke-linejoin="round" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 26%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a));stroke-width:2"/>
  </g>
  <!-- homes -->
  <g>
  <polygon points="424,309 424,287 440,273 456,287 456,309" stroke-linejoin="round" style="fill:var(--surface,#ffffff);stroke:var(--coral,#ef4444);stroke-width:2"/>
  <rect x="436" y="296" width="8" height="13" rx="1" style="fill:var(--coral,#ef4444)"/>
  <polygon points="504,285.5 504,263.5 520,249.5 536,263.5 536,285.5" stroke-linejoin="round" style="fill:var(--surface,#ffffff);stroke:var(--coral,#ef4444);stroke-width:2"/>
  <rect x="516" y="272.5" width="8" height="13" rx="1" style="fill:var(--coral,#ef4444)"/>
  <polygon points="594,250.2 594,228.2 610,214.2 626,228.2 626,250.2" stroke-linejoin="round" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <rect x="606" y="237.2" width="8" height="13" rx="1" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  <polygon points="674,229.8 674,207.8 690,193.8 706,207.8 706,229.8" stroke-linejoin="round" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <rect x="686" y="216.8" width="8" height="13" rx="1" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))"/>
  </g>
  <!-- level lines + labels -->
  <g>
  <line x1="30" y1="278" x2="542.4" y2="278" stroke-dasharray="7 5" style="stroke:var(--coral,#ef4444);stroke-width:2"/>
  <text x="44" y="270" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--coral,#ef4444)">+1 m scenario</text>
  <line x1="30" y1="304" x2="468" y2="304" stroke-dasharray="7 5" style="stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="44" y="296" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--teal,#0d9488)">+0.5 m scenario</text>
  <path d="M 30 330 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0 q 7.5 -6 15 0 t 15 0" fill="none" style="stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="44" y="356" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">today's sea level</text>
  </g>
  <!-- rise arrow -->
  <g>
  <line x1="250" y1="346" x2="250" y2="291" stroke-linecap="round" style="stroke:var(--text-muted,#64748b);stroke-width:2.5"/>
  <polygon points="250,278 256.5,291 243.5,291" style="fill:var(--text-muted,#64748b)"/>
  </g>
  <!-- impact notes -->
  <g>
  <text x="560" y="330" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--coral,#ef4444)">first row floods at +0.5 m</text>
  <text x="560" y="346" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--coral,#ef4444)">second row at +1 m</text>
  <text x="560" y="380" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">Levels are illustrative; use a local</text>
  <text x="560" y="396" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">projection (e.g. IPCC AR6 SSPs).</text>
  </g>
</svg>
