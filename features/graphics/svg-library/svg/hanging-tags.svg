<!--
design-pack · svg-library · hanging-tags
  Five round step tags hanging on strings from a rail, alternating drop
  heights, number + label inside each tag and a caption below.
  Tokens: teal deep-blue amber coral green text text-muted surface font-head font-sans.
  Edit: tag labels + captions. Tags sit at x = 100 + i*150, centres
  alternate y 200/275; move a string's lower end with its tag.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Five numbered step tags hanging from a rail at alternating heights, each with a label and caption" style="width:100%;height:auto">
  <title>Hanging step tags</title>
  <!-- rail -->
  <g>
  <line x1="40" y1="70" x2="760" y2="70" stroke-linecap="round" style="stroke:var(--text-muted,#64748b);stroke-width:3"/>
  </g>
  <!-- strings + tags -->
  <g>
  <line x1="100" y1="70" x2="100" y2="153" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="100" cy="70" r="4.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="100" cy="200" r="60" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="100" cy="200" r="60" style="fill:color-mix(in srgb, var(--teal,#0d9488) 18%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <circle cx="100" cy="200" r="51" stroke-dasharray="3 5" style="fill:none;stroke:var(--teal,#0d9488);stroke-width:1.5"/>
  <circle cx="100" cy="155" r="5" style="fill:var(--surface,#ffffff);stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="100" y="203" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--teal,#0d9488)">01</text>
  <text x="100" y="226" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Research</text>
  <text x="100" y="286" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">map the problem</text>
  <text x="100" y="302" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">and the users</text>
  <line x1="250" y1="70" x2="250" y2="228" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="250" cy="70" r="4.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="250" cy="275" r="60" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <circle cx="250" cy="275" r="60" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 18%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <circle cx="250" cy="275" r="51" stroke-dasharray="3 5" style="fill:none;stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.5"/>
  <circle cx="250" cy="230" r="5" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="250" y="278" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">02</text>
  <text x="250" y="301" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Ideate</text>
  <text x="250" y="361" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">generate options</text>
  <text x="250" y="377" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">without judging</text>
  <line x1="400" y1="70" x2="400" y2="153" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="400" cy="70" r="4.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="400" cy="200" r="60" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <circle cx="400" cy="200" r="60" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 18%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <circle cx="400" cy="200" r="51" stroke-dasharray="3 5" style="fill:none;stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
  <circle cx="400" cy="155" r="5" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="400" y="203" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--amber,#f59e0b)">03</text>
  <text x="400" y="226" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Prototype</text>
  <text x="400" y="286" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">make it tangible</text>
  <text x="400" y="302" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">cheap and fast</text>
  <line x1="550" y1="70" x2="550" y2="228" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="550" cy="70" r="4.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="550" cy="275" r="60" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <circle cx="550" cy="275" r="60" style="fill:color-mix(in srgb, var(--coral,#ef4444) 18%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2"/>
  <circle cx="550" cy="275" r="51" stroke-dasharray="3 5" style="fill:none;stroke:var(--coral,#ef4444);stroke-width:1.5"/>
  <circle cx="550" cy="230" r="5" style="fill:var(--surface,#ffffff);stroke:var(--coral,#ef4444);stroke-width:2"/>
  <text x="550" y="278" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--coral,#ef4444)">04</text>
  <text x="550" y="301" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Test</text>
  <text x="550" y="361" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">learn from real</text>
  <text x="550" y="377" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">people early</text>
  <line x1="700" y1="70" x2="700" y2="153" style="stroke:var(--text-muted,#64748b);stroke-width:1.5"/>
  <circle cx="700" cy="70" r="4.5" style="fill:var(--text-muted,#64748b)"/>
  <circle cx="700" cy="200" r="60" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <circle cx="700" cy="200" r="60" style="fill:color-mix(in srgb, var(--green,#10b981) 18%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  <circle cx="700" cy="200" r="51" stroke-dasharray="3 5" style="fill:none;stroke:var(--green,#10b981);stroke-width:1.5"/>
  <circle cx="700" cy="155" r="5" style="fill:var(--surface,#ffffff);stroke:var(--green,#10b981);stroke-width:2"/>
  <text x="700" y="203" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--green,#10b981)">05</text>
  <text x="700" y="226" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:13px;font-weight:700;fill:var(--text,#0f172a)">Launch</text>
  <text x="700" y="286" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">ship, measure</text>
  <text x="700" y="302" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">and iterate</text>
  </g>
</svg>
