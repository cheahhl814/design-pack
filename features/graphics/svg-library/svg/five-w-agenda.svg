<!--
design-pack · svg-library · five-w-agenda
  Five Ws agenda / brief: Who / What / When / Where / Why tiles, each with an
  answer card and a category tag — project briefs, kick-off agendas, incident
  summaries, one-slide charters.
  Tokens: teal deep-blue amber green coral text text-muted surface font-head
  font-sans.
  Edit: answers + captions, tag eyebrows (≤ 8 chars). Row i sits at y = 26 + i*82
  (66 tall). Add "How?" by shrinking rows to 68 px pitch or dropping a tag.
  No ids/markers/defs — safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Five Ws brief: Who, What, When, Where and Why, each answered on its own row with a category tag" style="width:100%;height:auto">
  <title>Five Ws brief</title>
  <!-- Who -->
  <rect x="40" y="26" width="120" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="40" y="26" width="120" height="66" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 26%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="100" y="66" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">Who?</text>
  <rect x="176" y="26" width="584" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <rect x="176" y="26" width="584" height="66" rx="12" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
  <text x="200" y="55" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Platform team</text>
  <text x="200" y="74" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">six engineers + one designer</text>
  <rect x="652" y="48" width="88" height="22" rx="11" style="fill:color-mix(in srgb, var(--teal,#0d9488) 20%, var(--surface,#ffffff))"/>
  <text x="696" y="63" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">OWNER</text>
  <!-- What -->
  <rect x="40" y="108" width="120" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="40" y="108" width="120" height="66" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 26%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="100" y="148" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">What?</text>
  <rect x="176" y="108" width="584" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
  <rect x="176" y="108" width="584" height="66" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 8%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="200" y="137" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Migrate to the new pipeline</text>
  <text x="200" y="156" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">all ten nightly jobs</text>
  <rect x="652" y="130" width="88" height="22" rx="11" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 20%, var(--surface,#ffffff))"/>
  <text x="696" y="145" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">SCOPE</text>
  <!-- When -->
  <rect x="40" y="190" width="120" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="40" y="190" width="120" height="66" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 26%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="100" y="230" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a))">When?</text>
  <rect x="176" y="190" width="584" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <rect x="176" y="190" width="584" height="66" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 8%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="200" y="219" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Q3, weeks 2–9</text>
  <text x="200" y="238" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">cut-over on 14 Sept</text>
  <rect x="652" y="212" width="88" height="22" rx="11" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 20%, var(--surface,#ffffff))"/>
  <text x="696" y="227" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a))">TIMING</text>
  <!-- Where -->
  <rect x="40" y="272" width="120" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <rect x="40" y="272" width="120" height="66" rx="12" style="fill:color-mix(in srgb, var(--green,#10b981) 26%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  <text x="100" y="312" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a))">Where?</text>
  <rect x="176" y="272" width="584" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--green,#10b981) 22%, transparent);stroke:color-mix(in srgb, var(--green,#10b981) 45%, transparent);stroke-width:1.5"/>
  <rect x="176" y="272" width="584" height="66" rx="12" style="fill:color-mix(in srgb, var(--green,#10b981) 8%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  <text x="200" y="301" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">EU cloud region</text>
  <text x="200" y="320" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">data stays in-region</text>
  <rect x="652" y="294" width="88" height="22" rx="11" style="fill:color-mix(in srgb, var(--green,#10b981) 20%, var(--surface,#ffffff))"/>
  <text x="696" y="309" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--green,#10b981) 70%, var(--text,#0f172a))">PLACE</text>
  <!-- Why -->
  <rect x="40" y="354" width="120" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <rect x="40" y="354" width="120" height="66" rx="12" style="fill:color-mix(in srgb, var(--coral,#ef4444) 26%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2"/>
  <text x="100" y="394" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a))">Why?</text>
  <rect x="176" y="354" width="584" height="66" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <rect x="176" y="354" width="584" height="66" rx="12" style="fill:color-mix(in srgb, var(--coral,#ef4444) 8%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2"/>
  <text x="200" y="383" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Halve run time and cost</text>
  <text x="200" y="402" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">free budget for new work</text>
  <rect x="652" y="376" width="88" height="22" rx="11" style="fill:color-mix(in srgb, var(--coral,#ef4444) 20%, var(--surface,#ffffff))"/>
  <text x="696" y="391" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--coral,#ef4444) 70%, var(--text,#0f172a))">PURPOSE</text>
</svg>
