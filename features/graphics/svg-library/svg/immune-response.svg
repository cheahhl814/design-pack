<!--
html-template-pack · svg-library · immune-response
  Innate vs adaptive immune response with a schematic antibody.
  Innate column: barriers, phagocytes, inflammation, NK cells and
  complement. Adaptive: an antigen-presenting cell (macrophage or
  dendritic cell; the same phagocyte, hence the link) shows antigen on
  MHC to a CD4 helper T cell, which activates CD8 cytotoxic T cells
  (kill infected cells) and B cells (which also bind antigen
  themselves); B cells become plasma cells that secrete antibodies;
  memory B and T cells remain. Antibody: IgG Y with two heavy chains
  (inner, form the Fc stem, joined by disulfide bonds) and two light
  chains on the arms; antigen binds at both Fab tips. Checked against
  the Wikimedia Immune Response diagram, BioRender general principles
  template and the Kuraplan immune response figure.
  Tokens: amber teal coral deep-blue border-bright text text-muted surface font-head font-sans.
  Edit: captions; keep heavy chains inside, light chains outside.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Immune response: innate barriers, phagocytes, inflammation and NK cells act fast; in the adaptive response an antigen-presenting cell activates helper T cells, which activate cytotoxic T cells and B cells that become antibody-secreting plasma cells, leaving memory cells; an antibody has two heavy and two light chains" style="width:100%;height:auto">
  <title>Innate and adaptive immune response with antibody structure</title>
