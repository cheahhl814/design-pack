<!--
design-pack · svg-library · cladogram-styles
One primate cladogram drawn three ways: diagonal, rectangular, and
  rectangular with branches rotated at two nodes. The chimp + human clade
  is highlighted in each so readers see the relationships do not change.
  Tokens: deep-blue coral amber text text-muted surface font-head font-sans.
  Edit: taxon names (up to about 9 characters at this width). If you
  change the topology, redraw all three panels.
  Science: lemur (strepsirrhine) outgroup; tarsiers sister to monkeys and
  apes; chimp and human are sister taxa.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="The same primate cladogram of lemur, tarsier, macaque, chimp and human drawn as a diagonal tree, a rectangular tree and a rectangular tree with branches rotated at two nodes" style="width:100%;height:auto">
  <title>Cladogram styles: one tree, three drawings</title>
  <!-- diagonal -->
  <g>
