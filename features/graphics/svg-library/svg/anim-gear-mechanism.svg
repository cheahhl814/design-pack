<!--
design-pack · svg-library · anim-gear-mechanism
  3 meshing gears counter-rotate: pitch radii 104.5/72.5/54.5 so periods are 40.00s, 27.75s and 20.86s (inverse to radius); neighbours turn in opposite directions.
  Tokens: teal amber deep-blue text text-muted surface font-head font-sans.
  Edit: hub labels, captions. If you resize a gear, set its animateTransform dur to 40 x r / 104.5 (r = pitch radius, the mid-tooth radius) and keep neighbours opposite (to=360 vs to=-360).
  ANIMATED (SMIL only, README rule 8): delete the <animate*> children for a static twin.
  No ids, defs, path references or style blocks, safe to paste multiples.
-->
