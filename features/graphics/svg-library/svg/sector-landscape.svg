<!--
design-pack · svg-library · sector-landscape
  Emissions-by-sector landscape: four silhouette scenes on one ground line
  (power plant, factory, traffic, farm), each topped by its share, label
  and caption. After the INDC landscape infographic style.
  Tokens: coral amber deep-blue green text text-muted surface border font-head font-sans.
  SHARES ARE PLACEHOLDERS: replace with your inventory and cite it in the
  footer. Panels are 180 wide from x = 40; silhouettes sit on y = 330.
  No ids/markers, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Landscape split into energy, industry, transport and agriculture scenes, each with its share of emissions (placeholder values)" style="width:100%;height:auto">
  <title>Emissions by sector landscape</title>
  <!-- headline numbers -->
  <g>
  <text x="130" y="112" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--coral,#ef4444)">34%</text>
  <text x="130" y="138" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Energy</text>
  <text x="130" y="157" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">power and heat</text>
  <text x="310" y="112" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--amber,#f59e0b)">24%</text>
  <text x="310" y="138" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Industry</text>
  <text x="310" y="157" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">cement, steel, chemicals</text>
  <text x="490" y="112" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a))">15%</text>
  <text x="490" y="138" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Transport</text>
  <text x="490" y="157" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">road, air and shipping</text>
  <text x="670" y="112" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--green,#10b981)">22%</text>
  <text x="670" y="138" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:16px;font-weight:600;fill:var(--text,#0f172a)">Agriculture</text>
  <text x="670" y="157" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">land use and livestock</text>
  </g>
  <!-- dividers -->
  <g>
  <line x1="220" y1="88" x2="220" y2="330" stroke-dasharray="4 5" style="stroke:var(--border,#e2e8f0);stroke-width:1.5"/>
  <line x1="400" y1="88" x2="400" y2="330" stroke-dasharray="4 5" style="stroke:var(--border,#e2e8f0);stroke-width:1.5"/>
  <line x1="580" y1="88" x2="580" y2="330" stroke-dasharray="4 5" style="stroke:var(--border,#e2e8f0);stroke-width:1.5"/>
  </g>
  <!-- energy: cooling towers + smoke -->
  <g>
  <path d="M 70 330 Q 82 280 76 238 H 114 Q 108 280 120 330 Z" style="fill:color-mix(in srgb, var(--coral,#ef4444) 55%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:1.5"/>
  <path d="M 128 330 Q 140 280 134 238 H 172 Q 166 280 178 330 Z" style="fill:color-mix(in srgb, var(--coral,#ef4444) 55%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:1.5"/>
  <circle cx="98" cy="222" r="10" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <circle cx="108" cy="208" r="13" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <circle cx="126" cy="196" r="9" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <circle cx="156" cy="222" r="9" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  <circle cx="166" cy="206" r="12" style="fill:color-mix(in srgb, var(--text-muted,#64748b) 22%, var(--surface,#ffffff));stroke:var(--text-muted,#64748b);stroke-width:1.2"/>
  </g>
  <!-- industry: saw-tooth factory + chimneys -->
  <g>
  <rect x="322" y="210" width="16" height="60" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 55%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
  <rect x="346" y="230" width="14" height="40" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 55%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
  <polygon points="236,330 236,280 266,258 266,280 296,258 296,280 326,258 326,280 356,258 356,280 384,280 384,330" stroke-linejoin="round" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 55%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:1.5"/>
  <rect x="250" y="296" width="14" height="14" rx="2" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:1.2"/>
  <rect x="280" y="296" width="14" height="14" rx="2" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:1.2"/>
  <rect x="310" y="296" width="14" height="14" rx="2" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:1.2"/>
  <rect x="340" y="296" width="14" height="14" rx="2" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:1.2"/>
  </g>
  <!-- transport: bus + car -->
  <g>
  <rect x="420" y="264" width="88" height="50" rx="10" style="fill:color-mix(in srgb, color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a)) 55%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.5"/>
  <rect x="430" y="274" width="16" height="16" rx="3" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.2"/>
  <rect x="452" y="274" width="16" height="16" rx="3" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.2"/>
  <rect x="474" y="274" width="16" height="16" rx="3" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.2"/>
  <path d="M 514 314 V 296 Q 518 280 536 280 H 558 Q 572 280 578 296 H 582 V 314 Z" style="fill:color-mix(in srgb, color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a)) 55%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:1.5"/>
  <circle cx="438" cy="318" r="9" style="fill:var(--text,#0f172a);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <circle cx="490" cy="318" r="9" style="fill:var(--text,#0f172a);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <circle cx="530" cy="318" r="9" style="fill:var(--text,#0f172a);stroke:var(--surface,#ffffff);stroke-width:2"/>
  <circle cx="566" cy="318" r="9" style="fill:var(--text,#0f172a);stroke:var(--surface,#ffffff);stroke-width:2"/>
  </g>
  <!-- agriculture: barn + tree + furrows -->
  <g>
  <polygon points="600,330 600,278 630,250 660,278 660,330" stroke-linejoin="round" style="fill:color-mix(in srgb, var(--green,#10b981) 55%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <rect x="620" y="296" width="20" height="34" rx="2" style="fill:var(--surface,#ffffff);stroke:var(--green,#10b981);stroke-width:1.2"/>
  <rect x="711" y="284" width="8" height="46" style="fill:color-mix(in srgb, var(--green,#10b981) 55%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  <circle cx="715" cy="260" r="30" style="fill:color-mix(in srgb, var(--green,#10b981) 55%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:1.5"/>
  </g>
  <!-- ground + footer -->
  <g>
  <rect x="30" y="330" width="740" height="18" rx="4" style="fill:color-mix(in srgb, var(--green,#10b981) 18%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--green,#10b981) 55%, var(--surface,#ffffff));stroke-width:1.5"/>
  <text x="40" y="380" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;font-weight:400;fill:var(--text,#0f172a)">Share of greenhouse-gas emissions by sector</text>
  <text x="40" y="398" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;font-weight:400;fill:var(--text-muted,#64748b)">placeholder values; other sectors 5%. Replace and cite your inventory.</text>
  </g>
</svg>
