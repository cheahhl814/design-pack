<!--
design-pack · svg-library · anim-radial-gauge
  270-degree radial progress arc that draws itself once (pathLength=100, fill="freeze"),
  tick marks, hero percentage and two mini stat cards.
  Tokens: teal amber deep-blue text text-muted surface font-head font-sans.
  Edit: the value. Set stroke-dashoffset (base attr on both arcs) AND the animate "to"
  to 100 - percent (here 28), then the hero text. The arc rests at its final value,
  holds 0.6s, replays from empty (so a screenshot/PDF sees the full gauge).
  The hero numeral is 44px, a deliberate step above the 20px hero of the type scale.
  ANIMATED (SMIL only, README rule 8): delete the <animate*> children for a static twin.
  No ids, defs, path references or style blocks, safe to paste multiples.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Radial gauge showing 72 percent migration progress with two stat cards for throughput and time remaining" style="width:100%;height:auto">
  <title>Animated radial gauge at 72 percent</title>
  <text x="500" y="52" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">MIGRATION</text>
  <text x="500" y="80" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">Gauge reaches 72%</text>
  <path d="M 158.1 353.9 A 130 130 0 1 1 341.9 353.9" pathLength="100" fill="none" stroke-linecap="round" style="stroke:color-mix(in srgb, var(--text-muted,#64748b) 22%, transparent);stroke-width:22"/>
  <path d="M 158.1 353.9 A 130 130 0 1 1 341.9 353.9" pathLength="100" fill="none" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="28" transform="translate(4 5)" style="stroke:color-mix(in srgb, var(--teal,#0d9488) 30%, transparent);stroke-width:22">
    <animate attributeName="stroke-dashoffset" from="100" to="28" dur="1.6s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1"/>
  </path>
  <path d="M 158.1 353.9 A 130 130 0 1 1 341.9 353.9" pathLength="100" fill="none" stroke-linecap="round" stroke-dasharray="100 100" stroke-dashoffset="28" style="stroke:var(--teal,#0d9488);stroke-width:22">
    <animate attributeName="stroke-dashoffset" from="100" to="28" dur="1.6s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1"/>
  </path>
  <g stroke-linecap="round">
    <line x1="143.9" y1="368.1" x2="134.0" y2="378.0" style="stroke:var(--text,#0f172a);stroke-width:2.5"/>
    <line x1="107.3" y1="308.4" x2="99.7" y2="310.8" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
    <line x1="101.8" y1="238.5" x2="93.9" y2="237.3" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
    <line x1="128.6" y1="173.8" x2="122.2" y2="169.1" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
    <line x1="181.9" y1="128.3" x2="178.3" y2="121.2" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
    <line x1="250.0" y1="112.0" x2="250.0" y2="98.0" style="stroke:var(--text,#0f172a);stroke-width:2.5"/>
    <line x1="318.1" y1="128.3" x2="321.7" y2="121.2" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
    <line x1="371.4" y1="173.8" x2="377.8" y2="169.1" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
    <line x1="398.2" y1="238.5" x2="406.1" y2="237.3" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
    <line x1="392.7" y1="308.4" x2="400.3" y2="310.8" style="stroke:var(--text-muted,#64748b);stroke-width:2"/>
    <line x1="356.1" y1="368.1" x2="366.0" y2="378.0" style="stroke:var(--text,#0f172a);stroke-width:2.5"/>
  </g>
  <text x="122.7" y="393.3" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">0</text>
  <text x="250.0" y="86.0" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">50</text>
  <text x="377.3" y="393.3" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">100</text>
  <text x="250" y="232" text-anchor="middle" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">COMPLETE</text>
  <text x="250" y="282" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:44px;font-weight:700;fill:var(--text,#0f172a)">72%</text>
  <text x="250" y="308" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:13px;fill:var(--text-muted,#64748b)">36 of 50 tables moved</text>
  <rect x="500" y="140" width="260" height="108" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
    <rect x="500" y="140" width="260" height="108" rx="12" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 16%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <text x="522" y="172" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, var(--amber,#f59e0b) 70%, var(--text,#0f172a))">THROUGHPUT</text>
  <text x="522" y="204" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">4.2 GB/min</text>
  <text x="522" y="228" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">steady over the last hour</text>
  <rect x="500" y="270" width="260" height="108" rx="12" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 22%, transparent);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 45%, transparent);stroke-width:1.5"/>
    <rect x="500" y="270" width="260" height="108" rx="12" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 16%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:2"/>
  <text x="522" y="302" letter-spacing="1.2" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:color-mix(in srgb, color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a)) 70%, var(--text,#0f172a))">ETA</text>
  <text x="522" y="334" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:700;fill:var(--text,#0f172a)">2 h 10 min</text>
  <text x="522" y="358" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">at the current rate</text>

</svg>
