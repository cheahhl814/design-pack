<!--
html-template-pack · deck chrome · section-divider-frame
  Full-bleed decor for the house deck's "Section" layout (1280x720).
  Tinted left panel (x 0-440) holding concentric rings, a teal edge rule,
  and corner dots. The section title/subtitle placeholders sit to the right
  (x 500-1200), so nothing is drawn there. Decor only: no text.
  Tokens: teal amber coral green border-bright surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Decorative section-divider frame: tinted side panel with concentric rings" style="width:100%;height:auto">
  <title>Section divider frame</title>
  <!-- tinted side panel + edge rule -->
  <rect x="0" y="0" width="440" height="720" style="fill:color-mix(in srgb, var(--teal,#0d9488) 8%, var(--surface,#ffffff))"/>
  <line x1="440" y1="0" x2="440" y2="720" style="stroke:var(--teal,#0d9488);stroke-width:4"/>
  <!-- concentric rings (offset shadow + tinted face) -->
  <circle cx="220" cy="360" r="150" transform="translate(6 8)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 40%, transparent);stroke-width:1.5"/>
  <circle cx="220" cy="360" r="150" style="fill:color-mix(in srgb, var(--teal,#0d9488) 12%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2.5"/>
  <circle cx="220" cy="360" r="100" fill="none" style="stroke:color-mix(in srgb, var(--teal,#0d9488) 55%, transparent);stroke-width:1.5" stroke-dasharray="6 9"/>
  <circle cx="220" cy="360" r="50" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2.5"/>
  <circle cx="220" cy="360" r="12" style="fill:var(--teal,#0d9488)"/>
  <!-- orbit dots on the dashed ring -->
  <circle cx="320" cy="360" r="9" style="fill:var(--coral,#ef4444)"/>
  <circle cx="150" cy="289" r="7" style="fill:var(--green,#10b981)"/>
  <circle cx="171" cy="447" r="6" style="fill:var(--amber,#f59e0b)"/>
  <!-- corner accents -->
  <line x1="56" y1="64" x2="136" y2="64" style="stroke:var(--teal,#0d9488);stroke-width:6" stroke-linecap="round"/>
  <line x1="56" y1="656" x2="104" y2="656" style="stroke:var(--amber,#f59e0b);stroke-width:6" stroke-linecap="round"/>
  <line x1="500" y1="656" x2="1200" y2="656" style="stroke:var(--border-bright,#cbd5e1);stroke-width:2" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="1212" cy="656" r="5" style="fill:var(--teal,#0d9488)"/>
</svg>
