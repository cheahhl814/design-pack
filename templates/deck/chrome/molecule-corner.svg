<!--
html-template-pack · deck chrome · molecule-corner
  Small two-ring molecule motif for the top-right corner of the content
  layouts added in v0.19.0 (Agenda, Quote, Table, KPI, Image + Text); placed
  at x 1040-1220, y 28-118 on the 1280x720 grid. Decor only: no text.
  Tokens: teal deep-blue coral text-muted surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 90" role="img" aria-label="Decorative molecule motif: two linked hexagonal rings" style="width:100%;height:auto">
  <title>Molecule corner</title>
  <line x1="18" y1="62" x2="44" y2="50" style="stroke:var(--text-muted,#64748b);stroke-width:2" stroke-linecap="round"/>
  <polygon points="44,50 44,26 68,13 92,26 92,50 68,63" transform="translate(3 4)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 35%, transparent);stroke-width:1.5"/>
  <polygon points="44,50 44,26 68,13 92,26 92,50 68,63" style="fill:color-mix(in srgb, var(--teal,#0d9488) 10%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2.5" stroke-linejoin="round"/>
  <polygon points="92,50 92,26 116,13 140,26 140,50 116,63" style="fill:var(--surface,#ffffff);stroke:var(--teal,#0d9488);stroke-width:2.5" stroke-linejoin="round"/>
  <circle cx="116" cy="38" r="12" fill="none" style="stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text-muted,#64748b));stroke-width:2"/>
  <line x1="140" y1="50" x2="160" y2="62" style="stroke:var(--text-muted,#64748b);stroke-width:2" stroke-linecap="round"/>
  <circle cx="18" cy="62" r="6" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 60%, var(--text-muted,#64748b))"/>
  <circle cx="162" cy="63" r="6" style="fill:var(--coral,#ef4444)"/>
  <circle cx="68" cy="13" r="4" style="fill:var(--amber,#f59e0b)"/>
</svg>
