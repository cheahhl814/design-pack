<!--
html-template-pack · deck chrome · kpi-medallion
  Petri-dish medallion behind the KPI layout's hero number (x 64-484,
  y 140-560 on the 1280x720 grid). Rim + inner agar ring + a few colonies kept
  to the outer band, so the centre (native number + delta chip placeholders)
  stays clear. Decor only: no text.
  Tokens: teal amber coral green border-bright surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-label="Decorative petri-dish medallion" style="width:100%;height:auto">
  <title>KPI medallion</title>
  <circle cx="210" cy="210" r="196" transform="translate(6 8)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 12%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 30%, transparent);stroke-width:1.5"/>
  <circle cx="210" cy="210" r="196" style="fill:color-mix(in srgb, var(--teal,#0d9488) 7%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:3"/>
  <circle cx="210" cy="210" r="178" fill="none" style="stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="210" cy="210" r="150" fill="none" style="stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-dasharray="4 8"/>
  <!-- colonies on the outer band -->
  <circle cx="90" cy="110" r="10" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 35%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
  <circle cx="112" cy="88" r="5" style="fill:var(--amber,#f59e0b)"/>
  <circle cx="338" cy="140" r="7" style="fill:var(--coral,#ef4444)"/>
  <circle cx="320" cy="320" r="12" style="fill:color-mix(in srgb, var(--green,#10b981) 30%, var(--surface,#ffffff));stroke:var(--green,#10b981);stroke-width:2"/>
  <circle cx="345" cy="300" r="5" style="fill:var(--green,#10b981)"/>
  <circle cx="84" cy="300" r="6" style="fill:var(--teal,#0d9488)"/>
  <circle cx="210" cy="372" r="4" style="fill:var(--coral,#ef4444)"/>
</svg>
