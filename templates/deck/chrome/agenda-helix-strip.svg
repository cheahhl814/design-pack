<!--
html-template-pack · deck chrome · agenda-helix-strip
  Vertical DNA-helix strip for the Agenda layout's right margin (x 1060-1220,
  y 150-650 on the 1280x720 grid): two sine strands with base-pair rungs and
  coloured nodes. Echoes the section-divider rings without competing with the
  native numbered agenda list on the left. Decor only: no text.
  Tokens: teal amber coral green deep-blue border-bright surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 500" role="img" aria-label="Decorative vertical DNA helix strip" style="width:100%;height:auto">
  <title>Agenda helix strip</title>
  <!-- rungs (base pairs) -->
  <g style="stroke:var(--border-bright,#cbd5e1);stroke-width:2" stroke-linecap="round">
    <line x1="44" y1="40" x2="116" y2="40"/>
    <line x1="34" y1="80" x2="126" y2="80"/>
    <line x1="44" y1="120" x2="116" y2="120"/>
    <line x1="44" y1="240" x2="116" y2="240"/>
    <line x1="34" y1="280" x2="126" y2="280"/>
    <line x1="44" y1="320" x2="116" y2="320"/>
    <line x1="44" y1="440" x2="116" y2="440"/>
    <line x1="34" y1="480" x2="126" y2="480"/>
  </g>
  <!-- strands: period 200, amplitude 50, centre x 80 -->
  <path d="M 80 0 C 130 30 130 70 80 100 C 30 130 30 170 80 200 C 130 230 130 270 80 300 C 30 330 30 370 80 400 C 130 430 130 470 80 500" fill="none" style="stroke:var(--teal,#0d9488);stroke-width:3.5" stroke-linecap="round"/>
  <path d="M 80 0 C 30 30 30 70 80 100 C 130 130 130 170 80 200 C 30 230 30 270 80 300 C 130 330 130 370 80 400 C 30 430 30 470 80 500" fill="none" style="stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text-muted,#64748b));stroke-width:3.5" stroke-linecap="round"/>
  <!-- crossing nodes -->
  <circle cx="80" cy="100" r="9" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:3"/>
  <circle cx="80" cy="200" r="9" style="fill:var(--teal,#0d9488)"/>
  <circle cx="80" cy="300" r="9" style="fill:var(--surface,#ffffff);stroke:var(--coral,#ef4444);stroke-width:3"/>
  <circle cx="80" cy="400" r="9" style="fill:var(--green,#10b981)"/>
</svg>
