<!--
html-template-pack · deck chrome · deck-title-art
  Full-bleed decor for the house deck's "Title" layout (1280x720 = 13.333x7.5 in).
  Art keeps to the right 40% plus a short accent rule above the title and a
  dotted baseline; the left 60% is left clear for the native title/subtitle
  placeholders. Decor only: no text, marked decorative when embedded.
  Tokens: teal amber coral green deep-blue border-bright text-muted surface.
  Bake with bin/svg-export.js; templates/deck/author-base.py does this per theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Decorative title-slide art: overlapping rings and a small node network" style="width:100%;height:auto">
  <title>Deck title art</title>
  <!-- accent rule above the title -->
  <line x1="80" y1="196" x2="196" y2="196" style="stroke:var(--teal,#0d9488);stroke-width:8" stroke-linecap="round"/>
  <line x1="214" y1="196" x2="238" y2="196" style="stroke:var(--amber,#f59e0b);stroke-width:8" stroke-linecap="round"/>
  <!-- big ring (offset shadow + tinted face) -->
  <circle cx="1030" cy="290" r="186" transform="translate(6 8)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 14%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 35%, transparent);stroke-width:1.5"/>
  <circle cx="1030" cy="290" r="186" style="fill:color-mix(in srgb, var(--teal,#0d9488) 9%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2.5"/>
  <circle cx="1030" cy="290" r="122" fill="none" style="stroke:color-mix(in srgb, var(--teal,#0d9488) 50%, transparent);stroke-width:1.5" stroke-dasharray="6 9"/>
  <!-- amber + coral satellites -->
  <circle cx="1148" cy="520" r="92" transform="translate(5 7)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 18%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 40%, transparent);stroke-width:1.5"/>
  <circle cx="1148" cy="520" r="92" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 14%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2.5"/>
  <circle cx="902" cy="520" r="52" transform="translate(4 6)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 18%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 40%, transparent);stroke-width:1.5"/>
  <circle cx="902" cy="520" r="52" style="fill:color-mix(in srgb, var(--coral,#ef4444) 13%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2.5"/>
  <!-- node network inside the big ring (spokes to points on the dashed ring) -->
  <g style="stroke:var(--text-muted,#64748b);stroke-width:1.5" stroke-linecap="round">
    <line x1="1030" y1="290" x2="1030" y2="168"/>
    <line x1="1030" y1="290" x2="1136" y2="229"/>
    <line x1="1030" y1="290" x2="1136" y2="351"/>
    <line x1="1030" y1="290" x2="924" y2="351"/>
    <line x1="1030" y1="290" x2="924" y2="229"/>
    <line x1="1030" y1="168" x2="1136" y2="229"/>
    <line x1="924" y1="351" x2="924" y2="229"/>
  </g>
  <circle cx="1030" cy="290" r="18" style="fill:var(--teal,#0d9488)"/>
  <circle cx="1030" cy="168" r="10" style="fill:var(--surface,#ffffff);stroke:var(--deep-blue,#2c4a7c);stroke-width:2.5"/>
  <circle cx="1136" cy="229" r="10" style="fill:var(--surface,#ffffff);stroke:var(--green,#10b981);stroke-width:2.5"/>
  <circle cx="1136" cy="351" r="10" style="fill:var(--surface,#ffffff);stroke:var(--amber,#f59e0b);stroke-width:2.5"/>
  <circle cx="924" cy="351" r="10" style="fill:var(--surface,#ffffff);stroke:var(--coral,#ef4444);stroke-width:2.5"/>
  <circle cx="924" cy="229" r="10" style="fill:var(--surface,#ffffff);stroke:var(--teal,#0d9488);stroke-width:2.5"/>
  <!-- scattered accent dots -->
  <circle cx="848" cy="140" r="6" style="fill:var(--green,#10b981)"/>
  <circle cx="1232" cy="120" r="5" style="fill:var(--coral,#ef4444)"/>
  <circle cx="1010" cy="560" r="7" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 60%, var(--text-muted,#64748b))"/>
  <circle cx="1240" cy="380" r="4" style="fill:var(--teal,#0d9488)"/>
  <!-- dotted baseline -->
  <line x1="80" y1="650" x2="1200" y2="650" style="stroke:var(--border-bright,#cbd5e1);stroke-width:2" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="1212" cy="650" r="5" style="fill:var(--teal,#0d9488)"/>
</svg>
