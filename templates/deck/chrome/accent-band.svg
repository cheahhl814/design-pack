<!--
html-template-pack · deck chrome · accent-band
  Bottom-edge accent band (1280x16, flush with the slide's bottom edge) used
  by the Closing layout instead of the dotted footer strip: four
  full-bleed colour bands in the deck accent order. Decor only: no text.
  Tokens: teal deep-blue amber coral.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 16" role="img" aria-label="Decorative bottom accent band in four colours" style="width:100%;height:auto">
  <title>Accent band</title>
  <rect x="0" y="0" width="640" height="16" style="fill:var(--teal,#0d9488)"/>
  <rect x="640" y="0" width="320" height="16" style="fill:color-mix(in srgb, var(--deep-blue,#2c4a7c) 70%, var(--teal,#0d9488))"/>
  <rect x="960" y="0" width="200" height="16" style="fill:var(--amber,#f59e0b)"/>
  <rect x="1160" y="0" width="120" height="16" style="fill:var(--coral,#ef4444)"/>
</svg>
