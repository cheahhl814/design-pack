<!--
design-pack · svg-slides · editorial · diagram-hero
  Graphic-dominant slide: a thin one-line heading strip over one large graphic
  slot (1224 x 610 of the 1280 x 720 canvas); a contain-fit diagram covers at
  least two thirds of the slide, enforced by the composer (data-graphic-min
  0.667). No takeaway card: put the point in the heading.
  Slots: heading (text, 1 × 52 ch) · figure (graphic).
  Tokens: surface text font-head teal amber border-bright coral text-muted
  font-sans.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Diagram slide: a one-line heading strip over a graphic that fills more than two thirds of the slide" data-graphic-min="0.667" style="width:100%;height:auto">
  <title>Diagram-hero design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#f6f1e7)"/>
  <g data-slot="heading" data-slot-kind="text" data-slot-box="28 24 1224 40" data-slot-font="head" data-slot-weight="700" data-slot-size="30" data-slot-maxlines="1" data-slot-maxchars="52" data-slot-anchor="start" data-slot-fill="var(--text,#2b2118)">
    <text x="28" y="58.5" text-anchor="start" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:30px;font-weight:700;fill:var(--text,#2b2118)">Amplification doubles the target every cycle</text>
  </g>
  <rect x="28" y="70" width="50" height="4" rx="2" style="fill:var(--teal,#b5532c)"/>
  <rect x="86" y="70" width="10" height="4" rx="2" style="fill:var(--amber,#c99a3b)"/>
  <rect x="20" y="80" width="1240" height="626" rx="14" style="fill:color-mix(in srgb, var(--teal,#b5532c) 3%, var(--surface,#f6f1e7));stroke:color-mix(in srgb, var(--border-bright,#cdbb9c) 70%, transparent);stroke-width:1.5"/>
  <g data-slot="figure" data-slot-kind="graphic" data-slot-box="28 88 1224 610">
    <rect x="28" y="88" width="1224" height="610" style="fill:color-mix(in srgb, var(--teal,#b5532c) 4%, transparent);stroke:var(--border-bright,#cdbb9c);stroke-width:1.5" stroke-dasharray="6 6"/>
    <rect x="570" y="353" width="36" height="28" style="fill:color-mix(in srgb, var(--teal,#b5532c) 16%, var(--surface,#f6f1e7));stroke:var(--teal,#b5532c);stroke-width:2"/>
    <rect x="622" y="353" width="36" height="28" style="fill:color-mix(in srgb, var(--amber,#c99a3b) 16%, var(--surface,#f6f1e7));stroke:var(--amber,#c99a3b);stroke-width:2"/>
    <rect x="674" y="353" width="36" height="28" style="fill:color-mix(in srgb, var(--coral,#9e3b2f) 16%, var(--surface,#f6f1e7));stroke:var(--coral,#9e3b2f);stroke-width:2"/>
    <text x="640" y="415" text-anchor="middle" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:11px;font-weight:700;fill:var(--text-muted,#75644f);letter-spacing:1.2px">GRAPHIC SLOT</text>
    <text x="640" y="435" text-anchor="middle" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:12px;fill:var(--text-muted,#75644f)">place an svg-library component here (800 × 450)</text>
  </g>
</svg>
