<!--
design-pack · svg-slides · editorial · big-statement
  Pull-quote slide: a large terracotta opening quotation mark hangs in the
  left margin, a three-line serif statement sits between two hairlines with
  the eyebrow above, and the attribution follows in sans.
  Slots: eyebrow (text, optional, 1 × 48 ch) · statement (text, 3 × 42 ch) ·
  attribution (text, optional, 1 × 70 ch).
  Tokens: surface font-head accent border-bright font-sans text text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Pull-quote slide on cream paper: a large terracotta opening quotation mark, a three-line serif statement between hairlines and an attribution line" style="width:100%;height:auto">
  <title>Editorial pull-quote design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#f6f1e7)"/>
  <text x="150" y="300" text-anchor="end" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:220px;fill:color-mix(in srgb, var(--accent,#b5532c) 80%, var(--surface,#f6f1e7))">“</text>
  <line x1="200" y1="150" x2="1100" y2="150" style="fill:none;stroke:var(--border-bright,#cdbb9c);stroke-width:1"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="200 170 900 20" data-slot-font="sans" data-slot-weight="700" data-slot-size="13" data-slot-tracking="2.4" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="start" data-slot-fill="var(--accent,#b5532c)" data-slot-optional="true">
    <text x="200" y="184.9" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:13px;font-weight:700;fill:var(--accent,#b5532c);letter-spacing:2.4px">WHAT WE LEARNED</text>
  </g>
  <g data-slot="statement" data-slot-kind="text" data-slot-box="200 214 900 160" data-slot-font="head" data-slot-weight="400" data-slot-size="38" data-slot-maxlines="3" data-slot-maxchars="42" data-slot-anchor="start" data-slot-fill="var(--text,#2b2118)">
    <text x="200" y="257.7" text-anchor="start" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:38px;font-weight:400;fill:var(--text,#2b2118)">Most failed runs were not chemistry.</text>
    <text x="200" y="305.2" text-anchor="start" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:38px;font-weight:400;fill:var(--text,#2b2118)">They were bubbles in the inlet channel,</text>
    <text x="200" y="352.7" text-anchor="start" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:38px;font-weight:400;fill:var(--text,#2b2118)">and a 2 mm fillet fixed nine in ten.</text>
  </g>
  <line x1="200" y1="400" x2="1100" y2="400" style="fill:none;stroke:var(--border-bright,#cdbb9c);stroke-width:1"/>
  <g data-slot="attribution" data-slot-kind="text" data-slot-box="200 420 900 26" data-slot-font="sans" data-slot-weight="400" data-slot-size="17" data-slot-maxlines="1" data-slot-maxchars="70" data-slot-anchor="start" data-slot-fill="var(--text-muted,#75644f)" data-slot-optional="true">
    <text x="200" y="439.6" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:17px;font-weight:400;fill:var(--text-muted,#75644f)">Run log review, 212 chips, July to September 2026</text>
  </g>
</svg>
