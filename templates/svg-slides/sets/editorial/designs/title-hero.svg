<!--
html-template-pack · svg-slides · editorial · title-hero
  Cover: cream paper, a double rule under the tracked eyebrow, a two-line
  serif title flush left, a sans subtitle, a hairline above the meta line; the
  right column is a thin-framed plate with a terracotta sun setting into ruled
  lines.
  Slots: eyebrow (text, 1 × 48 ch) · hero-title (text, 2 × 24 ch) · subtitle
  (text, 2 × 64 ch) · meta (text, optional, 1 × 80 ch).
  Tokens: surface text accent font-sans font-head text-muted border-bright
  teal.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Magazine cover slide on cream paper: a double rule and tracked eyebrow, a two-line serif title, a subtitle, a hairline over the meta line, and a framed terracotta sun over ruled lines on the right" style="width:100%;height:auto">
