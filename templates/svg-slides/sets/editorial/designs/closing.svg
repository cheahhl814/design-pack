<!--
design-pack · svg-slides · editorial · closing
  Closing slide: double rules frame the page, a centred two-line serif title,
  a small terracotta diamond on a hairline, then centred sans contact lines
  and a tracked meta line.
  Slots: title (text, 2 × 20 ch) · contact (text, 3 × 60 ch) · meta (text,
  optional, 1 × 80 ch).
  Tokens: surface text font-head border-bright accent font-sans text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Closing slide on cream paper: double rules top and bottom, a centred two-line serif title, a small terracotta diamond, centred contact lines and a meta line" style="width:100%;height:auto">
  <title>Editorial closing slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#f6f1e7)"/>
  <line x1="80" y1="80" x2="1200" y2="80" style="fill:none;stroke:var(--text,#2b2118);stroke-width:1.5"/>
  <line x1="80" y1="85" x2="1200" y2="85" style="fill:none;stroke:var(--text,#2b2118);stroke-width:0.75"/>
  <g data-slot="title" data-slot-kind="text" data-slot-box="140 180 1000 172" data-slot-font="head" data-slot-weight="400" data-slot-size="68" data-slot-maxlines="2" data-slot-maxchars="20" data-slot-anchor="middle" data-slot-fill="var(--text,#2b2118)">
    <text x="640" y="258.2" text-anchor="middle" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:68px;font-weight:400;fill:var(--text,#2b2118)">Thank you</text>
    <text x="640" y="343.2" text-anchor="middle" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:68px;font-weight:400;fill:var(--text,#2b2118)">Questions?</text>
  </g>
  <line x1="520" y1="384" x2="760" y2="384" style="fill:none;stroke:var(--border-bright,#cdbb9c);stroke-width:1"/>
  <polygon points="640,374 650,384 640,394 630,384" style="fill:var(--accent,#b5532c)"/>
  <g data-slot="contact" data-slot-kind="text" data-slot-box="140 410 1000 84" data-slot-font="sans" data-slot-weight="400" data-slot-size="21" data-slot-maxlines="3" data-slot-maxchars="60" data-slot-anchor="middle" data-slot-fill="var(--text,#2b2118)">
    <text x="640" y="434.1" text-anchor="middle" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:21px;font-weight:400;fill:var(--text,#2b2118)">A. Researcher, Microfluidics Group</text>
    <text x="640" y="460.4" text-anchor="middle" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:21px;font-weight:400;fill:var(--text,#2b2118)">a.researcher@example.org</text>
  </g>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="140 560 1000 22" data-slot-font="sans" data-slot-weight="400" data-slot-size="14" data-slot-tracking="1" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="middle" data-slot-fill="var(--text-muted,#75644f)" data-slot-optional="true">
    <text x="640" y="576.1" text-anchor="middle" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:14px;font-weight:400;fill:var(--text-muted,#75644f);letter-spacing:1px">Slides, run log and chip CAD: example.org/lab-on-chip</text>
  </g>
  <line x1="80" y1="620" x2="1200" y2="620" style="fill:none;stroke:var(--text,#2b2118);stroke-width:1.5"/>
  <line x1="80" y1="625" x2="1200" y2="625" style="fill:none;stroke:var(--text,#2b2118);stroke-width:0.75"/>
</svg>
