design-pack · svg-slides · editorial · content-two-col
  Spread: tracked eyebrow and serif heading over a double rule; the left
  column holds the sans body and a terracotta serif pull-quote between
  hairlines, a column hairline divides it from a thin-framed figure plate and
  caption.
  Slots: eyebrow (text, optional, 1 × 56 ch) · heading (text, 1 × 48 ch) ·
  body (text, 6 × 46 ch) · callout (text, optional, 2 × 46 ch) · figure
