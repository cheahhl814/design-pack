<!--
design-pack · svg-slides · editorial · section-break
  Section divider: an oversized terracotta serif numeral on the left, a
  vertical hairline, then the tracked eyebrow, a two-line serif section title
  and a sans orientation line; a double rule closes the page.
  Slots: number (text, 1 × 2 ch) · eyebrow (text, optional, 1 × 44 ch) ·
  section-title (text, 2 × 24 ch) · orientation (text, 1 × 56 ch).
  Tokens: surface accent font-head border-bright font-sans text text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Section divider on cream paper: an oversized terracotta serif numeral, a vertical hairline, and the eyebrow, two-line serif section title and orientation line, closed by a double rule" style="width:100%;height:auto">
  <title>Editorial section divider design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#f6f1e7)"/>
  <g data-slot="number" data-slot-kind="text" data-slot-box="80 160 400 300" data-slot-font="head" data-slot-weight="400" data-slot-size="240" data-slot-maxlines="1" data-slot-maxchars="2" data-slot-anchor="start" data-slot-fill="var(--accent,#b5532c)">
    <text x="80" y="436" text-anchor="start" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:240px;font-weight:400;fill:var(--accent,#b5532c)">02</text>
  </g>
  <line x1="500" y1="200" x2="500" y2="500" style="fill:none;stroke:var(--border-bright,#cdbb9c);stroke-width:1"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="540 230 640 20" data-slot-font="sans" data-slot-weight="700" data-slot-size="13" data-slot-tracking="2.4" data-slot-maxlines="1" data-slot-maxchars="44" data-slot-anchor="start" data-slot-fill="var(--accent,#b5532c)" data-slot-optional="true">
    <text x="540" y="244.9" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:13px;font-weight:700;fill:var(--accent,#b5532c);letter-spacing:2.4px">PART TWO</text>
  </g>
  <g data-slot="section-title" data-slot-kind="text" data-slot-box="540 270 660 130" data-slot-font="head" data-slot-weight="400" data-slot-size="48" data-slot-maxlines="2" data-slot-maxchars="24" data-slot-anchor="start" data-slot-fill="var(--text,#2b2118)">
    <text x="540" y="325.2" text-anchor="start" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:48px;font-weight:400;fill:var(--text,#2b2118)">How the assay</text>
    <text x="540" y="385.2" text-anchor="start" style="font-family:var(--font-head,Georgia, Iowan Old Style, Palatino Linotype, serif);font-size:48px;font-weight:400;fill:var(--text,#2b2118)">actually works</text>
  </g>
  <g data-slot="orientation" data-slot-kind="text" data-slot-box="540 430 660 30" data-slot-font="sans" data-slot-weight="400" data-slot-size="21" data-slot-maxlines="1" data-slot-maxchars="56" data-slot-anchor="start" data-slot-fill="var(--text-muted,#75644f)">
    <text x="540" y="454.1" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:21px;font-weight:400;fill:var(--text-muted,#75644f)">Sample prep, amplification and the readout</text>
  </g>
  <line x1="80" y1="600" x2="1200" y2="600" style="fill:none;stroke:var(--text,#2b2118);stroke-width:1.5"/>
