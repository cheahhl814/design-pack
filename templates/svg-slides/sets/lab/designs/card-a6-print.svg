<!--
design-pack · svg-slides · card-a6-print
  A6 portrait recipe-style info card (397x560, data-canvas = 96 dpi): an 8 px inner card border, a title zone, a
  narrow left column (five short lines and a small figure), a wider right column of five numbered steps, a note
  and a bottom citation strip. Ink-friendly: hairline strokes, white fill. Print path:
  bin/svg-export.js with the png and pdf flags gives one page at the design size (README).
  Slots: eyebrow (optional) · title · list-heading · list · list-figure · steps-heading · step-1..5 · note (optional) · citation.
  Tokens: teal amber coral deep-blue text text-muted border border-bright surface font-head font-sans.
  Compose with bin/compose-slide.js; slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 560" data-canvas="0 0 397 560" role="img" aria-label="A6 portrait info card with a title zone, a narrow list column with a small figure, a numbered steps column, a note, a citation strip and an inner card border" style="width:100%;height:auto">
