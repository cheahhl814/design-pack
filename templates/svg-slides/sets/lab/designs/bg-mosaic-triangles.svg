<!--
html-template-pack · svg-slides · bg-mosaic-triangles
  Background design (1280x720, decor only, zero slots):
  clean field with a geometric triangle mosaic (alternating up/down
  triangles, teal/amber/coral/deep-blue tints) stepping down into the
  bottom-right corner over four staggered rows, a dotted rule above it and a
  short teal + amber accent rule at the top left. After ppt-design.com's
  geometric cover themes.
  Paints its own bottom edge (no footer line).
  Content zone: upper-left (x 80-1000, y 120-420, and x 80-560 down to y 640) is clear.
  Tokens: teal amber coral deep-blue text border-bright surface.
  Compose with bin/compose-slide.js and an empty payload ({}); rules in templates/svg-slides/README.md.
-->
