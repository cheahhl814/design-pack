design-pack · svg-slides · bg-flow-dashes
  Background design (1280x720, decor only, zero slots):
  plain field with six layered, wavy dashed contour lines (teal family + one
  amber) drifting across the lower third over a faint teal wash, very low
  contrast, with three dot accents. After Craftwork's flow-pattern pack.
  Paints its own bottom edge (no footer line).
  Content zone: the whole upper zone (x 60-1220, y 60-460) is clear.
  Tokens: teal amber coral surface.
  Compose with bin/compose-slide.js and an empty payload ({}); rules in templates/svg-slides/README.md.
-->
