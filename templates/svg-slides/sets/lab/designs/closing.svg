<!--
html-template-pack · svg-slides · closing
  Closing slide (1280x720): soft teal field, accent rule, a two-line thanks /
  summary title, up to three contact lines and an optional meta line on the
  left 55%; orbit rings around a node network on the right (re-drawn slot-ready
  from the former deck chrome's closing-orbit).
  Slots: title (text, 2 × 20 ch) · contact (text, 3 × 50 ch) · meta (text, optional).
  Tokens: teal amber coral green deep-blue text text-muted border-bright surface font-head font-sans.
  Compose with bin/compose-slide.js; slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Closing slide with a thank-you title, contact lines and orbit rings around a small node network" style="width:100%;height:auto">
  <title>Closing slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:color-mix(in srgb, var(--teal,#0d9488) 6%, var(--surface,#ffffff))"/>
  <line x1="80" y1="226" x2="196" y2="226" style="stroke:var(--teal,#0d9488);stroke-width:8" stroke-linecap="round"/>
  <line x1="214" y1="226" x2="238" y2="226" style="stroke:var(--amber,#f59e0b);stroke-width:8" stroke-linecap="round"/>
  <g data-slot="title" data-slot-kind="text" data-slot-box="80 246 660 160" data-slot-font="head" data-slot-weight="700" data-slot-size="60" data-slot-maxlines="2" data-slot-maxchars="20" data-slot-anchor="start" data-slot-fill="var(--text,#0f172a)">
    <text x="80" y="315" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:60px;font-weight:700;fill:var(--text,#0f172a)">Thank you</text>
  </g>
  <g data-slot="contact" data-slot-kind="text" data-slot-box="80 430 660 84" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="3" data-slot-maxchars="50" data-slot-anchor="start" data-slot-fill="var(--text,#0f172a)">
    <text x="80" y="455.3" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:22px;font-weight:400;fill:var(--text,#0f172a)">Questions are welcome</text>
    <text x="80" y="482.8" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:22px;font-weight:400;fill:var(--text,#0f172a)">name@example.org</text>
  </g>
  <line x1="80" y1="544" x2="112" y2="544" style="stroke:var(--border-bright,#cbd5e1);stroke-width:2" stroke-linecap="round"/>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="80 560 660 22" data-slot-font="sans" data-slot-weight="400" data-slot-size="16" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="start" data-slot-fill="var(--text-muted,#64748b)" data-slot-optional="true">
    <text x="80" y="578.4" text-anchor="start" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:16px;font-weight:400;fill:var(--text-muted,#64748b)">Slides and data: example.org/talk</text>
  </g>
  <!-- orbit rings -->
  <circle cx="1010" cy="350" r="250" fill="none" style="stroke:var(--border-bright,#cbd5e1);stroke-width:2" stroke-dasharray="3 10"/>
  <circle cx="1010" cy="350" r="170" fill="none" style="stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:2"/>
  <!-- node network -->
  <g style="stroke:var(--text-muted,#64748b);stroke-width:2" stroke-linecap="round">
    <line x1="1010" y1="350" x2="1150" y2="254"/>
    <line x1="1010" y1="350" x2="890" y2="470"/>
    <line x1="1010" y1="350" x2="1120" y2="490"/>
    <line x1="1010" y1="350" x2="860" y2="240"/>
    <line x1="1150" y1="254" x2="1215" y2="150"/>
    <line x1="890" y1="470" x2="820" y2="560"/>
  </g>
  <circle cx="1010" cy="350" r="48" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 22%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 45%, transparent);stroke-width:1.5"/>
  <circle cx="1010" cy="350" r="48" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:3"/>
  <circle cx="1010" cy="350" r="14" style="fill:var(--teal,#0d9488)"/>
  <circle cx="1150" cy="254" r="22" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--coral,#ef4444) 22%, transparent);stroke:color-mix(in srgb, var(--coral,#ef4444) 45%, transparent);stroke-width:1.5"/>
  <circle cx="1150" cy="254" r="22" style="fill:color-mix(in srgb, var(--coral,#ef4444) 16%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:3"/>
  <circle cx="890" cy="470" r="26" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 22%, transparent);stroke:color-mix(in srgb, var(--amber,#f59e0b) 45%, transparent);stroke-width:1.5"/>
  <circle cx="890" cy="470" r="26" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 18%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:3"/>
  <circle cx="1120" cy="490" r="14" style="fill:var(--green,#10b981)"/>
  <circle cx="860" cy="240" r="10" style="fill:var(--surface,#ffffff);stroke:color-mix(in srgb, var(--deep-blue,#2c4a7c) 55%, var(--text,#0f172a));stroke-width:3"/>
  <circle cx="1215" cy="150" r="8" style="fill:var(--teal,#0d9488)"/>
  <circle cx="820" cy="560" r="7" style="fill:var(--coral,#ef4444)"/>
</svg>
