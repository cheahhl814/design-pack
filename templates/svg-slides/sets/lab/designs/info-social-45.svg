<!--
design-pack · svg-slides · info-social-45
  Feed infographic card (1080x1350, 4:5, data-canvas): eyebrow and title, a hero stat block (big number, label,
  note), a mini listicle of four numbered rows and a takeaways card. Safe zones: the top 120 px and the bottom 180 px
  hold decoration only, so platform UI and crops never hide critical content (everything lives in y 120 to 1170).
  Slots: eyebrow (optional) · title · stat-value · stat-label · stat-note (optional) · list-heading · item-1..4 · takeaway.
  Tokens: teal amber coral deep-blue text text-muted border border-bright surface font-head font-sans.
  Compose with bin/compose-slide.js; slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" data-canvas="0 0 1080 1350" role="img" aria-label="Four-by-five social infographic card with an eyebrow and title, a hero statistic block, a four-row numbered listicle and a takeaway card, with free safe zones top and bottom" style="width:100%;height:auto">
