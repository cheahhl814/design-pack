    <circle cx="1030" cy="102" r="4"/><circle cx="1064" cy="102" r="4"/><circle cx="1098" cy="102" r="4"/><circle cx="1166" cy="102" r="4"/><circle cx="1200" cy="102" r="4"/>
    <circle cx="1030" cy="132" r="4"/><circle cx="1064" cy="132" r="4"/><circle cx="1098" cy="132" r="4"/><circle cx="1132" cy="132" r="4"/><circle cx="1200" cy="132" r="4"/>
  </g>
  <circle cx="1132" cy="102" r="7" style="fill:var(--teal,#0d9488)"/>
  <circle cx="1166" cy="132" r="6" style="fill:var(--amber,#f59e0b)"/>
  <circle cx="1234" cy="72" r="5" style="fill:var(--coral,#ef4444)"/>
  <!-- accent rule above the eyebrow -->
  <line x1="80" y1="146" x2="196" y2="146" style="stroke:var(--teal,#0d9488);stroke-width:8" stroke-linecap="round"/>
  <line x1="214" y1="146" x2="238" y2="146" style="stroke:var(--amber,#f59e0b);stroke-width:8" stroke-linecap="round"/>
  <!-- text slots -->
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="80 168 720 20" data-slot-font="head" data-slot-weight="700" data-slot-size="14" data-slot-tracking="1.2" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))">
