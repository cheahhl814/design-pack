<!--
design-pack · svg-slides · boardroom · section-break
  Section divider: a navy left panel holds the chapter number in serif; on
  white, the six-square agenda tracker (current square filled), eyebrow, a
  two-line serif section title under an accent rule and a sans orientation
  line.
  Slots: number (text, 1 × 2 ch) · eyebrow (text, optional, 1 × 44 ch) ·
  section-title (text, 2 × 24 ch) · orientation (text, 1 × 56 ch).
  Tokens: surface block on-block font-sans accent border-bright text font-head
  text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Section divider: a navy left panel holding the chapter number, the agenda tracker with the current section filled, and the serif section title with an orientation line on white" style="width:100%;height:auto">
  <title>Boardroom section divider design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#ffffff)"/>
