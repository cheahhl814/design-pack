  <g data-slot="number" data-slot-kind="text" data-slot-box="60 250 300 200" data-slot-font="sans" data-slot-weight="700" data-slot-size="160" data-slot-maxlines="1" data-slot-maxchars="2" data-slot-anchor="middle" data-slot-fill="var(--on-block,#ffffff)">
