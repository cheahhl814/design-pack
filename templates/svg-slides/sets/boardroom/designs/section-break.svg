  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="500 236 700 20" data-slot-font="sans" data-slot-weight="700" data-slot-size="14" data-slot-tracking="2" data-slot-maxlines="1" data-slot-maxchars="44" data-slot-anchor="start" data-slot-fill="var(--accent,#2f6bff)" data-slot-optional="true">
