<!--
design-pack · svg-slides · boardroom · title-hero
  Cover: full navy field; accent rule and tracked eyebrow, a two-line serif
  title, a sans subtitle, a thin rule above the meta line, and a small
  four-bar rising chart motif (last bar in the accent) on the right.
  Slots: eyebrow (text, 1 × 48 ch) · hero-title (text, 2 × 26 ch) · subtitle
  (text, 2 × 72 ch) · meta (text, optional, 1 × 80 ch).
  Tokens: block accent on-block font-sans font-head.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Navy cover slide: an accent rule and eyebrow, a two-line serif title, a subtitle, a thin rule over the meta line and a small rising bar chart motif on the right" style="width:100%;height:auto">
  <title>Boardroom cover slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--block,#12355b)"/>
