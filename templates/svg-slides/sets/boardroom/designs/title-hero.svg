  <g data-slot="subtitle" data-slot-kind="text" data-slot-box="96 380 820 60" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="2" data-slot-maxchars="72" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-block,#ffffff) 72%, var(--block,#12355b))">
