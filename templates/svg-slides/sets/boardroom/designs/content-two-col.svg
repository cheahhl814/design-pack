  <rect x="1146" y="34" width="8" height="8" style="fill:none;stroke:var(--border-bright,#c3ccd7);stroke-width:1.2"/>
  <rect x="1160" y="34" width="8" height="8" style="fill:var(--block,#12355b)"/>
  <rect x="1174" y="34" width="8" height="8" style="fill:none;stroke:var(--border-bright,#c3ccd7);stroke-width:1.2"/>
