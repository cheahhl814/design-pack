    <rect x="64" y="146" width="680" height="430" style="fill:color-mix(in srgb, var(--teal,#12355b) 4%, transparent);stroke:var(--border-bright,#c3ccd7);stroke-width:1.5" stroke-dasharray="6 6"/>
    <rect x="334" y="321" width="36" height="28" style="fill:color-mix(in srgb, var(--teal,#12355b) 16%, var(--surface,#ffffff));stroke:var(--teal,#12355b);stroke-width:2"/>
    <rect x="386" y="321" width="36" height="28" style="fill:color-mix(in srgb, var(--amber,#c9a227) 16%, var(--surface,#ffffff));stroke:var(--amber,#c9a227);stroke-width:2"/>
    <rect x="438" y="321" width="36" height="28" style="fill:color-mix(in srgb, var(--coral,#d1495b) 16%, var(--surface,#ffffff));stroke:var(--coral,#d1495b);stroke-width:2"/>
    <text x="404" y="383" text-anchor="middle" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:11px;font-weight:700;fill:var(--text-muted,#5b6b7c);letter-spacing:1.2px">GRAPHIC SLOT</text>
    <text x="404" y="403" text-anchor="middle" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:12px;fill:var(--text-muted,#5b6b7c)">place an svg-library component here (800 × 450)</text>
  </g>
  <g data-slot="caption" data-slot-kind="text" data-slot-box="64 592 680 36" data-slot-font="sans" data-slot-weight="400" data-slot-size="13" data-slot-maxlines="2" data-slot-maxchars="90" data-slot-anchor="start" data-slot-fill="var(--text-muted,#5b6b7c)" data-slot-optional="true">
    <text x="64" y="607" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:13px;font-weight:400;fill:var(--text-muted,#5b6b7c)">Stage timings are medians over the 212 runs in the Q3 log.</text>
