  <line x1="764" y1="146" x2="764" y2="620" style="fill:none;stroke:var(--border,#e2e7ee);stroke-width:1"/>
  <g data-slot="body" data-slot-kind="text" data-slot-box="788 150 428 150" data-slot-font="sans" data-slot-weight="400" data-slot-size="19" data-slot-maxlines="6" data-slot-maxchars="44" data-slot-anchor="start" data-slot-fill="var(--text,#0b1f33)">
