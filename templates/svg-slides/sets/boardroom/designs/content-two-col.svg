    <text x="788" y="243.1" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:19px;font-weight:400;fill:var(--text,#0b1f33)">the readout is a lateral-flow strip.</text>
    <text x="788" y="266.9" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:19px;font-weight:400;fill:var(--text,#0b1f33)">Total hands-on time is under five minutes.</text>
  </g>
  <rect x="784" y="436" width="432" height="112" style="fill:var(--block,#12355b)"/>
  <rect x="784" y="436" width="6" height="112" style="fill:var(--accent,#2f6bff)"/>
  <g data-slot="callout" data-slot-kind="text" data-slot-box="806 460 396 60" data-slot-font="head" data-slot-weight="700" data-slot-size="18" data-slot-maxlines="2" data-slot-maxchars="38" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)" data-slot-optional="true">
    <text x="806" y="480.7" text-anchor="start" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:18px;font-weight:700;fill:var(--on-block,#ffffff)">Stage 3 is the bottleneck: 22 of our</text>
    <text x="806" y="503.2" text-anchor="start" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:18px;font-weight:700;fill:var(--on-block,#ffffff)">31 minutes are spent amplifying.</text>
  </g>
