  <rect x="1202" y="34" width="8" height="8" style="fill:none;stroke:var(--border-bright,#c3ccd7);stroke-width:1.2"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="64 28 700 20" data-slot-font="sans" data-slot-weight="700" data-slot-size="12" data-slot-tracking="2" data-slot-maxlines="1" data-slot-maxchars="56" data-slot-anchor="start" data-slot-fill="var(--accent,#2f6bff)" data-slot-optional="true">
    <text x="64" y="41.8" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:12px;font-weight:700;fill:var(--accent,#2f6bff);letter-spacing:2px">METHODS · STEP 1</text>
  </g>
  <g data-slot="heading" data-slot-kind="text" data-slot-box="64 54 1152 46" data-slot-font="head" data-slot-weight="700" data-slot-size="34" data-slot-maxlines="1" data-slot-maxchars="56" data-slot-anchor="start" data-slot-fill="var(--text,#0b1f33)">
    <text x="64" y="93.1" text-anchor="start" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:34px;font-weight:700;fill:var(--text,#0b1f33)">Four stages from sample to result</text>
  </g>
  <line x1="64" y1="118" x2="1216" y2="118" style="fill:none;stroke:var(--border-bright,#c3ccd7);stroke-width:1"/>
