<!--
design-pack · svg-slides · boardroom · content-two-col
  Data + insight slide: eyebrow, a one-line serif action title over a thin
  grey rule, tracker top right; the graphic fills the left 60% with a source
  line under it, the body text and a navy "so what" box take the right 40%.
  Slots: eyebrow (text, optional, 1 × 56 ch) · heading (text, 1 × 56 ch) ·
  figure (graphic) · caption (text, optional, 2 × 90 ch) · body (text, 6 × 44
  ch) · callout (text, optional, 2 × 38 ch).
  Tokens: surface border-bright block accent font-sans text font-head teal
  amber coral text-muted border on-block.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Chart and insight slide: a one-line serif action title over a thin rule with the agenda tracker, the graphic on the left sixty percent with a source line, and body text plus a navy so-what box on the right" style="width:100%;height:auto">
  <title>Boardroom chart + insight design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#ffffff)"/>
