<!--
design-pack · svg-slides · boardroom · big-statement
  Takeaway slide: an accent bar runs beside a three-line serif statement in
  navy, the tracked eyebrow above, a thin rule and a source-style attribution
  below; quiet grey corner ticks frame the block.
  Slots: eyebrow (text, optional, 1 × 48 ch) · statement (text, 3 × 45 ch) ·
  attribution (text, optional, 1 × 70 ch).
  Tokens: surface accent font-sans text font-head border-bright text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Statement slide: an accent bar beside a three-line serif takeaway in navy, an eyebrow above and a source-style attribution below a thin rule" style="width:100%;height:auto">
  <title>Boardroom statement slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#ffffff)"/>
  <rect x="120" y="214" width="6" height="150" style="fill:var(--accent,#2f6bff)"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="160 172 960 20" data-slot-font="sans" data-slot-weight="700" data-slot-size="14" data-slot-tracking="2" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="start" data-slot-fill="var(--accent,#2f6bff)" data-slot-optional="true">
    <text x="160" y="188.1" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:14px;font-weight:700;fill:var(--accent,#2f6bff);letter-spacing:2px">WHAT WE LEARNED</text>
  </g>
  <g data-slot="statement" data-slot-kind="text" data-slot-box="160 210 960 160" data-slot-font="head" data-slot-weight="700" data-slot-size="38" data-slot-maxlines="3" data-slot-maxchars="45" data-slot-anchor="start" data-slot-fill="var(--text,#0b1f33)">
    <text x="160" y="253.7" text-anchor="start" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:38px;font-weight:700;fill:var(--text,#0b1f33)">Most failed runs were not chemistry.</text>
    <text x="160" y="301.2" text-anchor="start" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:38px;font-weight:700;fill:var(--text,#0b1f33)">They were bubbles in the inlet channel,</text>
    <text x="160" y="348.7" text-anchor="start" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:38px;font-weight:700;fill:var(--text,#0b1f33)">and a 2 mm fillet fixed nine in ten.</text>
  </g>
  <line x1="160" y1="404" x2="1120" y2="404" style="fill:none;stroke:var(--border-bright,#c3ccd7);stroke-width:1"/>
