    <text x="160" y="440.7" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:18px;font-weight:400;fill:var(--text-muted,#5b6b7c)">Run log review, 212 chips, July to September 2026</text>
