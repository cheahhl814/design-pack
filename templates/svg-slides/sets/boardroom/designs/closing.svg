<!--
html-template-pack · svg-slides · boardroom · closing
  Closing slide: full navy field, accent rule, a two-line serif title, up to
  three sans contact lines, a thin rule above the meta line and the cover's
  rising-bar motif on the right.
  Slots: title (text, 2 × 20 ch) · contact (text, 3 × 60 ch) · meta (text,
  optional, 1 × 80 ch).
  Tokens: block accent on-block font-head font-sans.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Navy closing slide: an accent rule, a two-line serif title, contact lines, a thin rule over the meta line and the rising bar motif" style="width:100%;height:auto">
  <title>Boardroom closing slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--block,#12355b)"/>
  <rect x="96" y="170" width="56" height="4" style="fill:var(--accent,#2f6bff)"/>
  <g data-slot="title" data-slot-kind="text" data-slot-box="96 196 900 164" data-slot-font="head" data-slot-weight="700" data-slot-size="64" data-slot-maxlines="2" data-slot-maxchars="20" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="96" y="269.6" text-anchor="start" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:64px;font-weight:700;fill:var(--on-block,#ffffff)">Thank you</text>
    <text x="96" y="349.6" text-anchor="start" style="font-family:var(--font-head,Georgia, Cambria, Times New Roman, serif);font-size:64px;font-weight:700;fill:var(--on-block,#ffffff)">Questions?</text>
  </g>
  <g data-slot="contact" data-slot-kind="text" data-slot-box="96 400 900 84" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="3" data-slot-maxchars="60" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-block,#ffffff) 72%, var(--block,#12355b))">
    <text x="96" y="425.3" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:22px;font-weight:400;fill:color-mix(in srgb, var(--on-block,#ffffff) 72%, var(--block,#12355b))">A. Researcher, Microfluidics Group</text>
    <text x="96" y="452.8" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:22px;font-weight:400;fill:color-mix(in srgb, var(--on-block,#ffffff) 72%, var(--block,#12355b))">a.researcher@example.org</text>
  </g>
  <line x1="96" y1="596" x2="1184" y2="596" style="fill:none;stroke:color-mix(in srgb, var(--on-block,#ffffff) 30%, var(--block,#12355b));stroke-width:1"/>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="96 616 900 22" data-slot-font="sans" data-slot-weight="400" data-slot-size="15" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-block,#ffffff) 72%, var(--block,#12355b))" data-slot-optional="true">
    <text x="96" y="633.3" text-anchor="start" style="font-family:var(--font-sans,Arial, Helvetica, sans-serif);font-size:15px;font-weight:400;fill:color-mix(in srgb, var(--on-block,#ffffff) 72%, var(--block,#12355b))">Slides, run log and chip CAD: example.org/lab-on-chip</text>
  </g>
  <rect x="1040" y="460" width="22" height="60" style="fill:color-mix(in srgb, var(--on-block,#ffffff) 22%, transparent)"/>
  <rect x="1074" y="424" width="22" height="96" style="fill:color-mix(in srgb, var(--on-block,#ffffff) 22%, transparent)"/>
  <rect x="1108" y="388" width="22" height="132" style="fill:color-mix(in srgb, var(--on-block,#ffffff) 22%, transparent)"/>
  <rect x="1142" y="340" width="22" height="180" style="fill:var(--accent,#2f6bff)"/>
  <line x1="1030" y1="520" x2="1160" y2="520" style="fill:none;stroke:color-mix(in srgb, var(--on-block,#ffffff) 40%, var(--block,#12355b));stroke-width:1.5"/>
</svg>
