<!--
design-pack · svg-slides · terminal · title-hero
  Cover: a faint 6 percent grid and a thin scanline band; one large code-block
  panel with a 3 px accent bar on its left edge holds every text slot flush
  left, the eyebrow led by a $ prompt.
  Slots: eyebrow (text, 1 × 48 ch) · hero-title (text, 2 × 35 ch) · subtitle
  (text, 2 × 72 ch) · meta (text, optional, 1 × 80 ch).
  Tokens: surface grid card border accent deep-blue font-sans text font-head
  text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
