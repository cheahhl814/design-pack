  eyebrow (with a > prompt), two-line title and orientation line on the grid
  to the right.
  Slots: number (text, 1 × 2 ch) · eyebrow (text, optional, 1 × 48 ch) ·
  section-title (text, 2 × 23 ch) · orientation (text, 1 × 48 ch).
  Tokens: surface grid card border accent text font-head deep-blue font-sans
  text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
