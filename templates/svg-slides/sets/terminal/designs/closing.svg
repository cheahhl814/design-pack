<!--
design-pack · svg-slides · terminal · closing
  Closing slide: grid, scanlines and one wide code-block panel holding the
  title, up to three contact lines and the meta line.
  Slots: title (text, 2 × 27 ch) · contact (text, 3 × 60 ch) · meta (text,
  optional, 1 × 80 ch).
  Tokens: surface grid card border accent text font-head font-sans text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
