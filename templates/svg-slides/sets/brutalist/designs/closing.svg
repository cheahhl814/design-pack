<!--
design-pack · svg-slides · brutalist · closing
  Closing slide: hot-pink field; a large white card with a hard shadow holds a
  centred oversized two-line title, a short thick rule, up to three mono
  contact lines and a meta line, all centred; a tilted yellow block and a lime
  disc break out of its edges.
  Slots: title (text, 2 × 20 ch) · contact (text, 3 × 60 ch) · meta (text,
  optional, 1 × 80 ch).
  Tokens: block shadow amber border surface card text font-head ink font-sans
  text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Closing slide on a hot-pink field: a large white bordered card with a hard shadow holds an oversized two-line title, a thick rule, contact lines and a meta line, a tilted yellow block pokes out above and a lime disc below" style="width:100%;height:auto">
  <title>Neo-brutalist closing slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--block,#ff2d55)"/>
  <polygon points="977.9,29.2 1226.5,55.3 1218.1,134.8 969.5,108.7" style="fill:var(--shadow,#000000)"/>
  <polygon points="969.9,21.2 1218.5,47.3 1210.1,126.8 961.5,100.7" style="fill:var(--amber,#f5f500);stroke:var(--border,#000000);stroke-width:3;stroke-linejoin:miter"/>
  <circle cx="1156" cy="646" r="44" style="fill:var(--shadow,#000000)"/>
  <circle cx="1150" cy="640" r="44" style="fill:var(--surface,#ccff00);stroke:var(--border,#000000);stroke-width:3;stroke-linejoin:miter"/>
  <rect x="72" y="102" width="1160" height="500" style="fill:var(--shadow,#000000)"/>
  <rect x="60" y="90" width="1160" height="500" style="fill:var(--card,#ffffff);stroke:var(--border,#000000);stroke-width:4;stroke-linejoin:miter"/>
  <g data-slot="title" data-slot-kind="text" data-slot-box="100 124 1040 184" data-slot-font="head" data-slot-weight="800" data-slot-size="72" data-slot-maxlines="2" data-slot-maxchars="20" data-slot-anchor="middle" data-slot-fill="var(--text,#000000)">
    <text x="620" y="206.8" text-anchor="middle" style="font-family:var(--font-head,Arial Black, Arial, sans-serif);font-size:72px;font-weight:800;fill:var(--text,#000000)">Thank you</text>
    <text x="620" y="296.8" text-anchor="middle" style="font-family:var(--font-head,Arial Black, Arial, sans-serif);font-size:72px;font-weight:800;fill:var(--text,#000000)">Questions?</text>
  </g>
  <rect x="440" y="336" width="400" height="8" style="fill:var(--ink,#000000);stroke:var(--border,#000000);stroke-width:3;stroke-linejoin:miter"/>
  <g data-slot="contact" data-slot-kind="text" data-slot-box="100 372 1040 84" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="3" data-slot-maxchars="60" data-slot-anchor="middle" data-slot-fill="var(--text,#000000)">
    <text x="620" y="397.3" text-anchor="middle" style="font-family:var(--font-sans,Courier New, Courier, monospace);font-size:22px;font-weight:400;fill:var(--text,#000000)">A. Researcher, Microfluidics Group</text>
    <text x="620" y="424.8" text-anchor="middle" style="font-family:var(--font-sans,Courier New, Courier, monospace);font-size:22px;font-weight:400;fill:var(--text,#000000)">a.researcher@example.org</text>
  </g>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="100 520 1040 22" data-slot-font="sans" data-slot-weight="700" data-slot-size="16" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="middle" data-slot-fill="var(--text-muted,#2e2e2e)" data-slot-optional="true">
    <text x="620" y="538.4" text-anchor="middle" style="font-family:var(--font-sans,Courier New, Courier, monospace);font-size:16px;font-weight:700;fill:var(--text-muted,#2e2e2e)">Slides, run log and chip CAD: example.org/lab-on-chip</text>
  </g>
</svg>
