<!--
design-pack · svg-slides · brutalist · section-break
  Section divider: hot-pink field; the chapter number sits oversized on a
  white card with a hard shadow; on the right the mono eyebrow, a two-line
  Arial Black title and an orientation line, all centred in the column around
  a short thick black bar, a tilted yellow block below.
  Slots: number (text, 1 × 2 ch) · eyebrow (text, optional, 1 × 44 ch) ·
  section-title (text, 2 × 18 ch) · orientation (text, 1 × 52 ch).
  Tokens: block shadow card border text font-head on-block font-sans ink
  amber.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Section divider on a hot-pink field: an oversized chapter numeral on a white bordered card with a hard shadow on the left, and the eyebrow, a two-line title and an orientation line on the right" style="width:100%;height:auto">
