  <g data-slot="section-title" data-slot-kind="text" data-slot-box="580 232 640 130" data-slot-font="head" data-slot-weight="800" data-slot-size="48" data-slot-maxlines="2" data-slot-maxchars="18" data-slot-anchor="middle" data-slot-fill="var(--on-block,#000000)">
