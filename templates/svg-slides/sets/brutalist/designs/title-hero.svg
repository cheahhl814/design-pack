<!--
design-pack · svg-slides · brutalist · title-hero
  Cover: acid field; a white card with a 4 px border and a hard offset shadow
  holds every text slot flush left; a tilted pink block, a yellow disc and a
  black bar break out of its right and bottom edges.
  Slots: eyebrow (text, 1 × 48 ch) · hero-title (text, 2 × 26 ch) · subtitle
  (text, 2 × 72 ch) · meta (text, optional, 1 × 80 ch).
  Tokens: surface shadow block border amber card ink text font-sans font-head
  text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cover slide on an acid field: a thick-bordered white card with a hard black shadow holds a mono eyebrow, a two-line oversized title, a subtitle and a meta line, with a tilted pink block, a yellow disc and a black bar around it" style="width:100%;height:auto">
  <title>Neo-brutalist cover slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#ccff00)"/>
  <polygon points="1031,41.6 1269.2,70.9 1229,398.4 990.8,369.1" style="fill:var(--shadow,#000000)"/>
  <polygon points="1021,31.6 1259.2,60.9 1219,388.4 980.8,359.1" style="fill:var(--block,#ff2d55);stroke:var(--border,#000000);stroke-width:3;stroke-linejoin:miter"/>
  <circle cx="1176" cy="556" r="56" style="fill:var(--shadow,#000000)"/>
  <circle cx="1168" cy="548" r="56" style="fill:var(--amber,#f5f500);stroke:var(--border,#000000);stroke-width:3;stroke-linejoin:miter"/>
  <rect x="68" y="84" width="1060" height="560" style="fill:var(--shadow,#000000)"/>
  <rect x="56" y="72" width="1060" height="560" style="fill:var(--card,#ffffff);stroke:var(--border,#000000);stroke-width:4;stroke-linejoin:miter"/>
  <rect x="100" y="108" width="140" height="14" style="fill:var(--ink,#000000);stroke:var(--border,#000000);stroke-width:3;stroke-linejoin:miter"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="100 140 600 22" data-slot-font="sans" data-slot-weight="700" data-slot-size="16" data-slot-tracking="1" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="start" data-slot-fill="var(--text,#000000)">
    <text x="100" y="158.4" text-anchor="start" style="font-family:var(--font-sans,Courier New, Courier, monospace);font-size:16px;font-weight:700;fill:var(--text,#000000);letter-spacing:1px">LAB MEETING · OCTOBER 2026</text>
  </g>
  <g data-slot="hero-title" data-slot-kind="text" data-slot-box="100 196 960 140" data-slot-font="head" data-slot-weight="800" data-slot-size="52" data-slot-maxlines="2" data-slot-maxchars="26" data-slot-anchor="middle" data-slot-fill="var(--text,#000000)">
    <text x="580" y="255.8" text-anchor="middle" style="font-family:var(--font-head,Arial Black, Arial, sans-serif);font-size:52px;font-weight:800;fill:var(--text,#000000)">Lab-on-chip diagnostics</text>
    <text x="580" y="320.8" text-anchor="middle" style="font-family:var(--font-head,Arial Black, Arial, sans-serif);font-size:52px;font-weight:800;fill:var(--text,#000000)">from sample to answer</text>
  </g>
  <g data-slot="subtitle" data-slot-kind="text" data-slot-box="100 380 960 52" data-slot-font="sans" data-slot-weight="400" data-slot-size="20" data-slot-maxlines="2" data-slot-maxchars="72" data-slot-anchor="start" data-slot-fill="var(--text,#000000)">
    <text x="100" y="403" text-anchor="start" style="font-family:var(--font-sans,Courier New, Courier, monospace);font-size:20px;font-weight:400;fill:var(--text,#000000)">What we built this quarter, what broke, and what we</text>
    <text x="100" y="428" text-anchor="start" style="font-family:var(--font-sans,Courier New, Courier, monospace);font-size:20px;font-weight:400;fill:var(--text,#000000)">need from the group before the January field trial</text>
  </g>
  <rect x="100" y="500" width="960" height="6" style="fill:var(--ink,#000000);stroke:var(--border,#000000);stroke-width:3;stroke-linejoin:miter"/>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="100 548 960 22" data-slot-font="sans" data-slot-weight="700" data-slot-size="16" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="start" data-slot-fill="var(--text-muted,#2e2e2e)" data-slot-optional="true">
    <text x="100" y="566.4" text-anchor="start" style="font-family:var(--font-sans,Courier New, Courier, monospace);font-size:16px;font-weight:700;fill:var(--text-muted,#2e2e2e)">A. Researcher · Microfluidics Group · 14 October 2026</text>
