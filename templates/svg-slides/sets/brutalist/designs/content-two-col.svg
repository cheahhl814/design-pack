<!--
design-pack · svg-slides · brutalist · content-two-col
  Content slide: acid field; mono eyebrow and an Arial Black heading over a
  thick black bar with a pink tab; a white body card and a pink key-point card
  with hard shadows on the left; a white graphic card with a hard shadow and
  caption on the right.
  Slots: eyebrow (text, optional, 1 × 56 ch) · heading (text, 1 × 44 ch) ·
  body (text, 6 × 48 ch) · callout (text, optional, 2 × 48 ch) · figure
  (graphic) · caption (text, optional, 2 × 64 ch).
  Tokens: surface text font-sans font-head ink border block shadow card
  on-block teal border-bright amber coral text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Content slide on an acid field: a heavy heading over a thick bar, a white body card and a pink key-point card on the left, a bordered white graphic card with a hard shadow and a caption on the right" style="width:100%;height:auto">
