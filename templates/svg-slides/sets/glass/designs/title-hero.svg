<!--
design-pack · svg-slides · glass · title-hero
  Cover: deep field with stacked-circle glow blobs; one frosted card
  (translucent fill, light border, 22 px corners) holds all the text flush
  left.
  Slots: eyebrow (text, 1 × 48 ch) · hero-title (text, 2 × 27 ch) · subtitle
  (text, 2 × 72 ch) · meta (text, optional, 1 × 80 ch).
  Tokens: surface blob-a blob-b blob-c glass glass-line accent font-sans text
  font-head text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
