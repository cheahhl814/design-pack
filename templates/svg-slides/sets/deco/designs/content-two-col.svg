<!--
design-pack · svg-slides · deco · content-two-col
  Content slide: double rule under the heading; the graphic in a double-ruled
  gold plate; a gold bar beside the key point.
  Slots: eyebrow (text, optional, 1 × 46 ch) · heading (text, 1 × 46 ch) ·
  body (text, 6 × 46 ch) · callout (text, optional, 2 × 48 ch) · figure
  (graphic) · caption (text, optional, 2 × 70 ch).
  Tokens: surface gold gold-deep font-sans text font-head teal border-bright
  amber coral text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
