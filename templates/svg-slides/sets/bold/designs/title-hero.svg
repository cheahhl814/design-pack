<!--
html-template-pack · svg-slides · bold · title-hero
  Cover: a full violet field; flat polygons (amber triangle, coral circle,
  blue diamond, green dot) on the right; on the left an amber eyebrow, a heavy
  two-line title, a subtitle and a meta line.
  Slots: eyebrow (text, 1 × 48 ch) · hero-title (text, 2 × 24 ch) · subtitle
  (text, 2 × 72 ch) · meta (text, optional, 1 × 80 ch).
  Tokens: block amber coral deep-blue green font-sans on-block font-head.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Violet cover slide with an amber triangle, a coral circle, a blue diamond and a green dot on the right, and the eyebrow, a heavy two-line title, a subtitle and a meta line on the left" style="width:100%;height:auto">
  <title>Bold geometric cover slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--block,#5b2eff)"/>
  <polygon points="1280,720 1280,300 880,720" style="fill:var(--amber,#ffc21a)"/>
  <circle cx="1120" cy="170" r="90" style="fill:var(--coral,#ff4f64)"/>
  <polygon points="1010,300 1080,370 1010,440 940,370" style="fill:var(--deep-blue,#1f6bff)"/>
  <circle cx="1210" cy="420" r="22" style="fill:var(--green,#00c48c)"/>
  <rect x="80" y="140" width="64" height="10" style="fill:var(--amber,#ffc21a)"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="80 170 760 20" data-slot-font="sans" data-slot-weight="700" data-slot-size="15" data-slot-tracking="2" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="start" data-slot-fill="var(--amber,#ffc21a)">
    <text x="80" y="187.3" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:15px;font-weight:700;fill:var(--amber,#ffc21a);letter-spacing:2px">LAB MEETING · OCTOBER 2026</text>
  </g>
  <g data-slot="hero-title" data-slot-kind="text" data-slot-box="80 226 860 150" data-slot-font="head" data-slot-weight="800" data-slot-size="54" data-slot-maxlines="2" data-slot-maxchars="24" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="80" y="288.1" text-anchor="start" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:54px;font-weight:800;fill:var(--on-block,#ffffff)">Lab-on-chip diagnostics</text>
    <text x="80" y="355.6" text-anchor="start" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:54px;font-weight:800;fill:var(--on-block,#ffffff)">from sample to answer</text>
  </g>
  <g data-slot="subtitle" data-slot-kind="text" data-slot-box="80 410 820 60" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="2" data-slot-maxchars="72" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-block,#ffffff) 80%, var(--block,#5b2eff))">
    <text x="80" y="435.3" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:color-mix(in srgb, var(--on-block,#ffffff) 80%, var(--block,#5b2eff))">What we built this quarter, what broke, and what we</text>
    <text x="80" y="462.8" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:color-mix(in srgb, var(--on-block,#ffffff) 80%, var(--block,#5b2eff))">need from the group before the January field trial</text>
  </g>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="80 620 800 22" data-slot-font="sans" data-slot-weight="700" data-slot-size="16" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)" data-slot-optional="true">
    <text x="80" y="638.4" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:16px;font-weight:700;fill:var(--on-block,#ffffff)">A. Researcher · Microfluidics Group · 14 October 2026</text>
  </g>
</svg>
