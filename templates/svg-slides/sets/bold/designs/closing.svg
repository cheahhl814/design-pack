<!--
design-pack · svg-slides · bold · closing
  Closing slide: the cover's violet field and flat polygons, a heavy two-line
  title, an amber bar, up to three contact lines and a meta line on the left.
  Slots: title (text, 2 × 18 ch) · contact (text, 3 × 60 ch) · meta (text,
  optional, 1 × 80 ch).
  Tokens: block amber coral deep-blue green on-block font-head font-sans.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Violet closing slide with the cover shapes on the right and a heavy two-line title, contact lines and a meta line on the left" style="width:100%;height:auto">
  <title>Bold geometric closing slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--block,#5b2eff)"/>
  <polygon points="1280,720 1280,300 880,720" style="fill:var(--amber,#ffc21a)"/>
  <circle cx="1120" cy="170" r="90" style="fill:var(--coral,#ff4f64)"/>
  <polygon points="1010,300 1080,370 1010,440 940,370" style="fill:var(--deep-blue,#1f6bff)"/>
  <circle cx="1210" cy="420" r="22" style="fill:var(--green,#00c48c)"/>
  <g data-slot="title" data-slot-kind="text" data-slot-box="80 170 820 180" data-slot-font="head" data-slot-weight="800" data-slot-size="70" data-slot-maxlines="2" data-slot-maxchars="18" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="80" y="250.5" text-anchor="start" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:70px;font-weight:800;fill:var(--on-block,#ffffff)">Thank you</text>
    <text x="80" y="338" text-anchor="start" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:70px;font-weight:800;fill:var(--on-block,#ffffff)">Questions?</text>
  </g>
  <rect x="80" y="376" width="120" height="10" style="fill:var(--amber,#ffc21a)"/>
  <g data-slot="contact" data-slot-kind="text" data-slot-box="80 410 800 84" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="3" data-slot-maxchars="60" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="80" y="435.3" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:var(--on-block,#ffffff)">A. Researcher, Microfluidics Group</text>
    <text x="80" y="462.8" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:var(--on-block,#ffffff)">a.researcher@example.org</text>
  </g>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="80 610 800 22" data-slot-font="sans" data-slot-weight="700" data-slot-size="16" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-block,#ffffff) 80%, var(--block,#5b2eff))" data-slot-optional="true">
    <text x="80" y="628.4" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:16px;font-weight:700;fill:color-mix(in srgb, var(--on-block,#ffffff) 80%, var(--block,#5b2eff))">Slides, run log and chip CAD: example.org/lab-on-chip</text>
  </g>
</svg>
