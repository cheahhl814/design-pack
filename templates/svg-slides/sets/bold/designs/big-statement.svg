-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Statement slide: a heavy centred three-line takeaway in violet framed by a coral circle top left, an amber triangle bottom right, a blue square and a green dot" style="width:100%;height:auto">
