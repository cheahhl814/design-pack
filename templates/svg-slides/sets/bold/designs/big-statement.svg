  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="140 168 1000 20" data-slot-font="sans" data-slot-weight="700" data-slot-size="14" data-slot-tracking="2" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="middle" data-slot-fill="var(--text-muted,#5f5b78)" data-slot-optional="true">
