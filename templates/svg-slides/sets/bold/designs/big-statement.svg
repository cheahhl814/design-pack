    <text x="640" y="253.7" text-anchor="middle" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:38px;font-weight:800;fill:var(--accent,#5b2eff)">Most failed runs were not chemistry.</text>
    <text x="640" y="301.2" text-anchor="middle" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:38px;font-weight:800;fill:var(--accent,#5b2eff)">They were bubbles in the inlet channel,</text>
