  accent with the eyebrow above and attribution below, framed by a coral
  circle top left, an amber triangle bottom right, a blue square and a green
  dot.
  Slots: eyebrow (text, optional, 1 × 48 ch) · statement (text, 3 × 40 ch) ·
  attribution (text, optional, 1 × 70 ch).
  Tokens: surface coral amber deep-blue green text-muted font-sans accent
