<!--
design-pack · svg-slides · bold · section-break
  Section divider: a violet block over the left 40% holds a huge white chapter
  number, with an amber triangle in its corner; on white, the eyebrow, a heavy
  two-line section title and an orientation line, a coral dot and blue bar as
  accents.
  Slots: number (text, 1 × 2 ch) · eyebrow (text, optional, 1 × 44 ch) ·
  section-title (text, 2 × 20 ch) · orientation (text, 1 × 56 ch).
  Tokens: surface block amber on-block font-head coral deep-blue green
  font-sans text text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Section divider: a violet left block holding a huge chapter number with an amber corner triangle, and on white a heavy two-line section title between coral and blue shapes" style="width:100%;height:auto">
  <title>Bold geometric section divider design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#ffffff)"/>
  <rect x="0" y="0" width="520" height="720" style="fill:var(--block,#5b2eff)"/>
  <polygon points="0,720 0,520 200,720" style="fill:var(--amber,#ffc21a)"/>
  <g data-slot="number" data-slot-kind="text" data-slot-box="80 180 400 320" data-slot-font="head" data-slot-weight="800" data-slot-size="250" data-slot-maxlines="1" data-slot-maxchars="2" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="80" y="467.5" text-anchor="start" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:250px;font-weight:800;fill:var(--on-block,#ffffff)">02</text>
  </g>
  <circle cx="1180" cy="120" r="36" style="fill:var(--coral,#ff4f64)"/>
  <rect x="580" y="560" width="200" height="16" style="fill:var(--deep-blue,#1f6bff)"/>
  <rect x="796" y="560" width="40" height="16" style="fill:var(--green,#00c48c)"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="580 230 640 20" data-slot-font="sans" data-slot-weight="700" data-slot-size="14" data-slot-tracking="2" data-slot-maxlines="1" data-slot-maxchars="44" data-slot-anchor="start" data-slot-fill="var(--block,#5b2eff)" data-slot-optional="true">
    <text x="580" y="246.1" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:14px;font-weight:700;fill:var(--block,#5b2eff);letter-spacing:2px">PART TWO</text>
  </g>
  <g data-slot="section-title" data-slot-kind="text" data-slot-box="580 270 640 130" data-slot-font="head" data-slot-weight="800" data-slot-size="46" data-slot-maxlines="2" data-slot-maxchars="20" data-slot-anchor="start" data-slot-fill="var(--text,#15122b)">
    <text x="580" y="322.9" text-anchor="start" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:46px;font-weight:800;fill:var(--text,#15122b)">How the assay</text>
    <text x="580" y="380.4" text-anchor="start" style="font-family:var(--font-head,Arial Black, Arial, Helvetica, sans-serif);font-size:46px;font-weight:800;fill:var(--text,#15122b)">actually works</text>
  </g>
  <g data-slot="orientation" data-slot-kind="text" data-slot-box="580 430 640 30" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="1" data-slot-maxchars="56" data-slot-anchor="start" data-slot-fill="var(--text-muted,#5f5b78)">
    <text x="580" y="455.3" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:var(--text-muted,#5f5b78)">Sample prep, amplification and the readout</text>
