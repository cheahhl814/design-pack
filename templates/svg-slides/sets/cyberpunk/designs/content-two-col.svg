<!--
design-pack · svg-slides · cyberpunk · content-two-col
  Content slide: outline heading; body text, the key point and the graphic
  each in a chamfered cyan panel; corner brackets and a magenta tag.
  Slots: eyebrow (text, optional, 1 × 48 ch) · heading (text, 1 × 46 ch) ·
  body (text, 6 × 46 ch) · callout (text, optional, 2 × 48 ch) · figure
  (graphic) · caption (text, optional, 2 × 68 ch).
  Tokens: surface grid teal mag font-sans font-head text border-bright amber
  coral text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
