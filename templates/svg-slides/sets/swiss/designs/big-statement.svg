<!--
html-template-pack · svg-slides · swiss · big-statement
  Takeaway slide in reversed type: a solid ink field (black, a lifted charcoal
  in dark), a red square marks the eyebrow, three flush-left lines of
  statement, the attribution under a thin rule.
  Slots: eyebrow (text, optional, 1 × 48 ch) · statement (text, 3 × 46 ch) ·
  attribution (text, optional, 1 × 70 ch).
  Tokens: ink block on-ink font-head font-sans.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Statement slide in reversed type: a three-line takeaway set flush left on a solid black field, a red square marker and an attribution line" style="width:100%;height:auto">
  <title>Swiss statement slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--ink,#111111)"/>
  <rect x="80" y="130" width="40" height="40" style="fill:var(--block,#e30613)"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="140 140 900 20" data-slot-font="head" data-slot-weight="700" data-slot-size="14" data-slot-tracking="1.5" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-ink,#ffffff) 70%, var(--ink,#111111))" data-slot-optional="true">
    <text x="140" y="156.1" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:14px;font-weight:700;fill:color-mix(in srgb, var(--on-ink,#ffffff) 70%, var(--ink,#111111));letter-spacing:1.5px">WHAT WE LEARNED</text>
  </g>
  <g data-slot="statement" data-slot-kind="text" data-slot-box="80 210 1120 170" data-slot-font="head" data-slot-weight="700" data-slot-size="44" data-slot-maxlines="3" data-slot-maxchars="46" data-slot-anchor="start" data-slot-fill="var(--on-ink,#ffffff)">
    <text x="80" y="260.6" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:44px;font-weight:700;fill:var(--on-ink,#ffffff)">Most failed runs were not chemistry.</text>
    <text x="80" y="315.6" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:44px;font-weight:700;fill:var(--on-ink,#ffffff)">They were bubbles in the inlet channel,</text>
    <text x="80" y="370.6" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:44px;font-weight:700;fill:var(--on-ink,#ffffff)">and a 2 mm fillet fixed nine in ten.</text>
  </g>
  <line x1="80" y1="430" x2="400" y2="430" style="fill:none;stroke:var(--block,#e30613);stroke-width:4"/>
  <g data-slot="attribution" data-slot-kind="text" data-slot-box="80 450 1120 26" data-slot-font="sans" data-slot-weight="400" data-slot-size="18" data-slot-maxlines="1" data-slot-maxchars="70" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-ink,#ffffff) 70%, var(--ink,#111111))" data-slot-optional="true">
    <text x="80" y="470.7" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:18px;font-weight:400;fill:color-mix(in srgb, var(--on-ink,#ffffff) 70%, var(--ink,#111111))">Run log review, 212 chips, July to September 2026</text>
  </g>
</svg>
