<!--
design-pack · svg-slides · swiss · title-hero
  Cover (1280x720): a red colour block over the left 70% holds every text slot
  flush left on the grid; the white right column carries stacked black
  typographic bars and a red square.
  Slots: eyebrow (text, 1 × 48 ch) · hero-title (text, 2 × 26 ch) · subtitle
  (text, 2 × 64 ch) · meta (text, optional, 1 × 80 ch).
  Tokens: surface block on-block font-head font-sans text border-bright
  border.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Cover slide with a red colour block holding the eyebrow, a two-line title, a subtitle and a meta line, and a white grid column with stacked black bars on the right" style="width:100%;height:auto">
  <title>Swiss cover slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#ffffff)"/>
  <rect x="0" y="0" width="900" height="720" style="fill:var(--block,#e30613)"/>
  <rect x="80" y="64" width="48" height="8" style="fill:var(--on-block,#ffffff)"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="80 96 760 20" data-slot-font="head" data-slot-weight="700" data-slot-size="14" data-slot-tracking="1.5" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="80" y="112.1" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:14px;font-weight:700;fill:var(--on-block,#ffffff);letter-spacing:1.5px">LAB MEETING · OCTOBER 2026</text>
  </g>
  <g data-slot="hero-title" data-slot-kind="text" data-slot-box="80 270 780 140" data-slot-font="head" data-slot-weight="700" data-slot-size="54" data-slot-maxlines="2" data-slot-maxchars="26" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="80" y="332.1" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:54px;font-weight:700;fill:var(--on-block,#ffffff)">Lab-on-chip diagnostics</text>
    <text x="80" y="399.6" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:54px;font-weight:700;fill:var(--on-block,#ffffff)">from sample to answer</text>
  </g>
  <g data-slot="subtitle" data-slot-kind="text" data-slot-box="80 440 760 60" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="2" data-slot-maxchars="64" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-block,#ffffff) 78%, var(--block,#e30613))">
    <text x="80" y="465.3" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:color-mix(in srgb, var(--on-block,#ffffff) 78%, var(--block,#e30613))">What we built this quarter, what broke, and what we</text>
    <text x="80" y="492.8" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:color-mix(in srgb, var(--on-block,#ffffff) 78%, var(--block,#e30613))">need from the group before the January field trial</text>
  </g>
  <line x1="80" y1="600" x2="860" y2="600" style="fill:none;stroke:color-mix(in srgb, var(--on-block,#ffffff) 45%, var(--block,#e30613));stroke-width:1.5"/>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="80 620 780 22" data-slot-font="head" data-slot-weight="500" data-slot-size="16" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)" data-slot-optional="true">
    <text x="80" y="638.4" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:16px;font-weight:500;fill:var(--on-block,#ffffff)">A. Researcher · Microfluidics Group · 14 October 2026</text>
  </g>
  <rect x="960" y="120" width="240" height="14" style="fill:var(--text,#111111)"/>
  <rect x="960" y="160" width="180" height="14" style="fill:var(--text,#111111)"/>
  <rect x="960" y="200" width="220" height="14" style="fill:var(--text,#111111)"/>
  <rect x="960" y="240" width="120" height="14" style="fill:var(--text,#111111)"/>
  <rect x="960" y="560" width="56" height="56" style="fill:var(--block,#e30613)"/>
  <line x1="940" y1="0" x2="940" y2="720" style="fill:none;stroke:var(--border-bright,#c4c4c4);stroke-width:1"/>
  <line x1="1220" y1="0" x2="1220" y2="720" style="fill:none;stroke:var(--border,#e6e6e6);stroke-width:1"/>
</svg>
