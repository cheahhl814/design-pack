<!--
design-pack · svg-slides · swiss · closing
  Closing slide: the red colour block fills the slide; an oversized two-line
  title, a thin white rule, up to three contact lines and a meta line, all
  flush left; a black bar anchors the bottom right.
  Slots: title (text, 2 × 20 ch) · contact (text, 3 × 60 ch) · meta (text,
  optional, 1 × 80 ch).
  Tokens: block on-block font-head font-sans text.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Closing slide on a red colour block: an oversized two-line title, a thin rule, contact lines and a meta line, with a black bar in the corner" style="width:100%;height:auto">
  <title>Swiss closing slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--block,#e30613)"/>
  <g data-slot="title" data-slot-kind="text" data-slot-box="80 170 1120 184" data-slot-font="head" data-slot-weight="700" data-slot-size="72" data-slot-maxlines="2" data-slot-maxchars="20" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="80" y="252.8" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:72px;font-weight:700;fill:var(--on-block,#ffffff)">Thank you</text>
    <text x="80" y="342.8" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:72px;font-weight:700;fill:var(--on-block,#ffffff)">Questions?</text>
  </g>
  <line x1="80" y1="390" x2="1200" y2="390" style="fill:none;stroke:color-mix(in srgb, var(--on-block,#ffffff) 50%, var(--block,#e30613));stroke-width:1.5"/>
  <g data-slot="contact" data-slot-kind="text" data-slot-box="80 420 800 84" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="3" data-slot-maxchars="60" data-slot-anchor="start" data-slot-fill="var(--on-block,#ffffff)">
    <text x="80" y="445.3" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:var(--on-block,#ffffff)">A. Researcher, Microfluidics Group</text>
    <text x="80" y="472.8" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:var(--on-block,#ffffff)">a.researcher@example.org</text>
  </g>
  <g data-slot="meta" data-slot-kind="text" data-slot-box="80 600 900 22" data-slot-font="head" data-slot-weight="500" data-slot-size="16" data-slot-maxlines="1" data-slot-maxchars="80" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--on-block,#ffffff) 78%, var(--block,#e30613))" data-slot-optional="true">
    <text x="80" y="618.4" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:16px;font-weight:500;fill:color-mix(in srgb, var(--on-block,#ffffff) 78%, var(--block,#e30613))">Slides, run log and chip CAD: example.org/lab-on-chip</text>
  </g>
  <rect x="1040" y="600" width="160" height="24" style="fill:var(--text,#111111)"/>
</svg>
