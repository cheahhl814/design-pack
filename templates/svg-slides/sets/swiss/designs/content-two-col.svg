<!--
html-template-pack · svg-slides · swiss · content-two-col
  Content slide on the 12-column grid: eyebrow and heading over a heavy black
  rule with a red tab, body text and a red-ruled key point in the left six
  columns, a hairline-framed graphic and caption in the right six.
  Slots: eyebrow (text, optional, 1 × 56 ch) · heading (text, 1 × 48 ch) ·
  body (text, 6 × 46 ch) · callout (text, optional, 2 × 48 ch) · figure
  (graphic) · caption (text, optional, 2 × 70 ch).
  Tokens: surface block font-head text font-sans border-bright teal amber
  coral text-muted.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Two-column content slide on a grid: heading over a heavy rule, body text and a red-ruled callout in the left six columns, a hairline-framed graphic and caption in the right six" style="width:100%;height:auto">
