  <g data-slot="body" data-slot-kind="text" data-slot-box="80 180 560 190" data-slot-font="sans" data-slot-weight="400" data-slot-size="24" data-slot-maxlines="6" data-slot-maxchars="46" data-slot-anchor="start" data-slot-fill="var(--text,#111111)">
