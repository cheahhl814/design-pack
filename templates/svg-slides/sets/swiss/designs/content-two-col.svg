    <text x="950" y="408" text-anchor="middle" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:12px;fill:var(--text-muted,#5e5e5e)">place an svg-library component here (800 × 450)</text>
