<!--
html-template-pack · svg-slides · swiss · full-diagram
  Figure slide: eyebrow and heading over a heavy black rule, a large graphic
  slot across nine columns, and a red colour-block column on the right holding
  the takeaway in white.
  Slots: eyebrow (text, optional, 1 × 48 ch) · heading (text, 1 × 56 ch) ·
  figure (graphic) · takeaway (text, optional, 6 × 24 ch).
  Tokens: surface block font-head text teal border-bright amber coral
  text-muted font-sans on-block.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
