<!--
design-pack · svg-slides · swiss · section-break
  Section divider: a heavy black rule across the top margin, an oversized red
  chapter number in the left four columns, eyebrow, title and orientation line
  from column six, a thin rule closing the block.
  Slots: number (text, 1 × 2 ch) · eyebrow (text, optional, 1 × 44 ch) ·
  section-title (text, 2 × 22 ch) · orientation (text, 1 × 56 ch).
  Tokens: surface text block font-head text-muted font-sans.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Section divider with a heavy black rule, an oversized red chapter number on the left and the section title and orientation line on the right grid column" style="width:100%;height:auto">
  <title>Swiss section divider design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#ffffff)"/>
  <rect x="80" y="96" width="1120" height="10" style="fill:var(--text,#111111)"/>
  <g data-slot="number" data-slot-kind="text" data-slot-box="80 170 420 320" data-slot-font="head" data-slot-weight="700" data-slot-size="260" data-slot-maxlines="1" data-slot-maxchars="2" data-slot-anchor="start" data-slot-fill="var(--block,#e30613)">
    <text x="80" y="469" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:260px;font-weight:700;fill:var(--block,#e30613)">02</text>
  </g>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="560 250 640 20" data-slot-font="head" data-slot-weight="700" data-slot-size="14" data-slot-tracking="1.5" data-slot-maxlines="1" data-slot-maxchars="44" data-slot-anchor="start" data-slot-fill="var(--text-muted,#5e5e5e)" data-slot-optional="true">
    <text x="560" y="266.1" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:14px;font-weight:700;fill:var(--text-muted,#5e5e5e);letter-spacing:1.5px">PART TWO</text>
  </g>
  <g data-slot="section-title" data-slot-kind="text" data-slot-box="560 290 640 130" data-slot-font="head" data-slot-weight="700" data-slot-size="50" data-slot-maxlines="2" data-slot-maxchars="22" data-slot-anchor="start" data-slot-fill="var(--text,#111111)">
    <text x="560" y="347.5" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:50px;font-weight:700;fill:var(--text,#111111)">How the assay</text>
    <text x="560" y="410" text-anchor="start" style="font-family:var(--font-head,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:50px;font-weight:700;fill:var(--text,#111111)">actually works</text>
  </g>
  <g data-slot="orientation" data-slot-kind="text" data-slot-box="560 450 640 30" data-slot-font="sans" data-slot-weight="400" data-slot-size="22" data-slot-maxlines="1" data-slot-maxchars="56" data-slot-anchor="start" data-slot-fill="var(--text-muted,#5e5e5e)">
    <text x="560" y="475.3" text-anchor="start" style="font-family:var(--font-sans,Helvetica Neue, Helvetica, Arial, sans-serif);font-size:22px;font-weight:400;fill:var(--text-muted,#5e5e5e)">Sample prep, amplification and the readout</text>
  </g>
  <line x1="560" y1="520" x2="1200" y2="520" style="fill:none;stroke:var(--text,#111111);stroke-width:2"/>
  <rect x="1160" y="600" width="40" height="40" style="fill:var(--block,#e30613)"/>
</svg>
