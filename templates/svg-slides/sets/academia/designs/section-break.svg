  <g data-slot="number" data-slot-kind="text" data-slot-box="140 80 1000 180" data-slot-font="head" data-slot-weight="700" data-slot-size="170" data-slot-maxlines="1" data-slot-maxchars="2" data-slot-anchor="middle" data-slot-fill="var(--accent,#8f6b1d);font-style:italic">
