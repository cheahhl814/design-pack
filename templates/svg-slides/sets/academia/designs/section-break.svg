<!--
design-pack · svg-slides · academia · section-break
  Section divider: double gold frame; the chapter number, centred and
  oversized in italic gold, over a short diamond rule, then the eyebrow, a
  two-line italic title and the orientation line.
  Slots: number (text, 1 × 2 ch) · eyebrow (text, optional, 1 × 48 ch) ·
  section-title (text, 2 × 26 ch) · orientation (text, 1 × 56 ch).
  Tokens: surface accent border-bright font-head text-muted font-sans.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Section divider inside a double inset frame: a large italic gold chapter number centred over a short diamond rule, the tracked eyebrow, a centred italic title and an orientation line" style="width:100%;height:auto">
  <title>Dark Academia section divider design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#f1e7d2)"/>
