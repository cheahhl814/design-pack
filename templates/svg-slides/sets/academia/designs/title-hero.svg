<!--
design-pack · svg-slides · academia · title-hero
  Cover: warm dark field in a double inset gold frame (heavy outer, hairline
  inner, corner studs); a diamond rule above the centred eyebrow and below the
  meta line; the title is italic gold Georgia with wide tracking.
  Slots: eyebrow (text, 1 × 48 ch) · hero-title (text, 2 × 24 ch) · subtitle
  (text, 2 × 72 ch) · meta (text, optional, 1 × 80 ch).
  Tokens: surface accent border-bright text-muted font-sans font-head.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
