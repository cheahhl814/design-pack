<!--
design-pack · svg-slides · academia · content-two-col
  Content slide: gold frame; heading over a hairline rule; body text with a
  gold-barred key point on the left; the graphic sits in a double-ruled plate
  with a Courier footnote caption.
  Slots: eyebrow (text, optional, 1 × 48 ch) · heading (text, 1 × 46 ch) ·
  body (text, 6 × 46 ch) · callout (text, optional, 2 × 48 ch) · figure
  (graphic) · caption (text, optional, 2 × 60 ch).
  Tokens: surface accent border-bright text-muted font-sans font-head text
  teal amber coral.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
