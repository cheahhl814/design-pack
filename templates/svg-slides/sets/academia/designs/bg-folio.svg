<!--
design-pack · svg-slides · academia · bg-folio
  Background: a single hairline gold frame, a running-head double rule near
  the top and a foot rule with a gold square at the left, like a manuscript
  folio.
  Content zone: x 80–1200, y 120–610 (between the running head and the foot).
  Tokens: surface border-bright accent.
  Generated by bin/draw-slide-sets.js (edit there, then re-run); slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Warm dark background with a single thin inner frame, a running-head double rule at the top and a foot rule with a small gold square" data-decor-only="true" style="width:100%;height:auto">
  <title>Dark Academia folio background</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#f1e7d2)"/>
  <rect x="30" y="30" width="1220" height="660" style="fill:none;stroke:var(--border-bright,#a38c57);stroke-width:1"/>
  <line x1="80" y1="88" x2="1200" y2="88" style="fill:none;stroke:color-mix(in srgb, var(--accent,#8f6b1d) 70%, transparent);stroke-width:2"/>
  <line x1="80" y1="95" x2="1200" y2="95" style="fill:none;stroke:color-mix(in srgb, var(--accent,#8f6b1d) 55%, transparent);stroke-width:1"/>
  <line x1="80" y1="1200" x2="640" y2="1200" style="fill:none;stroke:color-mix(in srgb, var(--accent,#8f6b1d) 55%, transparent);stroke-width:1"/>
  <rect x="80" y="648" width="14" height="14" style="fill:var(--accent,#8f6b1d)"/>
</svg>
