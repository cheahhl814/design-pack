<!--
html-template-pack · svg-slides · full-diagram
  Diagram slide (1280x720): eyebrow + heading at the top, one large graphic
  panel (880 × 508 slot; an 800 × 450 library component scales to about
  880 × 495 and fills it) with a takeaway rail card on the right. The bottom
  44 px stay clear for a footer line.
  Slots: eyebrow (text, optional) · heading (text, 1 × 60 ch) · figure (graphic)
         · takeaway (text, optional).
  Tokens: teal amber text text-muted border-bright surface font-head font-sans.
  Compose with bin/compose-slide.js; slot rules in templates/svg-slides/README.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Diagram slide with a heading, a large diagram panel and a takeaway card on the right" style="width:100%;height:auto">
  <title>Diagram slide design</title>
  <rect x="0" y="0" width="1280" height="720" style="fill:var(--surface,#ffffff)"/>
  <g data-slot="eyebrow" data-slot-kind="text" data-slot-box="50 34 600 20" data-slot-font="head" data-slot-weight="700" data-slot-size="14" data-slot-tracking="1.2" data-slot-maxlines="1" data-slot-maxchars="48" data-slot-anchor="start" data-slot-fill="color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a))" data-slot-optional="true">
    <text x="50" y="50.1" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:14px;font-weight:700;fill:color-mix(in srgb, var(--teal,#0d9488) 70%, var(--text,#0f172a));letter-spacing:1.2px">EYEBROW · CONTEXT</text>
  </g>
  <g data-slot="heading" data-slot-kind="text" data-slot-box="50 58 1180 48" data-slot-font="head" data-slot-weight="700" data-slot-size="36" data-slot-maxlines="1" data-slot-maxchars="60" data-slot-anchor="start" data-slot-fill="var(--text,#0f172a)">
    <text x="50" y="99.4" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:36px;font-weight:700;fill:var(--text,#0f172a)">Heading for a full-width diagram</text>
  </g>
  <line x1="50" y1="118" x2="100" y2="118" style="stroke:var(--teal,#0d9488);stroke-width:5" stroke-linecap="round"/>
  <line x1="112" y1="118" x2="122" y2="118" style="stroke:var(--amber,#f59e0b);stroke-width:5" stroke-linecap="round"/>
  <!-- diagram panel -->
  <rect x="40" y="128" width="900" height="520" rx="14" style="fill:color-mix(in srgb, var(--teal,#0d9488) 3%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--border-bright,#cbd5e1) 70%, transparent);stroke-width:1.5"/>
  <g data-slot="figure" data-slot-kind="graphic" data-slot-box="50 134 880 508">
    <rect x="50" y="140.5" width="880" height="495" rx="10" style="fill:color-mix(in srgb, var(--teal,#0d9488) 4%, transparent);stroke:var(--border-bright,#cbd5e1);stroke-width:1.5" stroke-dasharray="6 6"/>
    <rect x="400" y="374" width="36" height="28" rx="6" style="fill:color-mix(in srgb, var(--teal,#0d9488) 16%, var(--surface,#ffffff));stroke:var(--teal,#0d9488);stroke-width:2"/>
    <rect x="452" y="374" width="36" height="28" rx="6" style="fill:color-mix(in srgb, var(--amber,#f59e0b) 16%, var(--surface,#ffffff));stroke:var(--amber,#f59e0b);stroke-width:2"/>
    <rect x="504" y="374" width="36" height="28" rx="6" style="fill:color-mix(in srgb, var(--coral,#ef4444) 16%, var(--surface,#ffffff));stroke:var(--coral,#ef4444);stroke-width:2"/>
    <text x="490" y="436" text-anchor="middle" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:11px;font-weight:700;fill:var(--text-muted,#64748b);letter-spacing:1.2px">GRAPHIC SLOT</text>
    <text x="490" y="456" text-anchor="middle" style="font-family:var(--font-sans,ui-sans-serif,system-ui);font-size:12px;fill:var(--text-muted,#64748b)">an 800 × 450 svg-library component scales to fill this frame</text>
  </g>
  <!-- takeaway rail -->
  <rect x="964" y="128" width="276" height="520" rx="14" transform="translate(4 5)" style="fill:color-mix(in srgb, var(--teal,#0d9488) 12%, transparent);stroke:color-mix(in srgb, var(--teal,#0d9488) 35%, transparent);stroke-width:1.5"/>
  <rect x="964" y="128" width="276" height="520" rx="14" style="fill:color-mix(in srgb, var(--teal,#0d9488) 5%, var(--surface,#ffffff));stroke:color-mix(in srgb, var(--teal,#0d9488) 55%, var(--surface,#ffffff));stroke-width:2"/>
  <circle cx="990" cy="178" r="6" style="fill:var(--amber,#f59e0b)"/>
  <g data-slot="takeaway" data-slot-kind="text" data-slot-box="984 200 240 340" data-slot-font="head" data-slot-weight="600" data-slot-size="20" data-slot-maxlines="6" data-slot-maxchars="24" data-slot-anchor="start" data-slot-fill="var(--text,#0f172a)" data-slot-optional="true">
    <text x="984" y="223" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:600;fill:var(--text,#0f172a)">The one thing</text>
    <text x="984" y="248" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:600;fill:var(--text,#0f172a)">this diagram</text>
    <text x="984" y="273" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:600;fill:var(--text,#0f172a)">proves, in up</text>
    <text x="984" y="298" text-anchor="start" style="font-family:var(--font-head,ui-sans-serif,system-ui);font-size:20px;font-weight:600;fill:var(--text,#0f172a)">to six lines</text>
  </g>
  <line x1="984" y1="606" x2="1024" y2="606" style="stroke:var(--amber,#f59e0b);stroke-width:5" stroke-linecap="round"/>
</svg>
